[13,"Charing Cross",null]],"match":[["Charing Cross",13]],"aka":[]},{"id":"photo","type":"thing","first":6,"names":[[6,"The photograph",null]],"match":[["photograph",6,12]],"aka":[]},{"id":"note","type":"thing","first":3,"names":[[3,"The unsigned note",null]],"match":[["pink-tinted note-paper",3],["The note",3],["the note",3],["my note",4]],"aka":[]},{"id":"index","type":"thing","first":6,"names":[[6,"Holmes's index",null]],"match":[["my index",6]],"aka":[]},{"id":"rocket","type":"thing","first":10,"names":[[10,"The smoke-rocket",null]],"match":[["smoke-rocket",10],["rocket",10]],"aka":[]},{"id":"sovereign","type":"thing","first":9,"names":[[9,"Irene's sovereign",null]],"match":[],"aka":[]},{"id":"letter","type":"thing","first":13,"names":[[13,"Irene's letter",null]],"match":[["a letter",13],["this epistle",13]],"aka":[]},{"id":"irenephoto","type":"thing","first":13,"names":[[13,"Irene in evening dress",null]],"match":[["Irene's photograph",13],["This photograph",13],["her photograph",13]],"aka":[]},{"id":"ring","type":"thing","first":15,"names":[[15,"Emerald snake ring",null]],"match":[["emerald snake ring",15],["This ring",15]],"aka":[]}],"obs":[["holmes",1,"A cold, precise reasoner who scorns the softer passions.","the most perfect reasoning and observing machine that the world has seen"],["holmes",1,"Stays on in Baker Street, alternating between cocaine and ambition.","alternating from week to week between cocaine and ambition"],["watson",1,"Narrates; his marriage has drifted him away from Holmes.","My marriage had drifted us away from each other."],["irene",1,"The one woman Holmes sets above all others.","In his eyes she eclipses and predominates the whole of her sex."],["irene",1,"The narrator calls her \"the late Irene Adler\".","the late Irene Adler, of dubious and questionable memory"],["baker",1,"Holmes's lodgings, once shared with the narrator.","remained in our lodgings in Baker Street"],["watson",2,"Has gone back to civil practice as a doctor.","for I had now returned to civil practice"],["watson",2,"Has put on seven pounds since his marriage, by his own count.","you have put on seven and a half pounds since I saw you"],["holmes",2,"Reads Watson's wet walk and careless maid from the cuts on his shoe.","the leather is scored by six almost parallel cuts"],["holmes",2,"Knows there are seventeen steps up to his rooms.","I know that there are seventeen steps"],["baker",2,"Holmes's rooms were once partly Watson's.","the chamber which had formerly been in part my own"],["maryjane",2,"Watson's maid, \"incorrigible\".","As to Mary Jane, she is incorrigible"],["wife",2,"Has given Mary Jane notice.","my wife has given her notice"],["note",3,"Pink, undated and unsigned; announces a masked visitor at a quarter to eight.","a gentleman who desires to consult you upon a matter of the very deepest moment"],["note",3,"Written by a German on paper made in Bohemia.","And the man who wrote the note is a German."],["holmes",3,"Will not theorize without data.","It is a capital mistake to theorize before one has data."],["bohemia",3,"German-speaking country where the paper was made.","The paper was made in Bohemia"],["egria",3,"Bohemian town of glass-factories and paper-mills; the \"Eg\" in the watermark.","for its numerous glass-factories and paper-mills"],["king",4,"A masked giant in rich, barbaric dress, with a German accent.","a black vizard mask"],["king",4,"Introduces himself as the Count Von Kramm, a Bohemian nobleman.","You may address me as the Count Von Kramm, a Bohemian nobleman."],["king",4,"Admits the title he gave is not his own.","the title by which I have just called myself is not exactly my own"],["watson",4,"Holmes insists he stays for the consultation.","It is both, or none"],["ormstein",4,"Hereditary kings of Bohemia.","the great House of Ormstein, hereditary kings of Bohemia"],["king",5,"Tears off his mask: he is the King of Bohemia.","he tore the mask from his face and hurled it upon the ground"],["king",5,"Has come to London incognito from Prague.","I have come incognito from Prague"],["holmes",5,"Knew who the King was before he unmasked.","Your Majesty had not spoken before I was aware"],["king",6,"Met Irene Adler in Warsaw five years ago.","Some five years ago, during a lengthy visit to Warsaw"],["king",6,"Has tried five times to recover the photograph.","Five attempts have been made."],["king",6,"Is to be married; the betrothal is announced next Monday.","That will be next Monday."],["irene",6,"Born in New Jersey, 1858; a contralto, once prima donna in Warsaw.","Born in New Jersey in the year 1858."],["irene",6,"Holds a photograph of herself with the King and will not sell it.","She will not sell."],["irene",6,"Threatens to send it to the bride's family.","Threatens to send them the photograph."],["irene",6,"Has \"a soul of steel\", in the King's words.","she has a soul of steel"],["photo",6,"Shows the King and Irene together.","We were both in the photograph."],["clotilde",6,"The King's bride-to-be, second daughter of the King of Scandinavia.","To Clotilde Lothman von Saxe-Meningen, second daughter of the King of Scandinavia."],["clotilde",6,"From a family of strict principles.","You may know the strict principles of her family."],["index",6,"Holmes files paragraphs on men and things; Irene sits between a rabbi and a staff-commander.","a system of docketing all paragraphs concerning men and things"],["warsaw",6,"Irene was prima donna of its Imperial Opera.","Prima donna Imperial Opera of Warsaw"],["king",7,"Stays at the Langham under the Count's name.","You will find me at the Langham under the name of the Count Von Kramm."],["king",7,"Gives Holmes £1,000 for expenses.","There are three hundred pounds in gold and seven hundred in notes"],["photo",7,"Cabinet size.","Was the photograph a cabinet?"],["briony",7,"Irene's address in St. John's Wood.","Is Briony Lodge, Serpentine Avenue, St. John's Wood."],["holmes",8,"Spends the morning disguised as a groom out of work.","a drunken-looking groom, ill-kempt and side-whiskered"],["turner",8,"Tells Watson that Holmes went out just after eight.","The landlady informed me that he had left the house shortly after eight o'clock in the morning."],["irene",8,"Lives quietly: sings at concerts, drives out at five, home at seven.","She lives quietly, sings at concerts, drives out at five every day"],["godfrey",8,"Irene's only male visitor, calling once or twice a day.","Has only one male visitor, but a good deal of him."],["godfrey",8,"A lawyer of the Inner Temple.","He is a Mr. Godfrey Norton, of the Inner Temple."],["briony",8,"A two-storey villa with a Chubb lock and a large sitting-room.","It is a bijou villa, with a garden at the back"],["mews",8,"Where Holmes gets gossip from the ostlers.","I lent the ostlers a hand in rubbing down their horses"],["godfrey",9,"Dark, aquiline and moustached; arrives at Briony Lodge in a hurry.","He was a remarkably handsome man, dark, aquiline, and moustached"],["godfrey",9,"Needs a witness within three minutes or the marriage is not legal.","only three minutes, or it won't be legal"],["irene",9,"Marries Godfrey Norton at the Church of St. Monica.","assisting in the secure tying up of Irene Adler, spinster, to Godfrey Norton, bachelor"],["holmes",9,"Is pulled in as the witness at the wedding.","the clergyman absolutely refused to marry them without a witness"],["john",9,"Irene's coachman, told to race to St. Monica.","'The Church of St. Monica, John,' she cried"],["clergyman",9,"Refuses to marry them without a witness.","the clergyman absolutely refused to marry them without a witness of some sort"],["sovereign",9,"The bride's gift; Holmes will wear it on his watch-chain.","I mean to wear it on my watch-chain in memory of the occasion"],["stmonica",9,"A church on the Edgeware Road.","the Church of St. Monica in the Edgeware Road"],["watson",10,"Agrees to break the law for Holmes.","You don't mind breaking the law?"],["holmes",10,"Disguises himself as a Nonconformist clergyman.","an amiable and simple-minded Nonconformist clergyman"],["rocket",10,"An ordinary plumber's smoke-rocket, self-lighting.","It is an ordinary plumber's smoke-rocket"],["turner",10,"Brings in the tray: her name is Mrs. Turner.","When Mrs. Turner has brought in the tray"],["photo",11,"Too big to carry hidden, so Holmes reasons it is in her house.","It must be in her own house."],["crowd",11,"Loafers, guardsmen and a scissors-grinder start a brawl as Irene arrives.","A fierce quarrel broke out"],["holmes",11,"Falls in the brawl, bleeding from the face.","he gave a cry and dropped to the ground, with the blood running freely down his face"],["irene",11,"Has the injured clergyman carried into her sitting-room.","Bring him into the sitting-room."],["watson",11,"Throws the smoke-rocket in and raises the cry of fire.","I tossed my rocket into the room with a cry of"],["watson",11,"Feels ashamed of deceiving her.","I never felt more heartily ashamed of myself in my life"],["holmes",12,"Faked the injury with red paint.","I had a little moist red paint in the palm of my hand."],["crowd",12,"All engaged by Holmes for the evening.","They were all engaged for the evening."],["irene",12,"Ran straight to the photograph when she heard \"Fire!\".","She was there in an instant"],["photo",12,"In a recess behind a sliding panel above the right bell-pull.","The photograph is in a recess behind a sliding panel just above the right bell-pull."],["john",12,"Watched Holmes closely after the alarm.","the coachman had come in, and as he was watching me narrowly"],["youth",12,"Says good-night to Holmes on the Baker Street pavement.","the greeting appeared to come from a slim youth in an ulster who had hurried by"],["youth",12,"Holmes has heard the voice before.","I've heard that voice before"],["king",13,"Wishes Irene had been of his own station.","What a queen she would have made!"],["servant",13,"Waits on the steps and watches them arrive.","She watched us with a sardonic eye"],["irene",13,"Left for the Continent with her husband before Holmes arrived.","She left this morning with her husband by the 5:15 train from Charing Cross for the Continent."],["holmes",13,"Is stunned to find her gone.","Sherlock Holmes staggered back, white with chagrin and surprise."],["briony",13,"Found ransacked and empty.","The furniture was scattered about in every direction"],["irenephoto",13,"Left behind the sliding shutter in place of the other.","The photograph was of Irene Adler herself in evening dress"],["letter",13,"Left with the photograph, \"To be left till called for\".","To be left till called for."],["irene",14,"Trained as an actress.","I have been trained as an actress myself."],["irene",14,"Had been warned about Holmes months before.","I had been warned against you months ago."],["irene",14,"Was the youth who wished Holmes good-night.","Then I, rather imprudently, wished you good-night"],["irene",14,"Keeps the photograph only to protect herself.","I keep it only to safeguard myself"],["john",14,"Irene sent him to watch Holmes.","I sent John, the coachman, to watch you"],["photo",14,"Irene takes it with her.","As to the photograph, your client may rest in peace."],["letter",14,"Signed \"Irene Norton, née Adler\".","IRENE NORTON, née ADLER."],["king",15,"Trusts that Irene will keep her word.","I know that her word is inviolate."],["king",15,"Gives Holmes Irene's photograph.","Certainly, if you wish it."],["holmes",15,"Asks for her photograph as his only reward.","Your Majesty has something which I should value even more highly"],["holmes",15,"His best plans were beaten by Irene's wit.","the best plans of Mr. Sherlock Holmes were beaten by a woman's wit"],["photo",15,"Now \"as safe as if it were in the fire\".","The photograph is now as safe as if it were in the fire."],["ring",15,"Offered by the King as a reward; Holmes asks for something else.","He slipped an emerald snake ring from his finger"]],"rels":[["watson","holmes","old friend of",1,"my 's wit"},{"q":"Who wrote the unsigned note?","about":["note"],"raised":3,"rq":"The note was undated, and without either signature or address.","answered":4,"a":"The masked visitor.","aq":"You had my note?"},{"q":"Who is the masked visitor really?","about":["king"],"raised":4,"rq":"the title by which I have just called myself is not exactly my own","answered":5,"a":"Wilhelm von Ormstein, King of Bohemia.","aq":"Wilhelm Gottsreich Sigismond von Ormstein, Grand Duke of Cassel-Felstein, and hereditary King of Bohemia"},{"q":"Where is the photograph hidden?","about":["photo","irene"],"raised":6,"rq":"Twice burglars in my pay ransacked her house.","answered":12,"a":"Behind a sliding panel above the right bell-pull at Briony Lodge.","aq":"The photograph is in a recess behind a sliding panel just above the right bell-pull."},{"q":"What is Godfrey Norton to Irene Adler?","about":["godfrey","irene"],"raised":8,"rq":"Was she his client, his friend, or his mistress?","answered":9,"a":"Her husband, as of this morning.","aq":"assisting in the secure tying up of Irene Adler, spinster, to Godfrey Norton, bachelor"},{"q":"What is Holmes planning for the evening?","about":["holmes"],"raised":10,"rq":"You must leave that to me.","answered":12,"a":"A staged brawl and a false fire alarm, so Irene would show him the hiding place.","aq":"everyone in the street was an accomplice"},{"q":"Who was the slim youth who said good-night?","about":["youth"],"raised":12,"rq":"Now, I wonder who the deuce that could have been.","answered":14,"a":"Irene Adler, in male costume.","aq":"Male costume is nothing new to me."},{"q":"Will the King get the photograph back?","about":["photo","king"],"raised":13,"rq":"And the papers?","answered":14,"a":"No. Irene keeps it as protection and promises not to use it.","aq":"I keep it only to safeguard myself"}]},{"id":"red-headed-league","book":{"title":"The Red-Headed League","author":"Arthur Conan Doyle","year":1891,"source":"Project Gutenberg eBook #1661, The Adventures of Sherlock Holmes, Adventure II"},"defaultPos":1,"parts":[],"scenes":[{"id":1,"title":"A red-headed client","place":"baker","present":["holmes","watson","wilson"],"mentioned":[],"part":null,"paras":["I had called upon my friend, Mr. Sherlock Holmes, one day in the autumn of last year and found him in deep conversation with a very stout, florid-faced, elderly gentleman with fiery red hair. With an apology for my intrusion, I was about to withdraw when Holmes pulled me abruptly into the room and closed the door behind me.","\"You could not possibly have come at a better time, my dear Watson,\" he said cordially.","\"I was afraid that you were engaged.\"","\"So I am. Very much so.\"","\"Then I can wait in the next room.\"","\"Not at all. This gentleman, Mr. Wilson, has been my partner and helper in many of my most successful cases, and I have no doubt that he will be of the utmost use to me in yours also.\"","The stout gentleman half rose from his chair and gave a bob of greeting, with a quick little questioning glance from his small fat-encircled eyes.","\"Try the settee,\" said Holmes, relapsing into his armchair and putting his fingertips together, as was his custom when in judicial moods. \"I know, my dear Watson, that you share my love of all that is bizarre and outside the conventions and humdrum routine of everyday life. You have shown your relish for it by the enthusiasm which has prompted you to chronicle, and, if you will excuse my saying so, somewhat to embellish so many of my own little adventures.\"","\"Your cases have indeed been of the greatest interest to me,\" I observed.","\"You will remember that I remarked the other day, just before we went into the very simple problem presented by Miss Mary Sutherland, that for strange effects and extraordinary combinations we must go to life itself, which is always far more daring than any effort of the imagination.\"","\"A proposition which I took the liberty of doubting.\"","\"You did, Doctor, but none the less you must come round to my view, for otherwise I shall keep on piling fact upon fact on you until your reason breaks down under them and acknowledges me to be right. Now, Mr. Jabez Wilson here has been good enough to call upon me this morning, and to begin a narrative which promises to be one of the most singular which I have listened to for some time. You have heard me remark that the strangest and most unique things are very often connected not with the larger but with the smaller crimes, and occasionally, indeed, where there is room for doubt whether any positive crime has been committed. As far as I have heard it is impossible for me to say whether the present case is an instance of crime or not, but the course of events is certainly among the most singular that I have ever listened to. Perhaps, Mr. Wilson, you would have the great kindness to recommence your narrative. I ask you not merely because my friend Dr. Watson has not heard the opening part but also because the peculiar nature of the story makes me anxious to have every possible detail from your lips. As a rule, when I have heard some slight indication of the course of events, I am able to guide myself by the thousands of other similar cases which occur to my memory. In the present instance I am forced to admit that the facts are, to the best of my belief, unique.\"","The portly client puffed out his chest with an appearance of some little pride and pulled a dirty and wrinkled newspaper from the inside pocket of his greatcoat. As he glanced down the advertisement column, with his head thrust forward and the paper flattened out upon his knee, I took a good look at the man and endeavoured, after the fashion of my companion, to read the indications which might be presented by his dress or appearance.","I did not gain very much, however, by my inspection. Our visitor bore every mark of being an average commonplace British tradesman, obese, pompous, and slow. He wore rather baggy grey shepherd's check trousers, a not over-clean black frock-coat, unbuttoned in the front, and a drab waistcoat with a heavy brassy Albert chain, and a square pierced bit of metal dangling down as an ornament. A frayed top-hat and a faded brown overcoat with a wrinkled velvet collar lay upon a chair beside him. Altogether, look as I would, there was nothing remarkable about the man save his blazing red head, and the expression of extreme chagrin and discontent upon his features.","Sherlock Holmes' quick eye took in my occupation, and he shook his head with a smile as he noticed my questioning glances. \"Beyond the obvious facts that he has at some time done manual labour, that he takes snuff, that he is a Freemason, that he has been in China, and that he has done a considerable amount of writing lately, I can deduce nothing else.\"","Mr. Jabez Wilson started up in his chair, with his forefinger upon the paper, but his eyes upon my companion.","\"How, in the name of good-fortune, did you know all that, Mr. Holmes?\" he asked. \"How did you know, for example, that I did manual labour. It's as true as gospel, for I began as a ship's carpenter.\"","\"Your hands, my dear sir. Your right hand is quite a size larger than your left. You have worked with it, and the muscles are more developed.\"","\"Well, the snuff, then, and the Freemasonry?\"","\"I won't insult your intelligence by telling you how I read that, especially as, rather against the strict rules of your order, you use an arc-and-compass breastpin.\"","\"Ah, of course, I forgot that. But the writing?\"","\"What else can be indicated by that right cuff so very shiny for five inches, and the left one with the smooth patch near the elbow where you rest it upon the desk?\"","\"Well, but China?\"","\"The fish that you have tattooed immediately above your right wrist could only have been done in China. I have made a small study of tattoo marks and have even contributed to the literature of the subject. That trick of staining the fishes' scales of a delicate pink is quite peculiar to China. When, in addition, I see a Chinese coin hanging from your watch-chain, the matter becomes even more simple.\"","Mr. Jabez Wilson laughed heavily. \"Well, I never!\" said he. \"I thought at first that you had done something clever, but I see that there was nothing in it, after all.\"","\"I begin to think, Watson,\" said Holmes, \"that I make a mistake in explaining. 'Omne ignotum pro magnifico,' you know, and my poor little reputation, such as it is, will suffer shipwreck if I am so candid. Can you not find the advertisement, Mr. Wilson?\"","\"Yes, I have got it now,\" he answered with his thick red finger planted halfway down the column. \"Here it is. This is what began it all. You just read it for yourself, sir.\""]},{"id":2,"title":"The advertisement","place":"baker","present":["holmes","watson","wilson"],"mentioned":["ad","league","hopkins","ross","popescourt","lebanon"],"part":null,"paras":["I took the paper from him and read as follows:","\"TO THE RED-HEADED LEAGUE: On account of the bequest of the late Ezekiah Hopkins, of Lebanon, Pennsylvania, U. S. A., there is now another vacancy open which entitles a member of the League to a salary of 4 pounds a week for purely nominal services. All red-headed men who are sound in body and mind and above the age of twenty-one years, are eligible. Apply in person on Monday, at eleven o'clock, to Duncan Ross, at the offices of the League, 7 Pope's Court, Fleet Street.\"","\"What on earth does this mean?\" I ejaculated after I had twice read over the extraordinary announcement.","Holmes chuckled and wriggled in his chair, as was his habit when in high spirits. \"It is a little off the beaten track, isn't it?\" said he. \"And now, Mr. Wilson, off you go at scratch and tell us all about yourself, your household, and the effect which this advertisement had upon your fortunes. You will first make a note, Doctor, of the paper and the date.\"","\"It is The Morning Chronicle of April 27, 1890. Just two months ago.\"","\"Very good. Now, Mr. Wilson?\""]},{"id":3,"title":"Wilson's assistant","place":"pawnshop","present":["wilson","spaulding"],"mentioned":["girl","square","ad","league","hopkins"],"part":null,"paras":["\"Well, it is just as I have been telling you, Mr. Sherlock Holmes,\" said Jabez Wilson, mopping his forehead; \"I have a small pawnbroker's business at Coburg Square, near the City. It's not a very large affair, and of late years it has not done more than just give me a living. I used to be able to keep two assistants, but now I only keep one; and I would have a job to pay him but that he is willing to come for half wages so as to learn the business.\"","\"What is the name of this obliging youth?\" asked Sherlock Holmes.","\"His name is Vincent Spaulding, and he's not such a youth, either. It's hard to say his age. I should not wish a smarter assistant, Mr. Holmes; and I know very well that he could better himself and earn twice what I am able to give him. But, after all, if he is satisfied, why should I put ideas in his head?\"","\"Why, indeed? You seem most fortunate in having an employé who comes under the full market price. It is not a common experience among employers in this age. I don't know that your assistant is not as remarkable as your advertisement.\"","\"Oh, he has his faults, too,\" said Mr. Wilson. \"Never was such a fellow for photography. Snapping away with a camera when he ought to be improving his mind, and then diving down into the cellar like a rabbit into its hole to develop his pictures. That is his main fault, but on the whole he's a good worker. There's no vice in him.\"","\"He is still with you, I presume?\"","\"Yes, sir. He and a girl of fourteen, who does a bit of simple cooking and keeps the place clean—that's all I have in the house, for I am a widower and never had any family. We live very quietly, sir, the three of us; and we keep a roof over our heads and pay our debts, if we do nothing more.","\"The first thing that put us out was that advertisement. Spaulding, he came down into the office just this day eight weeks, with this very paper in his hand, and he says:","\"'I wish to the Lord, Mr. Wilson, that I was a red-headed man.'","\"'Why that?' I asks.","\"'Why,' says he, 'here's another vacancy on the League of the Red-headed Men. It's worth quite a little fortune to any man who gets it, and I understand that there are more vacancies than there are men, so that the trustees are at their wits' end what to do with the money. If my hair would only change colour, here's a nice little crib all ready for me to step into.'","\"'Why, what is it, then?' I asked. You see, Mr. Holmes, I am a very stay-at-home man, and as my business came to me instead of my having to go to it, I was often weeks on end without putting my foot over the door-mat. In that way I didn't know much of what was going on outside, and I was always glad of a bit of news.","\"'Have you never heard of the League of the Red-headed Men?' he asked with his eyes open.","\"'Never.'","\"'Why, I wonder at that, for you are eligible yourself for one of the vacancies.'","\"'And what are they worth?' I asked.","\"'Oh, merely a couple of hundred a year, but the work is slight, and it need not interfere very much with one's other occupations.'","\"Well, you can easily think that that made me prick up my ears, for the business has not been over-good for some years, and an extra couple of hundred would have been very handy.","\"'Tell me all about it,' said I.","\"'Well,' said he, showing me the advertisement, 'you can see for yourself that the League has a vacancy, and there is the address where you should apply for particulars. As far as I can make out, the League was founded by an American millionaire, Ezekiah Hopkins, who was very peculiar in his ways. He was himself red-headed, and he had a great sympathy for all red-headed men; so when he died it was found that he had left his enormous fortune in the hands of trustees, with instructions to apply the interest to the providing of easy berths to men whose hair is of that colour. From all I hear it is splendid pay and very little to do.'","\"'But,' said I, 'there would be millions of red-headed men who would apply.'","\"'Not so many as you might think,' he answered. 'You see it is really confined to Londoners, and to grown men. This American had started from London when he was young, and he wanted to do the old town a good turn. Then, again, I have heard it is no use your applying if your hair is light red, or dark red, or anything but real bright, blazing, fiery red. Now, if you cared to apply, Mr. Wilson, you would just walk in; but perhaps it would hardly be worth your while to put yourself out of the way for the sake of a few hundred pounds.'","\"Now, it is a fact, gentlemen, as you may see for yourselves, that my hair is of a very full and rich tint, so that it seemed to me that if there was to be any competition in the matter I stood as good a chance as any man that I had ever met. Vincent Spaulding seemed to know so much about it that I thought he might prove useful, so I just ordered him to put up the shutters for the day and to come right away with me. He was very willing to have a holiday, so we shut the business up and started off for the address that was given us in the advertisement."]},{"id":4,"title":"Pope's Court","place":"popescourt","present":["wilson","spaulding","ross"],"mentioned":["league","encyclopaedia"],"part":null,"paras":["\"I never hope to see such a sight as that again, Mr. Holmes. From north, south, east, and west every man who had a shade of red in his hair had tramped into the city to answer the advertisement. Fleet Street was choked with red-headed folk, and Pope's Court looked like a coster's orange barrow. I should not have thought there were so many in the whole country as were brought together by that single advertisement. Every shade of colour they were—straw, lemon, orange, brick, Irish-setter, liver, clay; but, as Spaulding said, there were not many who had the real vivid flame-coloured tint. When I saw how many were waiting, I would have given it up in despair; but Spaulding would not hear of it. How he did it I could not imagine, but he pushed and pulled and butted until he got me through the crowd, and right up to the steps which led to the office. There was a double stream upon the stair, some going up in hope, and some coming back dejected; but we wedged in as well as we could and soon found ourselves in the office.\"","\"Your experience has been a most entertaining one,\" remarked Holmes as his client paused and refreshed his memory with a huge pinch of snuff. \"Pray continue your very interesting statement.\"","\"There was nothing in the office but a couple of wooden chairs and a deal table, behind which sat a small man with a head that was even redder than mine. He said a few words to each candidate as he came up, and then he always managed to find some fault in them which would disqualify them. Getting a vacancy did not seem to be such a very easy matter, after all. However, when our turn came the little man was much more favourable to me than to any of the others, and he closed the door as we entered, so that he might have a private word with us.","\"'This is Mr. Jabez Wilson,' said my assistant, 'and he is willing to fill a vacancy in the League.'","\"'And he is admirably suited for it,' the other answered. 'He has every requirement. I cannot recall when I have seen anything so fine.' He took a step backward, cocked his head on one side, and gazed at my hair until I felt quite bashful. Then suddenly he plunged forward, wrung my hand, and congratulated me warmly on my success.","\"'It would be injustice to hesitate,' said he. 'You will, however, I am sure, excuse me for taking an obvious precaution.' With that he seized my hair in both his hands, and tugged until I yelled with the pain. 'There is water in your eyes,' said he as he released me. 'I perceive that all is as it should be. But we have to be careful, for we have twice been deceived by wigs and once by paint. I could tell you tales of cobbler's wax which would disgust you with human nature.' He stepped over to the window and shouted through it at the top of his voice that the vacancy was filled. A groan of disappointment came up from below, and the folk all trooped away in different directions until there was not a red-head to be seen except my own and that of the manager.","\"'My name,' said he, 'is Mr. Duncan Ross, and I am myself one of the pensioners upon the fund left by our noble benefactor. Are you a married man, Mr. Wilson? Have you a family?'","\"I answered that I had not.","\"His face fell immediately.","\"'Dear me!' he said gravely, 'that is very serious indeed! I am sorry to hear you say that. The fund was, of course, for the propagation and spread of the red-heads as well as for their maintenance. It is exceedingly unfortunate that you should be a bachelor.'","\"My face lengthened at this, Mr. Holmes, for I thought that I was not to have the vacancy after all; but after thinking it over for a few minutes he said that it would be all right.","\"'In the case of another,' said he, 'the objection might be fatal, but we must stretch a point in favour of a man with such a head of hair as yours. When shall you be able to enter upon your new duties?'","\"'Well, it is a little awkward, for I have a business already,' said I.","\"'Oh, never mind about that, Mr. Wilson!' said Vincent Spaulding. 'I should be able to look after that for you.'","\"'What would be the hours?' I asked.","\"'Ten to two.'","\"Now a pawnbroker's business is mostly done of an evening, Mr. Holmes, especially Thursday and Friday evening, which is just before pay-day; so it would suit me very well to earn a little in the mornings. Besides, I knew that my assistant was a good man, and that he would see to anything that turned up.","\"'That would suit me very well,' said I. 'And the pay?'","\"'Is 4 pounds a week.'","\"'And the work?'","\"'Is purely nominal.'","\"'What do you call purely nominal?'","\"'Well, you have to be in the office, or at least in the building, the whole time. If you leave, you forfeit your whole position forever. The will is very clear upon that point. You don't comply with the conditions if you budge from the office during that time.'","\"'It's only four hours a day, and I should not think of leaving,' said I.","\"'No excuse will avail,' said Mr. Duncan Ross; 'neither sickness nor business nor anything else. There you must stay, or you lose your billet.'","\"'And the work?'","\"'Is to copy out the \"Encyclopaedia Britannica.\" There is the first volume of it in that press. You must find your own ink, pens, and blotting-paper, but we provide this table and chair. Will you be ready to-morrow?'","\"'Certainly,' I answered.","\"'Then, good-bye, Mr. Jabez Wilson, and let me congratulate you once more on the important position which you have been fortunate enough to gain.' He bowed me out of the room and I went home with my assistant, hardly knowing what to say or do, I was so pleased at my own good fortune."]},{"id":5,"title":"Copying the Encyclopaedia","place":"popescourt","present":["wilson","ross"],"mentioned":["spaulding","encyclopaedia"],"part":null,"paras":["\"Well, I thought over the matter all day, and by evening I was in low spirits again; for I had quite persuaded myself that the whole affair must be some great hoax or fraud, though what its object might be I could not imagine. It seemed altogether past belief that anyone could make such a will, or that they would pay such a sum for doing anything so simple as copying out the 'Encyclopaedia Britannica.' Vincent Spaulding did what he could to cheer me up, but by bedtime I had reasoned myself out of the whole thing. However, in the morning I determined to have a look at it anyhow, so I bought a penny bottle of ink, and with a quill-pen, and seven sheets of foolscap paper, I started off for Pope's Court.","\"Well, to my surprise and delight, everything was as right as possible. The table was set out ready for me, and Mr. Duncan Ross was there to see that I got fairly to work. He started me off upon the letter A, and then he left me; but he would drop in from time to time to see that all was right with me. At two o'clock he bade me good-day, complimented me upon the amount that I had written, and locked the door of the office after me.","\"This went on day after day, Mr. Holmes, and on Saturday the manager came in and planked down four golden sovereigns for my week's work. It was the same next week, and the same the week after. Every morning I was there at ten, and every afternoon I left at two. By degrees Mr. Duncan Ross took to coming in only once of a morning, and then, after a time, he did not come in at all. Still, of course, I never dared to leave the room for an instant, for I was not sure when he might come, and the billet was such a good one, and suited me so well, that I would not risk the loss of it.","\"Eight weeks passed away like this, and I had written about Abbots and Archery and Armour and Architecture and Attica, and hoped with diligence that I might get on to the B's before very long. It cost me something in foolscap, and I had pretty nearly filled a shelf with my writings. And then suddenly the whole business came to an end.\""]},{"id":6,"title":"Dissolved","place":"popescourt","present":["wilson","landlord"],"mentioned":["notice","league","ross","kingedward","holmes","watson","square"],"part":null,"paras":["\"To an end?\"","\"Yes, sir. And no later than this morning. I went to my work as usual at ten o'clock, but the door was shut and locked, with a little square of cardboard hammered on to the middle of the panel with a tack. Here it is, and you can read for yourself.\"","He held up a piece of white cardboard about the size of a sheet of note-paper. It read in this fashion:","THE RED-HEADED LEAGUE","IS","DISSOLVED.","October 9, 1890.","Sherlock Holmes and I surveyed this curt announcement and the rueful face behind it, until the comical side of the affair so completely overtopped every other consideration that we both burst out into a roar of laughter.","\"I cannot see that there is anything very funny,\" cried our client, flushing up to the roots of his flaming head. \"If you can do nothing better than laugh at me, I can go elsewhere.\"","\"No, no,\" cried Holmes, shoving him back into the chair from which he had half risen. \"I really wouldn't miss your case for the world. It is most refreshingly unusual. But there is, if you will excuse my saying so, something just a little funny about it. Pray what steps did you take when you found the card upon the door?\"","\"I was staggered, sir. I did not know what to do. Then I called at the offices round, but none of them seemed to know anything about it. Finally, I went to the landlord, who is an accountant living on the ground-floor, and I asked him if he could tell me what had become of the Red-headed League. He said that he had never heard of any such body. Then I asked him who Mr. Duncan Ross was. He answered that the name was new to him.","\"'Well,' said I, 'the gentleman at No. 4.'","\"'What, the red-headed man?'","\"'Yes.'","\"'Oh,' said he, 'his name was William Morris. He was a solicitor and was using my room as a temporary convenience until his new premises were ready. He moved out yesterday.'","\"'Where could I find him?'","\"'Oh, at his new offices. He did tell me the address. Yes, 17 King Edward Street, near St. Paul's.'","\"I started off, Mr. Holmes, but when I got to that address it was a manufactory of artificial knee-caps, and no one in it had ever heard of either Mr. William Morris or Mr. Duncan Ross.\"","\"And what did you do then?\" asked Holmes.","\"I went home to Saxe-Coburg Square, and I took the advice of my assistant. But he could not help me in any way. He could only say that if I waited I should hear by post. But that was not quite good enough, Mr. Holmes. I did not wish to lose such a place without a struggle, so, as I had heard that you were good enough to give advice to poor folk who were in need of it, I came right away to you.\"","\"And you did very wisely,\" said Holmes. \"Your case is an exceedingly remarkable one, and I shall be happy to look into it. From what you have told me I think that it is possible that graver issues hang from it than might at first sight appear.\"","\"Grave enough!\" said Mr. Jabez Wilson. \"Why, I have lost four pound a week.\"","\"As far as you are personally concerned,\" remarked Holmes, \"I do not see that you have any grievance against this extraordinary league. On the contrary, you are, as I understand, richer by some 30 pounds, to say nothing of the minute knowledge which you have gained on every subject which comes under the letter A. You have lost nothing by them.\"","\"No, sir. But I want to find out about them, and who they are, and what their object was in playing this prank—if it was a prank—upon me. It was a pretty expensive joke for them, for it cost them two and thirty pounds.\""]},{"id":7,"title":"Questions about Spaulding","place":"baker","present":["holmes","watson","wilson"],"mentioned":["spaulding"],"part":null,"paras":["\"We shall endeavour to clear up these points for you. And, first, one or two questions, Mr. Wilson. This assistant of yours who first called your attention to the advertisement—how long had he been with you?\"","\"About a month then.\"","\"How did he come?\"","\"In answer to an advertisement.\"","\"Was he the only applicant?\"","\"No, I had a dozen.\"","\"Why did you pick him?\"","\"Because he was handy and would come cheap.\"","\"At half-wages, in fact.\"","\"Yes.\"","\"What is he like, this Vincent Spaulding?\"","\"Small, stout-built, very quick in his ways, no hair on his face, though he's not short of thirty. Has a white splash of acid upon his forehead.\"","Holmes sat up in his chair in considerable excitement. \"I thought as much,\" said he. \"Have you ever observed that his ears are pierced for earrings?\"","\"Yes, sir. He told me that a gipsy had done it for him when he was a lad.\"","\"Hum!\" said Holmes, sinking back in deep thought. \"He is still with you?\"","\"Oh, yes, sir; I have only just left him.\"","\"And has your business been attended to in your absence?\"","\"Nothing to complain of, sir. There's never very much to do of a morning.\"","\"That will do, Mr. Wilson. I shall be happy to give you an opinion upon the subject in the course of a day or two. To-day is Saturday, and I hope that by Monday we may come to a conclusion.\""]},{"id":8,"title":"A three pipe problem","place":"baker","present":["holmes","watson"],"mentioned":["sarasate","sthall"],"part":null,"paras":["\"Well, Watson,\" said Holmes when our visitor had left us, \"what do you make of it all?\"","\"I make nothing of it,\" I answered frankly. \"It is a most mysterious business.\"","\"As a rule,\" said Holmes, \"the more bizarre a thing is the less mysterious it proves to be. It is your commonplace, featureless crimes which are really puzzling, just as a commonplace face is the most difficult to identify. But I must be prompt over this matter.\"","\"What are you going to do, then?\" I asked.","\"To smoke,\" he answered. \"It is quite a three pipe problem, and I beg that you won't speak to me for fifty minutes.\" He curled himself up in his chair, with his thin knees drawn up to his hawk-like nose, and there he sat with his eyes closed and his black clay pipe thrusting out like the bill of some strange bird. I had come to the conclusion that he had dropped asleep, and indeed was nodding myself, when he suddenly sprang out of his chair with the gesture of a man who has made up his mind and put his pipe down upon the mantelpiece.","\"Sarasate plays at the St. James's Hall this afternoon,\" he remarked. \"What do you think, Watson? Could your patients spare you for a few hours?\"","\"I have nothing to do to-day. My practice is never very absorbing.\"","\"Then put on your hat and come. I am going through the City first, and we can have some lunch on the way. I observe that there is a good deal of German music on the programme, which is rather more to my taste than Italian or French. It is introspective, and I want to introspect. Come along!\""]},{"id":9,"title":"Saxe-Coburg Square","place":"square","present":["holmes","watson","spaulding"],"mentioned":["pawnshop","wilson","bank"],"part":null,"paras":["We travelled by the Underground as far as Aldersgate; and a short walk took us to Saxe-Coburg Square, the scene of the singular story which we had listened to in the morning. It was a poky, little, shabby-genteel place, where four lines of dingy two-storied brick houses looked out into a small railed-in enclosure, where a lawn of weedy grass and a few clumps of faded laurel-bushes made a hard fight against a smoke-laden and uncongenial atmosphere. Three gilt balls and a brown board with \"JABEZ WILSON\" in white letters, upon a corner house, announced the place where our red-headed client carried on his business. Sherlock Holmes stopped in front of it with his head on one side and looked it all over, with his eyes shining brightly between puckered lids. Then he walked slowly up the street, and then down again to the corner, still looking keenly at the houses. Finally he returned to the pawnbroker's, and, having thumped vigorously upon the pavement with his stick two or three times, he went up to the door and knocked. It was instantly opened by a bright-looking, clean-shaven young fellow, who asked him to step in.","\"Thank you,\" said Holmes, \"I only wished to ask you how you would go from here to the Strand.\"","\"Third right, fourth left,\" answered the assistant promptly, closing the door.","\"Smart fellow, that,\" observed Holmes as we walked away. \"He is, in my judgment, the fourth smartest man in London, and for daring I am not sure that he has not a claim to be third. I have known something of him before.\"","\"Evidently,\" said I, \"Mr. Wilson's assistant counts for a good deal in this mystery of the Red-headed League. I am sure that you inquired your way merely in order that you might see him.\"","\"Not him.\"","\"What then?\"","\"The knees of his trousers.\"","\"And what did you see?\"","\"What I expected to see.\"","\"Why did you beat the pavement?\"","\"My dear doctor, this is a time for observation, not for talk. We are spies in an enemy's country. We know something of Saxe-Coburg Square. Let us now explore the parts which lie behind it.\"","The road in which we found ourselves as we turned round the corner from the retired Saxe-Coburg Square presented as great a contrast to it as the front of a picture does to the back. It was one of the main arteries which conveyed the traffic of the City to the north and west. The roadway was blocked with the immense stream of commerce flowing in a double tide inward and outward, while the footpaths were black with the hurrying swarm of pedestrians. It was difficult to realise as we looked at the line of fine shops and stately business premises that they really abutted on the other side upon the faded and stagnant square which we had just quitted.","\"Let me see,\" said Holmes, standing at the corner and glancing along the line, \"I should like just to remember the order of the houses here. It is a hobby of mine to have an exact knowledge of London. There is Mortimer's, the tobacconist, the little newspaper shop, the Coburg branch of the City and Suburban Bank, the Vegetarian Restaurant, and McFarlane's carriage-building depot. That carries us right on to the other block. And now, Doctor, we've done our work, so it's time we had some play. A sandwich and a cup of coffee, and then off to violin-land, where all is sweetness and delicacy and harmony, and there are no red-headed clients to vex us with their conundrums.\""]},{"id":10,"title":"At St. James's Hall","place":"sthall","present":["holmes","watson"],"mentioned":["sarasate","baker"],"part":null,"paras":["My friend was an enthusiastic musician, being himself not only a very capable performer but a composer of no ordinary merit. All the afternoon he sat in the stalls wrapped in the most perfect happiness, gently waving his long, thin fingers in time to the music, while his gently smiling face and his languid, dreamy eyes were as unlike those of Holmes the sleuth-hound, Holmes the relentless, keen-witted, ready-handed criminal agent, as it was possible to conceive. In his singular character the dual nature alternately asserted itself, and his extreme exactness and astuteness represented, as I have often thought, the reaction against the poetic and contemplative mood which occasionally predominated in him. The swing of his nature took him from extreme languor to devouring energy; and, as I knew well, he was never so truly formidable as when, for days on end, he had been lounging in his armchair amid his improvisations and his black-letter editions. Then it was that the lust of the chase would suddenly come upon him, and that his brilliant reasoning power would rise to the level of intuition, until those who were unacquainted with his methods would look askance at him as on a man whose knowledge was not that of other mortals. When I saw him that afternoon so enwrapped in the music at St. James's Hall I felt that an evil time might be coming upon those whom he had set himself to hunt down.","\"You want to go home, no doubt, Doctor,\" he remarked as we emerged.","\"Yes, it would be as well.\"","\"And I have some business to do which will take some hours. This business at Coburg Square is serious.\"","\"Why serious?\"","\"A considerable crime is in contemplation. I have every reason to believe that we shall be in time to stop it. But to-day being Saturday rather complicates matters. I shall want your help to-night.\"","\"At what time?\"","\"Ten will be early enough.\"","\"I shall be at Baker Street at ten.\"","\"Very well. And, I say, Doctor, there may be some little danger, so kindly put your army revolver in your pocket.\" He waved his hand, turned on his heel, and disappeared in an instant among the crowd."]},{"id":11,"title":"The party gathers","place":"baker","present":["holmes","watson","jones","merryweather"],"mentioned":["clay","spaulding","kensington","scotyard"],"part":null,"paras":["I trust that I am not more dense than my neighbours, but I was always oppressed with a sense of my own stupidity in my dealings with Sherlock Holmes. Here I had heard what he had heard, I had seen what he had seen, and yet from his words it was evident that he saw clearly not only what had happened but what was about to happen, while to me the whole business was still confused and grotesque. As I drove home to my house in Kensington I thought over it all, from the extraordinary story of the red-headed copier of the \"Encyclopaedia\" down to the visit to Saxe-Coburg Square, and the ominous words with which he had parted from me. What was this nocturnal expedition, and why should I go armed? Where were we going, and what were we to do? I had the hint from Holmes that this smooth-faced pawnbroker's assistant was a formidable man—a man who might play a deep game. I tried to puzzle it out, but gave it up in despair and set the matter aside until night should bring an explanation.","It was a quarter-past nine when I started from home and made my way across the Park, and so through Oxford Street to Baker Street. Two hansoms were standing at the door, and as I entered the passage I heard the sound of voices from above. On entering his room I found Holmes in animated conversation with two men, one of whom I recognised as Peter Jones, the official police agent, while the other was a long, thin, sad-faced man, with a very shiny hat and oppressively respectable frock-coat.","\"Ha! Our party is complete,\" said Holmes, buttoning up his pea-jacket and taking his heavy hunting crop from the rack. \"Watson, I think you know Mr. Jones, of Scotland Yard? Let me introduce you to Mr. Merryweather, who is to be our companion in to-night's adventure.\"","\"We're hunting in couples again, Doctor, you see,\" said Jones in his consequential way. \"Our friend here is a wonderful man for starting a chase. All he wants is an old dog to help him to do the running down.\"","\"I hope a wild goose may not prove to be the end of our chase,\" observed Mr. Merryweather gloomily.","\"You may place considerable confidence in Mr. Holmes, sir,\" said the police agent loftily. \"He has his own little methods, which are, if he won't mind my saying so, just a little too theoretical and fantastic, but he has the makings of a detective in him. It is not too much to say that once or twice, as in that business of the Sholto murder and the Agra treasure, he has been more nearly correct than the official force.\"","\"Oh, if you say so, Mr. Jones, it is all right,\" said the stranger with deference. \"Still, I confess that I miss my rubber. It is the first Saturday night for seven-and-twenty years that I have not had my rubber.\"","\"I think you will find,\" said Sherlock Holmes, \"that you will play for a higher stake to-night than you have ever done yet, and that the play will be more exciting. For you, Mr. Merryweather, the stake will be some 30,000 pounds; and for you, Jones, it will be the man upon whom you wish to lay your hands.\"","\"John Clay, the murderer, thief, smasher, and forger. He's a young man, Mr. Merryweather, but he is at the head of his profession, and I would rather have my bracelets on him than on any criminal in London. He's a remarkable man, is young John Clay. His grandfather was a royal duke, and he himself has been to Eton and Oxford. His brain is as cunning as his fingers, and though we meet signs of him at every turn, we never know where to find the man himself. He'll crack a crib in Scotland one week, and be raising money to build an orphanage in Cornwall the next. I've been on his track for years and have never set eyes on him yet.\"","\"I hope that I may have the pleasure of introducing you to-night. I've had one or two little turns also with Mr. John Clay, and I agree with you that he is at the head of his profession. It is past ten, however, and quite time that we started. If you two will take the first hansom, Watson and I will follow in the second.\""]},{"id":12,"title":"In the vault","place":"bank","present":["holmes","watson","jones","merryweather"],"mentioned":["gold"],"part":null,"paras":["Sherlock Holmes was not very communicative during the long drive and lay back in the cab humming the tunes which he had heard in the afternoon. We rattled through an endless labyrinth of gas-lit streets until we emerged into Farrington Street.","\"We are close there now,\" my friend remarked. \"This fellow Merryweather is a bank director, and personally interested in the matter. I thought it as well to have Jones with us also. He is not a bad fellow, though an absolute imbecile in his profession. He has one positive virtue. He is as brave as a bulldog and as tenacious as a lobster if he gets his claws upon anyone. Here we are, and they are waiting for us.\"","We had reached the same crowded thoroughfare in which we had found ourselves in the morning. Our cabs were dismissed, and, following the guidance of Mr. Merryweather, we passed down a narrow passage and through a side door, which he opened for us. Within there was a small corridor, which ended in a very massive iron gate. This also was opened, and led down a flight of winding stone steps, which terminated at another formidable gate. Mr. Merryweather stopped to light a lantern, and then conducted us down a dark, earth-smelling passage, and so, after opening a third door, into a huge vault or cellar, which was piled all round with crates and massive boxes.","\"You are not very vulnerable from above,\" Holmes remarked as he held up the lantern and gazed about him.","\"Nor from below,\" said Mr. Merryweather, striking his stick upon the flags which lined the floor. \"Why, dear me, it sounds quite hollow!\" he remarked, looking up in surprise.","\"I must really ask you to be a little more quiet!\" said Holmes severely. \"You have already imperilled the whole success of our expedition. Might I beg that you would have the goodness to sit down upon one of those boxes, and not to interfere?\"","The solemn Mr. Merryweather perched himself upon a crate, with a very injured expression upon his face, while Holmes fell upon his knees upon the floor and, with the lantern and a magnifying lens, began to examine minutely the cracks between the stones. A few seconds sufficed to satisfy him, for he sprang to his feet again and put his glass in his pocket.","\"We have at least an hour before us,\" he remarked, \"for they can hardly take any steps until the good pawnbroker is safely in bed. Then they will not lose a minute, for the sooner they do their work the longer time they will have for their escape. We are at present, Doctor—as no doubt you have divined—in the cellar of the City branch of one of the principal London banks. Mr. Merryweather is the chairman of directors, and he will explain to you that there are reasons why the more daring criminals of London should take a considerable interest in this cellar at present.\"","\"It is our French gold,\" whispered the director. \"We have had several warnings that an attempt might be made upon it.\"","\"Your French gold?\"","\"Yes. We had occasion some months ago to strengthen our resources and borrowed for that purpose 30,000 napoleons from the Bank of France. It has become known that we have never had occasion to unpack the money, and that it is still lying in our cellar. The crate upon which I sit contains 2,000 napoleons packed between layers of lead foil. Our reserve of bullion is much larger at present than is usually kept in a single branch office, and the directors have had misgivings upon the subject.\"","\"Which were very well justified,\" observed Holmes. \"And now it is time that we arranged our little plans. I expect that within an hour matters will come to a head. In the meantime Mr. Merryweather, we must put the screen over that dark lantern.\"","\"And sit in the dark?\"","\"I am afraid so. I had brought a pack of cards in my pocket, and I thought that, as we were a partie carrée, you might have your rubber after all. But I see that the enemy's preparations have gone so far that we cannot risk the presence of a light. And, first of all, we must choose our positions. These are daring men, and though we shall take them at a disadvantage, they may do us some harm unless we are careful. I shall stand behind this crate, and do you conceal yourselves behind those. Then, when I flash a light upon them, close in swiftly. If they fire, Watson, have no compunction about shooting them down.\"","I placed my revolver, cocked, upon the top of the wooden case behind which I crouched. Holmes shot the slide across the front of his lantern and left us in pitch darkness—such an absolute darkness as I have never before experienced. The smell of hot metal remained to assure us that the light was still there, ready to flash out at a moment's notice. To me, with my nerves worked up to a pitch of expectancy, there was something depressing and subduing in the sudden gloom, and in the cold dank air of the vault.","\"They have but one retreat,\" whispered Holmes. \"That is back through the house into Saxe-Coburg Square. I hope that you have done what I asked you, Jones?\"","\"I have an inspector and two officers waiting at the front door.\"","\"Then we have stopped all the holes. And now we must be silent and wait.\""]},{"id":13,"title":"A hand in the floor","place":"bank","present":["holmes","watson","jones","merryweather","clay","archie"],"mentioned":["tunnel","gold","league"],"part":null,"paras":["What a time it seemed! From comparing notes afterwards it was but an hour and a quarter, yet it appeared to me that the night must have almost gone and the dawn be breaking above us. My limbs were weary and stiff, for I feared to change my position; yet my nerves were worked up to the highest pitch of tension, and my hearing was so acute that I could not only hear the gentle breathing of my companions, but I could distinguish the deeper, heavier in-breath of the bulky Jones from the thin, sighing note of the bank director. From my position I could look over the case in the direction of the floor. Suddenly my eyes caught the glint of a light.","At first it was but a lurid spark upon the stone pavement. Then it lengthened out until it became a yellow line, and then, without any warning or sound, a gash seemed to open and a hand appeared, a white, almost womanly hand, which felt about in the centre of the little area of light. For a minute or more the hand, with its writhing fingers, protruded out of the floor. Then it was withdrawn as suddenly as it appeared, and all was dark again save the single lurid spark which marked a chink between the stones.","Its disappearance, however, was but momentary. With a rending, tearing sound, one of the broad, white stones turned over upon its side and left a square, gaping hole, through which streamed the light of a lantern. Over the edge there peeped a clean-cut, boyish face, which looked keenly about it, and then, with a hand on either side of the aperture, drew itself shoulder-high and waist-high, until one knee rested upon the edge. In another instant he stood at the side of the hole and was hauling after him a companion, lithe and small like himself, with a pale face and a shock of very red hair.","\"It's all clear,\" he whispered. \"Have you the chisel and the bags? Great Scott! Jump, Archie, jump, and I'll swing for it!\"","Sherlock Holmes had sprung out and seized the intruder by the collar. The other dived down the hole, and I heard the sound of rending cloth as Jones clutched at his skirts. The light flashed upon the barrel of a revolver, but Holmes' hunting crop came down on the man's wrist, and the pistol clinked upon the stone floor.","\"It's no use, John Clay,\" said Holmes blandly. \"You have no chance at all.\"","\"So I see,\" the other answered with the utmost coolness. \"I fancy that my pal is all right, though I see you have got his coat-tails.\"","\"There are three men waiting for him at the door,\" said Holmes.","\"Oh, indeed! You seem to have done the thing very completely. I must compliment you.\"","\"And I you,\" Holmes answered. \"Your red-headed idea was very new and effective.\"","\"You'll see your pal again presently,\" said Jones. \"He's quicker at climbing down holes than I am. Just hold out while I fix the derbies.\"","\"I beg that you will not touch me with your filthy hands,\" remarked our prisoner as the handcuffs clattered upon his wrists. \"You may not be aware that I have royal blood in my veins. Have the goodness, also, when you address me always to say 'sir' and 'please.'\"","\"All right,\" said Jones with a stare and a snigger. \"Well, would you please, sir, march upstairs, where we can get a cab to carry your Highness to the police-station?\"","\"That is better,\" said John Clay serenely. He made a sweeping bow to the three of us and walked quietly off in the custody of the detective.","\"Really, Mr. Holmes,\" said Mr. Merryweather as we followed them from the cellar, \"I do not know how the bank can thank you or repay you. There is no doubt that you have detected and defeated in the most complete manner one of the most determined attempts at bank robbery that have ever come within my experience.\"","\"I have had one or two little scores of my own to settle with Mr. John Clay,\" said Holmes. \"I have been at some small expense over this matter, which I shall expect the bank to refund, but beyond that I am amply repaid by having had an experience which is in many ways unique, and by hearing the very remarkable narrative of the Red-headed League.\""]},{"id":14,"title":"Every link rings true","place":"baker","present":["holmes","watson"],"mentioned":["clay","archie","wilson","league","tunnel","bank","pawnshop","spaulding","ross"],"part":null,"paras":["\"You see, Watson,\" he explained in the early hours of the morning as we sat over a glass of whisky and soda in Baker Street, \"it was perfectly obvious from the first that the only possible object of this rather fantastic business of the advertisement of the League, and the copying of the 'Encyclopaedia,' must be to get this not over-bright pawnbroker out of the way for a number of hours every day. It was a curious way of managing it, but, really, it would be difficult to suggest a better. The method was no doubt suggested to Clay's ingenious mind by the colour of his accomplice's hair. The 4 pounds a week was a lure which must draw him, and what was it to them, who were playing for thousands? They put in the advertisement, one rogue has the temporary office, the other rogue incites the man to apply for it, and together they manage to secure his absence every morning in the week. From the time that I heard of the assistant having come for half wages, it was obvious to me that he had some strong motive for securing the situation.\"","\"But how could you guess what the motive was?\"","\"Had there been women in the house, I should have suspected a mere vulgar intrigue. That, however, was out of the question. The man's business was a small one, and there was nothing in his house which could account for such elaborate preparations, and such an expenditure as they were at. It must, then, be something out of the house. What could it be? I thought of the assistant's fondness for photography, and his trick of vanishing into the cellar. The cellar! There was the end of this tangled clue. Then I made inquiries as to this mysterious assistant and found that I had to deal with one of the coolest and most daring criminals in London. He was doing something in the cellar—something which took many hours a day for months on end. What could it be, once more? I could think of nothing save that he was running a tunnel to some other building.","\"So far I had got when we went to visit the scene of action. I surprised you by beating upon the pavement with my stick. I was ascertaining whether the cellar stretched out in front or behind. It was not in front. Then I rang the bell, and, as I hoped, the assistant answered it. We have had some skirmishes, but we had never set eyes upon each other before. I hardly looked at his face. His knees were what I wished to see. You must yourself have remarked how worn, wrinkled, and stained they were. They spoke of those hours of burrowing. The only remaining point was what they were burrowing for. I walked round the corner, saw the City and Suburban Bank abutted on our friend's premises, and felt that I had solved my problem. When you drove home after the concert I called upon Scotland Yard and upon the chairman of the bank directors, with the result that you have seen.\"","\"And how could you tell that they would make their attempt to-night?\" I asked.","\"Well, when they closed their League offices that was a sign that they cared no longer about Mr. Jabez Wilson's presence—in other words, that they had completed their tunnel. But it was essential that they should use it soon, as it might be discovered, or the bullion might be removed. Saturday would suit them better than any other day, as it would give them two days for their escape. For all these reasons I expected them to come to-night.\"","\"You reasoned it out beautifully,\" I exclaimed in unfeigned admiration. \"It is so long a chain, and yet every link rings true.\"","\"It saved me from ennui,\" he answered, yawning. \"Alas! I already feel it closing in upon me. My life is spent in one long effort to escape from the commonplaces of existence. These little problems help me to do so.\"","\"And you are a benefactor of the race,\" said I.","He shrugged his shoulders. \"Well, perhaps, after all, it is of some little use,\" he remarked. \"'L'homme c'est rien—l'oeuvre c'est tout,' as Gustave Flaubert wrote to George Sand.\""]}],"ignore":["Mary Sutherland","Bank of France"],"merges":[{"from":"spaulding","into":"clay","at":14,"quote":"found that I had to deal with one of the coolest and most daring criminals in London"},{"from":"ross","into":"archie","at":14,"quote":"one rogue has the temporary office, the other rogue incites the man to apply for it"}],"entities":[{"id":"holmes","type":"person","first":1,"names":[[1,"Sherlock Holmes",null]],"match":[["Sherlock Holmes",1],["Holmes",1]],"aka":[]},{"id":"watson","type":"person","first":1,"names":[[1,"Dr. Watson",null]],"match":[["Dr. Watson",1],["Watson",1],["Doctor",1],["doctor",1]],"aka":[]},{"id":"wilson","type":"person","first":1,"names":[[1,"Jabez Wilson",null]],"match":[["Mr. Jabez Wilson",1],["Jabez Wilson",1],["JABEZ WILSON",1],["Mr. Wilson",1],["Wilson",1]],"aka":[]},{"id":"spaulding","type":"person","first":3,"names":[[3,"Vincent Spaulding",null]],"match":[["Vincent Spaulding",3],["Spaulding",3],["my assistant",3],["Mr. Wilson's assistant",9],["the assistant",9],["pawnbroker's assistant",9]],"aka":[]},{"id":"ross","type":"person","first":2,"names":[[2,"Duncan Ross",null]],"aka":[[6,"William Morris","his name was William Morris"]],"match":[["Mr. Duncan Ross",2],["Duncan Ross",2],["the manager",4],["Mr. William Morris",6],["William Morris",6]]},{"id":"hopkins","type":"person","first":2,"names":[[2,"Ezekiah Hopkins",null]],"match":[["Ezekiah Hopkins",2]],"aka":[]},{"id":"girl","type":"person","first":3,"names":[[3,"Wilson's maid",null]],"match":[["a girl of fourteen",3]],"aka":[]},{"id":"landlord","type":"person","first":6,"names":[[6,"The office's landlord",null]],"match":[["the landlord",6]],"aka":[]},{"id":"sarasate","type":"person","first":8,"names":[[8,"Sarasate",null]],"match":[["Sarasate",8]],"aka":[]},{"id":"jones","type":"person","first":11,"names":[[11,"Peter Jones",null]],"match":[["Peter Jones",11],["Mr. Jones",11],["Jones",11]],"aka":[]},{"id":"merryweather","type":"person","first":11,"names":[[11,"Mr. Merryweather",null]],"match":[["Mr. Merryweather",11],["Merryweather",11],["the bank director",12],["the director",12]],"aka":[]},{"id":"clay","type":"person","first":11,"names":[[11,"John Clay",null]],"match":[["Mr. John Clay",11],["John Clay",11],["Clay",11]],"aka":[]},{"id":"archie","type":"person","first":13,"names":[[13,"Archie",null]],"match":[["Archie",13]],"aka":[]},{"id":"league","type":"group","first":2,"names":[[2,"The Red-Headed League",null],[14,"The Red-Headed League, a ruse","must be to get this not over-bright pawnbroker out of the way for a number of hours every day"]],"match":[["RED-HEADED LEAGUE",2],["League of the Red-headed Men",2],["Red-headed League",2],["the League",2]],"aka":[]},{"id":"scotyard","type":"group","first":11,"names":[[11,"Scotland Yard",null]],"match":[["Scotland Yard",11]],"aka":[]},{"id":"baker","type":"place","first":1,"names":[[1,"Holmes's rooms",null],[10,"Baker Street","I shall be at Baker Street at ten."]],"match":[["Baker Street",10]],"aka":[]},{"id":"pawnshop","type":"place","first":3,"names":[[3,"Wilson's pawnshop",null]],"match":[["pawnbroker's business",3],["the pawnbroker's",9]],"aka":[]},{"id":"square","type":"place","first":3,"names":[[3,"Saxe-Coburg Square",null]],"match":[["Saxe-Coburg Square",3],["Coburg Square",3]],"aka":[]},{"id":"popescourt","type":"place","first":2,"names":[[2,"7 Pope's Court",null]],"match":[["Pope's Court",2],["Fleet Street",2]],"aka":[]},{"id":"kingedward","type":"place","first":6,"names":[[6,"17 King Edward Street",null]],"match":[["17 King Edward Street",6]],"aka":[]},{"id":"lebanon","type":"place","first":2,"names":[[2,"Lebanon, Pennsylvania",null]],"match":[["Lebanon, Pennsylvania",2]],"aka":[]},{"id":"sthall","type":"place","first":8,"names":[[8,"St. James's Hall",null]],"match":[["St. James's Hall",8]],"aka":[]},{"id":"bank","type":"place","first":9,"names":[[9,"City and Suburban Bank",null]],"match":[["City and Suburban Bank",9]],"aka":[]},{"id":"kensington","type":"place","first":11,"names":[[11,"Kensington",null]],"match":[["Kensington",11]],"aka":[]},{"id":"ad","type":"thing","first":2,"names":[[2,"The advertisement",null]],"match":[["the advertisement",2],["this advertisement",2],["that advertisement",2],["that single advertisement",2],["your advertisement",2]],"aka":[]},{"id":"encyclopaedia","type":"thing","first":4,"names":[[4,"Encyclopaedia Britannica",null]],"match":[["Encyclopaedia Britannica",4],["Encyclopaedia",4]],"aka":[]},{"id":"notice","type":"thing","first":6,"names":[[6,"The cardboard notice",null]],"match":[["piece of white cardboard",6],["the card",6]],"aka":[]},{"id":"gold","type":"thing","first":12,"names":[[12,"The French gold",null]],"match":[["French gold",12],["napoleons",12]],"aka":[]},{"id":"tunnel","type":"thing","first":13,"names":[[13,"The hole in the floor",null],[14,"The tunnel","he was running a tunnel to some other building"]],"match":[["gaping hole",13],["the hole",13],["tunnel",14]],"aka":[]}],"obs":[["wilson",1,"A stout, florid, elderly man with fiery red hair.","a very stout, florid-faced, elderly gentleman with fiery red hair"],["holmes",1,"Reads Wilson at a glance: manual labour, snuff, Freemason, China, writing.","that he takes snuff, that he is a Freemason, that he has been in China"],["wilson",1,"Started out as a ship's carpenter.","for I began as a ship's carpenter"],["wilson",1,"Has a fish tattoo done in China.","The fish that you have tattooed immediately above your right wrist could only have been done in China."],["watson",1,"Tries to read Wilson the way Holmes does, and gets nowhere.","I did not gain very much, however, by my inspection."],["ad",2,"Offers a red-headed man £4 a week for purely nominal services.","a salary of 4 pounds a week for purely nominal services"],["ad",2,"Ran in The Morning Chronicle of April 27, 1890.","It is The Morning Chronicle of April 27, 1890."],["league",2,"Paid for by the bequest of the late Ezekiah Hopkins.","On account of the bequest of the late Ezekiah Hopkins"],["hopkins",2,"Of Lebanon, Pennsylvania.","Ezekiah Hopkins, of Lebanon, Pennsylvania, U. S. A."],["ross",2,"Takes applications for the League.","Apply in person on Monday, at eleven o'clock, to Duncan Ross"],["popescourt",2,"The League's offices, off Fleet Street.","at the offices of the League, 7 Pope's Court, Fleet Street"],["wilson",3,"Runs a small pawnbroker's business in Coburg Square.","I have a small pawnbroker's business at Coburg Square, near the City."],["wilson",3,"A widower who rarely leaves the shop.","I am a very stay-at-home man"],["spaulding",3,"Works for half wages, to learn the business.","he is willing to come for half wages so as to learn the business"],["spaulding",3,"Could earn twice as much elsewhere, Wilson admits.","I know very well that he could better himself and earn twice what I am able to give him"],["spaulding",3,"Mad about photography; keeps diving into the cellar.","diving down into the cellar like a rabbit into its hole to develop his pictures"],["spaulding",3,"Shows Wilson the advertisement and talks him into applying.","I wish to the Lord, Mr. Wilson, that I was a red-headed man."],["girl",3,"Cooks and cleans for Wilson.","a girl of fourteen, who does a bit of simple cooking and keeps the place clean"],["league",3,"Said to have more vacancies than men.","I understand that there are more vacancies than there are men"],["popescourt",4,"Packed with red-headed men.","Pope's Court looked like a coster's orange barrow"],["spaulding",4,"Pushes Wilson through the crowd to the front.","he pushed and pulled and butted until he got me through the crowd"],["spaulding",4,"Offers to mind the shop.","I should be able to look after that for you."],["ross",4,"A small man with hair even redder than Wilson's.","a small man with a head that was even redder than mine"],["ross",4,"Tugs Wilson's hair to make sure it's real.","he seized my hair in both his hands, and tugged until I yelled with the pain"],["wilson",4,"Gets the place: ten to two daily, and he must never leave the office.","If you leave, you forfeit your whole position forever."],["encyclopaedia",4,"Wilson is to copy it out, starting with volume one.","There is the first volume of it in that press."],["wilson",5,"Suspects a hoax, but goes anyway.","the whole affair must be some great hoax or fraud"],["wilson",5,"Copies for eight weeks: Abbots, Archery, Armour, Architecture, Attica.","I had written about Abbots and Archery and Armour and Architecture and Attica"],["ross",5,"Pays four sovereigns a week, then stops coming in.","he did not come in at all"],["encyclopaedia",5,"Wilson's copies nearly fill a shelf.","I had pretty nearly filled a shelf with my writings"],["notice",6,"Tacked to the locked office door.","a little square of cardboard hammered on to the middle of the panel with a tack"],["notice",6,"Dated October 9, 1890.","October 9, 1890."],["league",6,"Dissolved.","DISSOLVED."],["landlord",6,"An accountant who has never heard of the League.","He said that he had never heard of any such body."],["ross",6,"The landlord knew him as William Morris, a solicitor.","his name was William Morris. He was a solicitor"],["kingedward",6,"The forwarding address: a maker of artificial knee-caps.","it was a manufactory of artificial knee-caps"],["holmes",6,"Suspects graver issues behind the case.","graver issues hang from it than might at first sight appear"],["wilson",6,"Is £30 richer for it, Holmes points out.","richer by some 30 pounds"],["spaulding",7,"Came a month before the advertisement; chosen from a dozen because he was cheap.","Because he was handy and would come cheap."],["spaulding",7,"Small and quick, about thirty, with a white acid splash on his forehead.","Has a white splash of acid upon his forehead."],["spaulding",7,"His ears are pierced for earrings.","Have you ever observed that his ears are pierced for earrings?"],["holmes",7,"Sits up sharply at the description.","I thought as much"],["holmes",8,"Calls it a three pipe problem.","It is quite a three pipe problem"],["sarasate",8,"Playing at St. James's Hall that afternoon.","Sarasate plays at the St. James's Hall this afternoon"],["square",9,"A shabby-genteel square of dingy brick houses.","It was a poky, little, shabby-genteel place"],["pawnshop",9,"Three gilt balls and a board reading JABEZ WILSON.","Three gilt balls and a brown board"],["holmes",9,"Thumps the pavement with his stick.","having thumped vigorously upon the pavement with his stick two or three times"],["holmes",9,"Went to the door only to see the knees of the assistant's trousers.","The knees of his trousers."],["spaulding",9,"The fourth smartest man in London, Holmes says.","the fourth smartest man in London"],["bank",9,"On the busy road behind the square.","the Coburg branch of the City and Suburban Bank"],["holmes",10,"A musician and composer, lost in the music all afternoon.","being himself not only a very capable performer but a composer of no ordinary merit"],["holmes",10,"Expects a serious crime that night.","A considerable crime is in contemplation."],["watson",10,"Told to bring his army revolver.","kindly put your army revolver in your pocket"],["watson",11,"Lives in Kensington.","As I drove home to my house in Kensington"],["jones",11,"The official police agent.","Peter Jones, the official police agent"],["merryweather",11,"Missing his Saturday rubber for the first time in 27 years.","It is the first Saturday night for seven-and-twenty years that I have not had my rubber."],["clay",11,"Murderer, thief, smasher and forger, at the head of his profession.","John Clay, the murderer, thief, smasher, and forger."],["clay",11,"A royal duke's grandson, educated at Eton and Oxford.","His grandfather was a royal duke, and he himself has been to Eton and Oxford."],["clay",11,"Jones has hunted him for years and never seen him.","I've been on his track for years and have never set eyes on him yet."],["holmes",11,"Has crossed swords with Clay before.","I've had one or two little turns also with Mr. John Clay"],["merryweather",12,"Chairman of the bank branch's directors.","Mr. Merryweather is the chairman of directors"],["jones",12,"Brave as a bulldog and tenacious as a lobster, says Holmes.","He is as brave as a bulldog and as tenacious as a lobster"],["bank",12,"Its cellar floor sounds hollow.","Why, dear me, it sounds quite hollow!"],["gold",12,"30,000 napoleons borrowed from the Bank of France, still crated in the cellar.","borrowed for that purpose 30,000 napoleons from the Bank of France"],["gold",12,"Packed 2,000 napoleons to a crate, between layers of lead foil.","The crate upon which I sit contains 2,000 napoleons packed between layers of lead foil."],["jones",12,"Has an inspector and two officers at the front door.","I have an inspector and two officers waiting at the front door."],["holmes",12,"Waits in the dark with the lantern shuttered.","Holmes shot the slide across the front of his lantern and left us in pitch darkness"],["tunnel",13,"A stone flips over and lantern light pours up from below.","one of the broad, white stones turned over upon its side and left a square, gaping hole"],["clay",13,"Caught by Holmes as he climbs out of the floor.","It's no use, John Clay"],["clay",13,"Claims royal blood and insists on being called sir.","You may not be aware that I have royal blood in my veins."],["archie",13,"Small and pale, with a shock of very red hair.","with a pale face and a shock of very red hair"],["archie",13,"Escapes back down the hole, losing his coat-tails.","I fancy that my pal is all right, though I see you have got his coat-tails."],["merryweather",13,"Thanks Holmes for stopping the robbery.","one of the most determined attempts at bank robbery"],["league",14,"A ruse to keep Wilson out of h
