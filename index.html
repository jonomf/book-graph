<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Book Graph prototype: a spoiler-safe graph of A Scandal in Bohemia that grows as you read.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Book Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Libre+Caslon+Display&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a reading companion. The story on one side, Holmes's index of men and things on the other,
   and a reading-position rail along the bottom that every view obeys. */
:root {
  --paper: #eef1f3;      /* cool foolscap ground */
  --leaf: #fbfcfc;       /* the page you read on */
  --ink: #17202b;
  --ink-2: #526070;
  --rule: #d3dae0;
  --accent: #0d6b76;     /* the King's beryl */
  --mark: #cfe6e8;
  --c-person: #2d5aa6;
  --c-place: #2c7a4d;
  --c-thing: #a8691a;
  --c-group: #84407a;
  --good: #2c7a4d;
  --l1: #2d5aa6; --l2: #b5462f; --l3: #2c7a4d; --l4: #84407a; --l5: #a8691a; --l6: #0d6b76; --l7: #6a5acd; --l8: #7a6a52;
  --shadow: 0 10px 30px rgba(23, 32, 43, .16);
  --display: "Libre Caslon Display", "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --body: "Spectral", Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --leaf: #151b22; --ink: #e2e7ec; --ink-2: #97a3af; --rule: #28323c;
    --accent: #52b7c2; --mark: #1d474d;
    --c-person: #82a8ea; --c-place: #6cc193; --c-thing: #e2a656; --c-group: #cc8dc1; --good: #6cc193;
    --l1: #82a8ea; --l2: #ec8a72; --l3: #6cc193; --l4: #cc8dc1; --l5: #e2a656; --l6: #52b7c2; --l7: #a99cf0; --l8: #c3b393;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --leaf: #151b22; --ink: #e2e7ec; --ink-2: #97a3af; --rule: #28323c;
  --accent: #52b7c2; --mark: #1d474d;
  --c-person: #82a8ea; --c-place: #6cc193; --c-thing: #e2a656; --c-group: #cc8dc1; --good: #6cc193;
  --l1: #82a8ea; --l2: #ec8a72; --l3: #6cc193; --l4: #cc8dc1; --l5: #e2a656; --l6: #52b7c2; --l7: #a99cf0; --l8: #c3b393;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { display: flex; align-items: baseline; gap: 12px; padding-block: 10px 8px; border-bottom: 1px solid var(--rule); background: var(--paper); }
.brand { font-family: var(--ui); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.book { min-width: 0; font-family: var(--display); font-size: 19px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.book small { font-family: var(--ui); font-size: 12px; color: var(--ink-2); margin-left: 6px; }

/* Panes */
main { position: relative; min-height: 0; }
.pane { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
.pane-pad { padding-block: 18px 28px; }

/* Dock: position rail + tabs */
.dock { background: var(--paper); border-top: 1px solid var(--rule); padding-block: 8px 0; display: grid; gap: 6px; }
.rail { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 8px; }
.step { height: 40px; border: 1px solid var(--rule); background: var(--leaf); border-radius: 8px; font-size: 18px; cursor: pointer; }
.step:disabled { opacity: .35; cursor: default; }
.where { min-width: 0; text-align: center; }
.where-k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.where-t { font-family: var(--display); font-size: 18px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slider { position: relative; padding-bottom: 14px; }
.slider input { width: 100%; margin: 0; accent-color: var(--accent); height: 24px; }
.ticks { position: absolute; left: 10px; right: 10px; bottom: 0; height: 14px; font-size: 10px; letter-spacing: .08em; color: var(--ink-2); }
.ticks span { position: absolute; transform: translateX(-2px); }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--rule); }
.tab { border: 0; background: none; padding: 10px 2px 11px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; border-top: 2px solid transparent; margin-top: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-top-color: var(--accent); }

/* Reader */
.reader { background: var(--leaf); }
.read-inner { max-width: 36em; margin: 0 auto; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.scene-title { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.1; margin: 6px 0 4px; text-wrap: balance; }
.scene-place { font-size: 13px; color: var(--ink-2); }
.added { margin: 14px 0 4px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); font-size: 13px; line-height: 1.55; }
.added b { font-weight: 600; }
.viewing { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; margin-bottom: 14px; padding: 8px 12px; border-radius: 8px; background: var(--mark); font-size: 13px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.prose { font-family: var(--body); font-size: 17.5px; line-height: 1.62; margin-top: 18px; hanging-punctuation: first; }
.prose p { margin: 0 0 .9em; }
.nm { cursor: pointer; border-bottom: 1.5px solid currentColor; }
.nm.t-person { border-color: color-mix(in srgb, var(--c-person) 60%, transparent); }
.nm.t-place  { border-color: color-mix(in srgb, var(--c-place) 60%, transparent); }
.nm.t-thing  { border-color: color-mix(in srgb, var(--c-thing) 60%, transparent); }
.nm.t-group  { border-color: color-mix(in srgb, var(--c-group) 60%, transparent); }
.nm:hover { background: var(--mark); }
mark.q { background: var(--mark); color: inherit; box-shadow: 0 0 0 2px var(--mark); }
.next { display: block; width: 100%; margin-top: 18px; padding: 14px 16px; border: 1px solid var(--accent); border-radius: 8px; background: none; color: var(--accent); font-weight: 600; font-size: 15px; text-align: left; cursor: pointer; }
.next small { display: block; font-weight: 400; color: var(--ink-2); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.end { margin-top: 18px; font-family: var(--display); font-size: 20px; text-align: center; color: var(--ink-2); }

/* Graph */
.graph-pane { overflow: hidden; }
#graph { width: 100%; height: 100%; display: block; touch-action: none; }
.g-controls { position: absolute; top: 10px; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.g-controls > * { pointer-events: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 15px; background: var(--leaf); font-size: 12.5px; cursor: pointer; }
.chip[aria-pressed="false"] { color: var(--ink-2); background: var(--paper); }
.chip[aria-pressed="false"] .dot { opacity: .3; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.person, .bg-person { background: var(--c-person); } .dot.place, .bg-place { background: var(--c-place); }
.dot.thing, .bg-thing { background: var(--c-thing); } .dot.group, .bg-group { background: var(--c-group); }
.g-foot { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: space-between; align-items: end; gap: 8px; pointer-events: none; font-size: 11.5px; color: var(--ink-2); }
.g-foot > * { pointer-events: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.legend i { display: inline-block; width: 18px; border-top: 1.5px solid var(--ink-2); vertical-align: middle; margin-right: 4px; }
.legend i.dash { border-top-style: dashed; }
.legend .ring { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--accent); border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
.g-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-2); padding: 24px; }

svg .lk { stroke: var(--ink-2); stroke-opacity: .45; stroke-width: 1.2; fill: none; }
svg .lk.ended { stroke-dasharray: 4 4; stroke-opacity: .3; }
svg .lk.new { stroke: var(--accent); stroke-opacity: .9; stroke-width: 1.8; }
svg .lk-t { font: 500 10.5px var(--ui); fill: var(--ink-2); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; display: none; }
svg .nd { cursor: pointer; }
svg .nd circle.b { stroke: var(--paper); stroke-width: 2; }
svg .nd.person circle.b { fill: var(--c-person); } svg .nd.place circle.b { fill: var(--c-place); }
svg .nd.thing circle.b { fill: var(--c-thing); } svg .nd.group circle.b { fill: var(--c-group); }
svg .nd text { font: 500 11.5px var(--ui); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
svg .nd .ring { fill: none; stroke: var(--accent); stroke-width: 2; }
svg .nd .pic-ring { fill: none; stroke-width: 2.5; }
svg .nd.person .pic-ring { stroke: var(--c-person); } svg .nd.place .pic-ring { stroke: var(--c-place); }
svg .nd.thing .pic-ring { stroke: var(--c-thing); } svg .nd.group .pic-ring { stroke: var(--c-group); }
svg.has-sel .nd:not(.near) { opacity: .25; }
svg.has-sel .lk:not(.near) { stroke-opacity: .08; }
svg.has-sel .lk-t.near { display: block; }
svg .nd.sel circle.b { stroke: var(--ink); stroke-width: 2.5; }
@keyframes pulse { 0% { opacity: .9; } 100% { opacity: 0; transform: scale(1.9); } }
svg .nd .ring.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out 3; }

/* Timeline */
.tl-note { font-size: 13px; color: var(--ink-2); margin: 0 0 12px; max-width: 40em; }
.tl { display: grid; grid-template-columns: max-content minmax(0, 1fr); border: 1px solid var(--rule); border-radius: 8px; background: var(--leaf); }
.tl-names { border-right: 1px solid var(--rule); padding-top: 44px; }
.tl-name { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 12.5px; white-space: nowrap; max-width: 44vw; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.tl-sec { height: 28px; display: flex; align-items: end; padding: 0 10px 4px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.tl-scroll { overflow-x: auto; }
svg .tl-h { font: 500 11px var(--ui); fill: var(--ink-2); font-variant-numeric: tabular-nums; cursor: pointer; }
svg .tl-h.cur { fill: var(--accent); font-weight: 600; }
svg .tl-part { font: 600 10.5px var(--ui); fill: var(--ink-2); letter-spacing: .1em; }
svg .tl-grid { stroke: var(--rule); stroke-width: 1; }
svg .tl-cur { fill: var(--mark); }

/* Index + log */
.wrap { max-width: 44em; margin: 0 auto; display: grid; gap: 22px; }
.search { width: 100%; height: 40px; border: 1px solid var(--rule); border-radius: 8px; background: var(--leaf); padding: 0 12px; font: 15px var(--ui); color: var(--ink); }
.sec-h { display: flex; align-items: baseline; gap: 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
.sec-h .n { font-variant-numeric: tabular-nums; }
.rows { display: grid; border-top: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
.row:hover { background: var(--leaf); }
.row-n { font-size: 15px; font-weight: 500; }
.row-s { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-c { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: var(--mark); color: var(--accent); vertical-align: 1px; }
.about { padding: 14px 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--leaf); font-size: 13.5px; line-height: 1.55; display: grid; gap: 8px; }
.about p { margin: 0; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--good); }
.check::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.qs { display: grid; gap: 10px; }
.qcard { padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--leaf); border-radius: 0 8px 8px 0; display: grid; gap: 4px; }
.qcard.done { border-left-color: var(--rule); }
.qcard .qq { font-weight: 600; font-size: 14px; }
.qcard.done .qq { color: var(--ink-2); }
.qcard .qa { font-size: 13.5px; }
.qcard .qm { font-size: 12px; color: var(--ink-2); }
.logs { display: grid; gap: 18px; }
.log h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 20px; text-wrap: balance; }
.log h3 .eyebrow { display: block; margin-bottom: 2px; font-family: var(--ui); }
.log ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.log li { font-size: 13.5px; line-height: 1.45; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; }
.log li .k { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); padding-top: 2px; }
.ent { border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; color: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }

/* Entity sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 15, 20, .35); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 80%; z-index: 21; background: var(--leaf); border-radius: 14px 14px 0 0; box-shadow: var(--shadow);
  display: grid; grid-template-rows: auto minmax(0, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; padding-block: 14px 12px; border-bottom: 1px solid var(--rule); }
.sheet-h h2 { margin: 4px 0 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; text-wrap: balance; }
.sheet-h .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.x { width: 36px; height: 36px; border: 1px solid var(--rule); border-radius: 18px; background: var(--paper); font-size: 18px; cursor: pointer; }
.sheet-b { overflow: auto; padding-block: 14px 30px; display: grid; gap: 22px; align-content: start; }
.type { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.pic { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; }
.pic img, .pic .ph { width: 96px; height: 96px; border-radius: 8px; object-fit: cover; border: 1px solid var(--rule); }
.pic .ph { display: grid; place-items: center; background: var(--paper); color: var(--ink-2); font-size: 28px; font-family: var(--display); }
.pic .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); font-size: 13px; cursor: pointer; }
.pic small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 6px; }
.facts { display: grid; gap: 12px; }
.fact { display: grid; gap: 3px; }
.fact .t { font-size: 14.5px; }
.fact blockquote { margin: 0; font-family: var(--body); font-style: italic; font-size: 14.5px; color: var(--ink-2); }
.fact .m { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fact.alias .t::before { content: "as the slim youth · "; color: var(--ink-2); }
.links { display: grid; gap: 6px; }
.lnk { font-size: 14px; }
.lnk.ended { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--ink-2); }
.lnk .r { color: var(--ink-2); }
.scn { display: flex; flex-wrap: wrap; gap: 6px; }
.scn button { min-width: 34px; height: 30px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); font-variant-numeric: tabular-nums; font-size: 12.5px; cursor: pointer; }
.scn button.p { background: var(--ink); color: var(--leaf); border-color: var(--ink); }

/* Wide screens: the reader stays on the left */
@media (min-width: 960px) {
  main { display: grid; grid-template-columns: minmax(400px, 46%) minmax(0, 1fr); }
  .pane { position: relative; inset: auto; }
  .pane.reader { grid-column: 1; grid-row: 1; border-right: 1px solid var(--rule); }
  .pane:not(.reader) { grid-column: 2; grid-row: 1; }
  .tabs { grid-template-columns: repeat(4, 1fr); }
  .tab[data-tab="read"] { display: none; }
  .dock { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); column-gap: 28px; align-items: center; }
  .tabs { grid-column: 1 / -1; }
  .sheet { left: auto; top: 0; height: auto; width: 420px; border-radius: 0; padding-right: env(safe-area-inset-right, 0px); }
  .scrim { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  svg .nd .ring.pulse { animation: none; }
  * { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top gutter">
    <span class="brand">Book Graph</span>
    <span class="book" id="book"></span>
  </header>

  <main>
    <section class="pane reader" id="pane-read" aria-label="Story"><div class="gutter pane-pad"><div class="read-inner" id="reader"></div></div></section>
    <section class="pane graph-pane" id="pane-graph" aria-label="Graph" hidden>
      <svg id="graph" role="img" aria-label="Graph of people, places and things known so far"></svg>
      <div class="g-controls gutter" id="g-controls"></div>
      <div class="g-foot gutter">
        <div class="legend"><span><i></i>true now</span><span><i class="dash"></i>no longer true</span><span><span class="ring"></span>new this scene</span></div>
        <button class="chip" id="fit" type="button">Fit</button>
      </div>
      <div class="g-msg" id="g-msg" hidden></div>
    </section>
    <section class="pane" id="pane-timeline" aria-label="Timeline" hidden><div class="gutter pane-pad" id="timeline"></div></section>
    <section class="pane" id="pane-index" aria-label="Index" hidden><div class="gutter pane-pad"><div class="wrap" id="index"></div></div></section>
    <section class="pane" id="pane-log" aria-label="Log" hidden><div class="gutter pane-pad"><div class="wrap" id="log"></div></div></section>
  </main>

  <footer class="dock gutter">
    <div class="rail">
      <button class="step" id="prev" type="button" aria-label="Previous scene">‹</button>
      <div class="where"><div class="where-k" id="where-k"></div><div class="where-t" id="where-t"></div></div>
      <button class="step" id="next" type="button" aria-label="Next scene">›</button>
    </div>
    <div class="slider">
      <input type="range" id="pos" min="1" max="15" step="1" aria-label="Reading position">
      <div class="ticks" id="ticks"></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="read" type="button">Read</button>
      <button class="tab" role="tab" data-tab="graph" type="button">Graph</button>
      <button class="tab" role="tab" data-tab="timeline" type="button">Timeline</button>
      <button class="tab" role="tab" data-tab="index" type="button">Index</button>
      <button class="tab" role="tab" data-tab="log" type="button">Log</button>
    </nav>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>

const D = {"book":{"title":"A Scandal in Bohemia","author":"Arthur Conan Doyle","year":1891,"source":"Project Gutenberg eBook #1661, The Adventures of Sherlock Holmes, Adventure I"},"parts":[{"n":"I","start":1},{"n":"II","start":8},{"n":"III","start":13}],"scenes":[{"id":1,"title":"The woman","place":null,"present":["watson"],"mentioned":["holmes","irene","baker"],"part":"I","paras":["To Sherlock Holmes she is always THE woman. I have seldom heard him mention her under any other name. In his eyes she eclipses and predominates the whole of her sex. It was not that he felt any emotion akin to love for Irene Adler. All emotions, and that one particularly, were abhorrent to his cold, precise but admirably balanced mind. He was, I take it, the most perfect reasoning and observing machine that the world has seen, but as a lover he would have placed himself in a false position. He never spoke of the softer passions, save with a gibe and a sneer. They were admirable things for the observer—excellent for drawing the veil from men's motives and actions. But for the trained reasoner to admit such intrusions into his own delicate and finely adjusted temperament was to introduce a distracting factor which might throw a doubt upon all his mental results. Grit in a sensitive instrument, or a crack in one of his own high-power lenses, would not be more disturbing than a strong emotion in a nature such as his. And yet there was but one woman to him, and that woman was the late Irene Adler, of dubious and questionable memory.","I had seen little of Holmes lately. My marriage had drifted us away from each other. My own complete happiness, and the home-centred interests which rise up around the man who first finds himself master of his own establishment, were sufficient to absorb all my attention, while Holmes, who loathed every form of society with his whole Bohemian soul, remained in our lodgings in Baker Street, buried among his old books, and alternating from week to week between cocaine and ambition, the drowsiness of the drug, and the fierce energy of his own keen nature. He was still, as ever, deeply attracted by the study of crime, and occupied his immense faculties and extraordinary powers of observation in following out those clues, and clearing up those mysteries which had been abandoned as hopeless by the official police. From time to time I heard some vague account of his doings: of his summons to Odessa in the case of the Trepoff murder, of his clearing up of the singular tragedy of the Atkinson brothers at Trincomalee, and finally of the mission which he had accomplished so delicately and successfully for the reigning family of Holland. Beyond these signs of his activity, however, which I merely shared with all the readers of the daily press, I knew little of my former friend and companion."]},{"id":2,"title":"A visit to Baker Street","place":"baker","present":["watson","holmes"],"mentioned":["maryjane","wife"],"part":"I","paras":["One night—it was on the twentieth of March, 1888—I was returning from a journey to a patient (for I had now returned to civil practice), when my way led me through Baker Street. As I passed the well-remembered door, which must always be associated in my mind with my wooing, and with the dark incidents of the Study in Scarlet, I was seized with a keen desire to see Holmes again, and to know how he was employing his extraordinary powers. His rooms were brilliantly lit, and, even as I looked up, I saw his tall, spare figure pass twice in a dark silhouette against the blind. He was pacing the room swiftly, eagerly, with his head sunk upon his chest and his hands clasped behind him. To me, who knew his every mood and habit, his attitude and manner told their own story. He was at work again. He had risen out of his drug-created dreams and was hot upon the scent of some new problem. I rang the bell and was shown up to the chamber which had formerly been in part my own.","His manner was not effusive. It seldom was; but he was glad, I think, to see me. With hardly a word spoken, but with a kindly eye, he waved me to an armchair, threw across his case of cigars, and indicated a spirit case and a gasogene in the corner. Then he stood before the fire and looked me over in his singular introspective fashion.","\"Wedlock suits you,\" he remarked. \"I think, Watson, that you have put on seven and a half pounds since I saw you.\"","\"Seven!\" I answered.","\"Indeed, I should have thought a little more. Just a trifle more, I fancy, Watson. And in practice again, I observe. You did not tell me that you intended to go into harness.\"","\"Then, how do you know?\"","\"I see it, I deduce it. How do I know that you have been getting yourself very wet lately, and that you have a most clumsy and careless servant girl?\"","\"My dear Holmes,\" said I, \"this is too much. You would certainly have been burned, had you lived a few centuries ago. It is true that I had a country walk on Thursday and came home in a dreadful mess, but as I have changed my clothes I can't imagine how you deduce it. As to Mary Jane, she is incorrigible, and my wife has given her notice, but there, again, I fail to see how you work it out.\"","He chuckled to himself and rubbed his long, nervous hands together.","\"It is simplicity itself,\" said he; \"my eyes tell me that on the inside of your left shoe, just where the firelight strikes it, the leather is scored by six almost parallel cuts. Obviously they have been caused by someone who has very carelessly scraped round the edges of the sole in order to remove crusted mud from it. Hence, you see, my double deduction that you had been out in vile weather, and that you had a particularly malignant boot-slitting specimen of the London slavey. As to your practice, if a gentleman walks into my rooms smelling of iodoform, with a black mark of nitrate of silver upon his right forefinger, and a bulge on the right side of his top-hat to show where he has secreted his stethoscope, I must be dull, indeed, if I do not pronounce him to be an active member of the medical profession.\"","I could not help laughing at the ease with which he explained his process of deduction. \"When I hear you give your reasons,\" I remarked, \"the thing always appears to me to be so ridiculously simple that I could easily do it myself, though at each successive instance of your reasoning I am baffled until you explain your process. And yet I believe that my eyes are as good as yours.\"","\"Quite so,\" he answered, lighting a cigarette, and throwing himself down into an armchair. \"You see, but you do not observe. The distinction is clear. For example, you have frequently seen the steps which lead up from the hall to this room.\"","\"Frequently.\"","\"How often?\"","\"Well, some hundreds of times.\"","\"Then how many are there?\"","\"How many? I don't know.\"","\"Quite so! You have not observed. And yet you have seen. That is just my point. Now, I know that there are seventeen steps, because I have both seen and observed. By-the-way, since you are interested in these little problems, and since you are good enough to chronicle one or two of my trifling experiences, you may be interested in this.\" He threw over a sheet of thick, pink-tinted note-paper which had been lying open upon the table. \"It came by the last post,\" said he. \"Read it aloud.\""]},{"id":3,"title":"The note on Bohemian paper","place":"baker","present":["watson","holmes"],"mentioned":["note","bohemia","egria"],"part":"I","paras":["The note was undated, and without either signature or address.","\"There will call upon you to-night, at a quarter to eight o'clock,\" it said, \"a gentleman who desires to consult you upon a matter of the very deepest moment. Your recent services to one of the royal houses of Europe have shown that you are one who may safely be trusted with matters which are of an importance which can hardly be exaggerated. This account of you we have from all quarters received. Be in your chamber then at that hour, and do not take it amiss if your visitor wear a mask.\"","\"This is indeed a mystery,\" I remarked. \"What do you imagine that it means?\"","\"I have no data yet. It is a capital mistake to theorize before one has data. Insensibly one begins to twist facts to suit theories, instead of theories to suit facts. But the note itself. What do you deduce from it?\"","I carefully examined the writing, and the paper upon which it was written.","\"The man who wrote it was presumably well to do,\" I remarked, endeavouring to imitate my companion's processes. \"Such paper could not be bought under half a crown a packet. It is peculiarly strong and stiff.\"","\"Peculiar—that is the very word,\" said Holmes. \"It is not an English paper at all. Hold it up to the light.\"","I did so, and saw a large \"E\" with a small \"g,\" a \"P,\" and a large \"G\" with a small \"t\" woven into the texture of the paper.","\"What do you make of that?\" asked Holmes.","\"The name of the maker, no doubt; or his monogram, rather.\"","\"Not at all. The 'G' with the small 't' stands for 'Gesellschaft,' which is the German for 'Company.' It is a customary contraction like our 'Co.' 'P,' of course, stands for 'Papier.' Now for the 'Eg.' Let us glance at our Continental Gazetteer.\" He took down a heavy brown volume from his shelves. \"Eglow, Eglonitz—here we are, Egria. It is in a German-speaking country—in Bohemia, not far from Carlsbad. 'Remarkable as being the scene of the death of Wallenstein, and for its numerous glass-factories and paper-mills.' Ha, ha, my boy, what do you make of that?\" His eyes sparkled, and he sent up a great blue triumphant cloud from his cigarette.","\"The paper was made in Bohemia,\" I said.","\"Precisely. And the man who wrote the note is a German. Do you note the peculiar construction of the sentence—'This account of you we have from all quarters received.' A Frenchman or Russian could not have written that. It is the German who is so uncourteous to his verbs. It only remains, therefore, to discover what is wanted by this German who writes upon Bohemian paper and prefers wearing a mask to showing his face. And here he comes, if I am not mistaken, to resolve all our doubts.\""]},{"id":4,"title":"The masked visitor","place":"baker","present":["watson","holmes","king"],"mentioned":["ormstein"],"part":"I","paras":["As he spoke there was the sharp sound of horses' hoofs and grating wheels against the curb, followed by a sharp pull at the bell. Holmes whistled.","\"A pair, by the sound,\" said he. \"Yes,\" he continued, glancing out of the window. \"A nice little brougham and a pair of beauties. A hundred and fifty guineas apiece. There's money in this case, Watson, if there is nothing else.\"","\"I think that I had better go, Holmes.\"","\"Not a bit, Doctor. Stay where you are. I am lost without my Boswell. And this promises to be interesting. It would be a pity to miss it.\"","\"But your client—\"","\"Never mind him. I may want your help, and so may he. Here he comes. Sit down in that armchair, Doctor, and give us your best attention.\"","A slow and heavy step, which had been heard upon the stairs and in the passage, paused immediately outside the door. Then there was a loud and authoritative tap.","\"Come in!\" said Holmes.","A man entered who could hardly have been less than six feet six inches in height, with the chest and limbs of a Hercules. His dress was rich with a richness which would, in England, be looked upon as akin to bad taste. Heavy bands of astrakhan were slashed across the sleeves and fronts of his double-breasted coat, while the deep blue cloak which was thrown over his shoulders was lined with flame-coloured silk and secured at the neck with a brooch which consisted of a single flaming beryl. Boots which extended halfway up his calves, and which were trimmed at the tops with rich brown fur, completed the impression of barbaric opulence which was suggested by his whole appearance. He carried a broad-brimmed hat in his hand, while he wore across the upper part of his face, extending down past the cheekbones, a black vizard mask, which he had apparently adjusted that very moment, for his hand was still raised to it as he entered. From the lower part of the face he appeared to be a man of strong character, with a thick, hanging lip, and a long, straight chin suggestive of resolution pushed to the length of obstinacy.","\"You had my note?\" he asked with a deep harsh voice and a strongly marked German accent. \"I told you that I would call.\" He looked from one to the other of us, as if uncertain which to address.","\"Pray take a seat,\" said Holmes. \"This is my friend and colleague, Dr. Watson, who is occasionally good enough to help me in my cases. Whom have I the honour to address?\"","\"You may address me as the Count Von Kramm, a Bohemian nobleman. I understand that this gentleman, your friend, is a man of honour and discretion, whom I may trust with a matter of the most extreme importance. If not, I should much prefer to communicate with you alone.\"","I rose to go, but Holmes caught me by the wrist and pushed me back into my chair. \"It is both, or none,\" said he. \"You may say before this gentleman anything which you may say to me.\"","The Count shrugged his broad shoulders. \"Then I must begin,\" said he, \"by binding you both to absolute secrecy for two years; at the end of that time the matter will be of no importance. At present it is not too much to say that it is of such weight it may have an influence upon European history.\"","\"I promise,\" said Holmes.","\"And I.\"","\"You will excuse this mask,\" continued our strange visitor. \"The august person who employs me wishes his agent to be unknown to you, and I may confess at once that the title by which I have just called myself is not exactly my own.\"","\"I was aware of it,\" said Holmes dryly.","\"The circumstances are of great delicacy, and every precaution has to be taken to quench what might grow to be an immense scandal and seriously compromise one of the reigning families of Europe. To speak plainly, the matter implicates the great House of Ormstein, hereditary kings of Bohemia.\"","\"I was also aware of that,\" murmured Holmes, settling himself down in his armchair and closing his eyes.","Our visitor glanced with some apparent surprise at the languid, lounging figure of the man who had been no doubt depicted to him as the most incisive reasoner and most energetic agent in Europe. Holmes slowly reopened his eyes and looked impatiently at his gigantic client."]},{"id":5,"title":"The mask comes off","place":"baker","present":["watson","holmes","king"],"mentioned":["prague","bohemia","ormstein"],"part":"I","paras":["\"If your Majesty would condescend to state your case,\" he remarked, \"I should be better able to advise you.\"","The man sprang from his chair and paced up and down the room in uncontrollable agitation. Then, with a gesture of desperation, he tore the mask from his face and hurled it upon the ground. \"You are right,\" he cried; \"I am the King. Why should I attempt to conceal it?\"","\"Why, indeed?\" murmured Holmes. \"Your Majesty had not spoken before I was aware that I was addressing Wilhelm Gottsreich Sigismond von Ormstein, Grand Duke of Cassel-Felstein, and hereditary King of Bohemia.\"","\"But you can understand,\" said our strange visitor, sitting down once more and passing his hand over his high white forehead, \"you can understand that I am not accustomed to doing such business in my own person. Yet the matter was so delicate that I could not confide it to an agent without putting myself in his power. I have come incognito from Prague for the purpose of consulting you.\"","\"Then, pray consult,\" said Holmes, shutting his eyes once more."]},{"id":6,"title":"The photograph","place":"baker","present":["watson","holmes","king"],"mentioned":["irene","clotilde","scandking","warsaw","photo","index"],"part":"I","paras":["\"The facts are briefly these: Some five years ago, during a lengthy visit to Warsaw, I made the acquaintance of the well-known adventuress, Irene Adler. The name is no doubt familiar to you.\"","\"Kindly look her up in my index, Doctor,\" murmured Holmes without opening his eyes. For many years he had adopted a system of docketing all paragraphs concerning men and things, so that it was difficult to name a subject or a person on which he could not at once furnish information. In this case I found her biography sandwiched in between that of a Hebrew rabbi and that of a staff-commander who had written a monograph upon the deep-sea fishes.","\"Let me see!\" said Holmes. \"Hum! Born in New Jersey in the year 1858. Contralto—hum! La Scala, hum! Prima donna Imperial Opera of Warsaw—yes! Retired from operatic stage—ha! Living in London—quite so! Your Majesty, as I understand, became entangled with this young person, wrote her some compromising letters, and is now desirous of getting those letters back.\"","\"Precisely so. But how—\"","\"Was there a secret marriage?\"","\"None.\"","\"No legal papers or certificates?\"","\"None.\"","\"Then I fail to follow your Majesty. If this young person should produce her letters for blackmailing or other purposes, how is she to prove their authenticity?\"","\"There is the writing.\"","\"Pooh, pooh! Forgery.\"","\"My private note-paper.\"","\"Stolen.\"","\"My own seal.\"","\"Imitated.\"","\"My photograph.\"","\"Bought.\"","\"We were both in the photograph.\"","\"Oh, dear! That is very bad! Your Majesty has indeed committed an indiscretion.\"","\"I was mad—insane.\"","\"You have compromised yourself seriously.\"","\"I was only Crown Prince then. I was young. I am but thirty now.\"","\"It must be recovered.\"","\"We have tried and failed.\"","\"Your Majesty must pay. It must be bought.\"","\"She will not sell.\"","\"Stolen, then.\"","\"Five attempts have been made. Twice burglars in my pay ransacked her house. Once we diverted her luggage when she travelled. Twice she has been waylaid. There has been no result.\"","\"No sign of it?\"","\"Absolutely none.\"","Holmes laughed. \"It is quite a pretty little problem,\" said he.","\"But a very serious one to me,\" returned the King reproachfully.","\"Very, indeed. And what does she propose to do with the photograph?\"","\"To ruin me.\"","\"But how?\"","\"I am about to be married.\"","\"So I have heard.\"","\"To Clotilde Lothman von Saxe-Meningen, second daughter of the King of Scandinavia. You may know the strict principles of her family. She is herself the very soul of delicacy. A shadow of a doubt as to my conduct would bring the matter to an end.\"","\"And Irene Adler?\"","\"Threatens to send them the photograph. And she will do it. I know that she will do it. You do not know her, but she has a soul of steel. She has the face of the most beautiful of women, and the mind of the most resolute of men. Rather than I should marry another woman, there are no lengths to which she would not go—none.\"","\"You are sure that she has not sent it yet?\"","\"I am sure.\"","\"And why?\"","\"Because she has said that she would send it on the day when the betrothal was publicly proclaimed. That will be next Monday.\""]},{"id":7,"title":"Expenses and an address","place":"baker","present":["watson","holmes","king"],"mentioned":["langham","briony","irene","photo"],"part":"I","paras":["\"Oh, then we have three days yet,\" said Holmes with a yawn. \"That is very fortunate, as I have one or two matters of importance to look into just at present. Your Majesty will, of course, stay in London for the present?\"","\"Certainly. You will find me at the Langham under the name of the Count Von Kramm.\"","\"Then I shall drop you a line to let you know how we progress.\"","\"Pray do so. I shall be all anxiety.\"","\"Then, as to money?\"","\"You have carte blanche.\"","\"Absolutely?\"","\"I tell you that I would give one of the provinces of my kingdom to have that photograph.\"","\"And for present expenses?\"","The King took a heavy chamois leather bag from under his cloak and laid it on the table.","\"There are three hundred pounds in gold and seven hundred in notes,\" he said.","Holmes scribbled a receipt upon a sheet of his note-book and handed it to him.","\"And Mademoiselle's address?\" he asked.","\"Is Briony Lodge, Serpentine Avenue, St. John's Wood.\"","Holmes took a note of it. \"One other question,\" said he. \"Was the photograph a cabinet?\"","\"It was.\"","\"Then, good-night, your Majesty, and I trust that we shall soon have some good news for you. And good-night, Watson,\" he added, as the wheels of the royal brougham rolled down the street. \"If you will be good enough to call to-morrow afternoon at three o'clock I should like to chat this little matter over with you.\""]},{"id":8,"title":"A groom out of work","place":"baker","present":["watson","holmes","turner"],"mentioned":["irene","godfrey","briony","mews","temple"],"part":"II","paras":["At three o'clock precisely I was at Baker Street, but Holmes had not yet returned. The landlady informed me that he had left the house shortly after eight o'clock in the morning. I sat down beside the fire, however, with the intention of awaiting him, however long he might be. I was already deeply interested in his inquiry, for, though it was surrounded by none of the grim and strange features which were associated with the two crimes which I have already recorded, still, the nature of the case and the exalted station of his client gave it a character of its own. Indeed, apart from the nature of the investigation which my friend had on hand, there was something in his masterly grasp of a situation, and his keen, incisive reasoning, which made it a pleasure to me to study his system of work, and to follow the quick, subtle methods by which he disentangled the most inextricable mysteries. So accustomed was I to his invariable success that the very possibility of his failing had ceased to enter into my head.","It was close upon four before the door opened, and a drunken-looking groom, ill-kempt and side-whiskered, with an inflamed face and disreputable clothes, walked into the room. Accustomed as I was to my friend's amazing powers in the use of disguises, I had to look three times before I was certain that it was indeed he. With a nod he vanished into the bedroom, whence he emerged in five minutes tweed-suited and respectable, as of old. Putting his hands into his pockets, he stretched out his legs in front of the fire and laughed heartily for some minutes.","\"Well, really!\" he cried, and then he choked and laughed again until he was obliged to lie back, limp and helpless, in the chair.","\"What is it?\"","\"It's quite too funny. I am sure you could never guess how I employed my morning, or what I ended by doing.\"","\"I can't imagine. I suppose that you have been watching the habits, and perhaps the house, of Miss Irene Adler.\"","\"Quite so; but the sequel was rather unusual. I will tell you, however. I left the house a little after eight o'clock this morning in the character of a groom out of work. There is a wonderful sympathy and freemasonry among horsey men. Be one of them, and you will know all that there is to know. I soon found Briony Lodge. It is a bijou villa, with a garden at the back, but built out in front right up to the road, two stories. Chubb lock to the door. Large sitting-room on the right side, well furnished, with long windows almost to the floor, and those preposterous English window fasteners which a child could open. Behind there was nothing remarkable, save that the passage window could be reached from the top of the coach-house. I walked round it and examined it closely from every point of view, but without noting anything else of interest.","\"I then lounged down the street and found, as I expected, that there was a mews in a lane which runs down by one wall of the garden. I lent the ostlers a hand in rubbing down their horses, and received in exchange twopence, a glass of half and half, two fills of shag tobacco, and as much information as I could desire about Miss Adler, to say nothing of half a dozen other people in the neighbourhood in whom I was not in the least interested, but whose biographies I was compelled to listen to.\"","\"And what of Irene Adler?\" I asked.","\"Oh, she has turned all the men's heads down in that part. She is the daintiest thing under a bonnet on this planet. So say the Serpentine-mews, to a man. She lives quietly, sings at concerts, drives out at five every day, and returns at seven sharp for dinner. Seldom goes out at other times, except when she sings. Has only one male visitor, but a good deal of him. He is dark, handsome, and dashing, never calls less than once a day, and often twice. He is a Mr. Godfrey Norton, of the Inner Temple. See the advantages of a cabman as a confidant. They had driven him home a dozen times from Serpentine-mews, and knew all about him. When I had listened to all they had to tell, I began to walk up and down near Briony Lodge once more, and to think over my plan of campaign.","\"This Godfrey Norton was evidently an important factor in the matter. He was a lawyer. That sounded ominous. What was the relation between them, and what the object of his repeated visits? Was she his client, his friend, or his mistress? If the former, she had probably transferred the photograph to his keeping. If the latter, it was less likely. On the issue of this question depended whether I should continue my work at Briony Lodge, or turn my attention to the gentleman's chambers in the Temple. It was a delicate point, and it widened the field of my inquiry. I fear that I bore you with these details, but I have to let you see my little difficulties, if you are to understand the situation.\"","\"I am following you closely,\" I answered."]},{"id":9,"title":"The wedding at St. Monica","place":"stmonica","present":["holmes","irene","godfrey","john","clergyman"],"mentioned":["briony","temple","sovereign"],"part":"II","paras":["\"I was still balancing the matter in my mind when a hansom cab drove up to Briony Lodge, and a gentleman sprang out. He was a remarkably handsome man, dark, aquiline, and moustached—evidently the man of whom I had heard. He appeared to be in a great hurry, shouted to the cabman to wait, and brushed past the maid who opened the door with the air of a man who was thoroughly at home.","\"He was in the house about half an hour, and I could catch glimpses of him in the windows of the sitting-room, pacing up and down, talking excitedly, and waving his arms. Of her I could see nothing. Presently he emerged, looking even more flurried than before. As he stepped up to the cab, he pulled a gold watch from his pocket and looked at it earnestly, 'Drive like the devil,' he shouted, 'first to Gross & Hankey's in Regent Street, and then to the Church of St. Monica in the Edgeware Road. Half a guinea if you do it in twenty minutes!'","\"Away they went, and I was just wondering whether I should not do well to follow them when up the lane came a neat little landau, the coachman with his coat only half-buttoned, and his tie under his ear, while all the tags of his harness were sticking out of the buckles. It hadn't pulled up before she shot out of the hall door and into it. I only caught a glimpse of her at the moment, but she was a lovely woman, with a face that a man might die for.","\"'The Church of St. Monica, John,' she cried, 'and half a sovereign if you reach it in twenty minutes.'","\"This was quite too good to lose, Watson. I was just balancing whether I should run for it, or whether I should perch behind her landau when a cab came through the street. The driver looked twice at such a shabby fare, but I jumped in before he could object. 'The Church of St. Monica,' said I, 'and half a sovereign if you reach it in twenty minutes.' It was twenty-five minutes to twelve, and of course it was clear enough what was in the wind.","\"My cabby drove fast. I don't think I ever drove faster, but the others were there before us. The cab and the landau with their steaming horses were in front of the door when I arrived. I paid the man and hurried into the church. There was not a soul there save the two whom I had followed and a surpliced clergyman, who seemed to be expostulating with them. They were all three standing in a knot in front of the altar. I lounged up the side aisle like any other idler who has dropped into a church. Suddenly, to my surprise, the three at the altar faced round to me, and Godfrey Norton came running as hard as he could towards me.","\"'Thank God,' he cried. 'You'll do. Come! Come!'","\"'What then?' I asked.","\"'Come, man, come, only three minutes, or it won't be legal.'","\"I was half-dragged up to the altar, and before I knew where I was I found myself mumbling responses which were whispered in my ear, and vouching for things of which I knew nothing, and generally assisting in the secure tying up of Irene Adler, spinster, to Godfrey Norton, bachelor. It was all done in an instant, and there was the gentleman thanking me on the one side and the lady on the other, while the clergyman beamed on me in front. It was the most preposterous position in which I ever found myself in my life, and it was the thought of it that started me laughing just now. It seems that there had been some informality about their license, that the clergyman absolutely refused to marry them without a witness of some sort, and that my lucky appearance saved the bridegroom from having to sally out into the streets in search of a best man. The bride gave me a sovereign, and I mean to wear it on my watch-chain in memory of the occasion.\"","\"This is a very unexpected turn of affairs,\" said I; \"and what then?\"","\"Well, I found my plans very seriously menaced. It looked as if the pair might take an immediate departure, and so necessitate very prompt and energetic measures on my part. At the church door, however, they separated, he driving back to the Temple, and she to her own house. 'I shall drive out in the park at five as usual,' she said as she left him. I heard no more. They drove away in different directions, and I went off to make my own arrangements.\""]},{"id":10,"title":"Holmes's plan","place":"baker","present":["holmes","watson","turner"],"mentioned":["irene","briony","rocket"],"part":"II","paras":["\"Which are?\"","\"Some cold beef and a glass of beer,\" he answered, ringing the bell. \"I have been too busy to think of food, and I am likely to be busier still this evening. By the way, Doctor, I shall want your co-operation.\"","\"I shall be delighted.\"","\"You don't mind breaking the law?\"","\"Not in the least.\"","\"Nor running a chance of arrest?\"","\"Not in a good cause.\"","\"Oh, the cause is excellent!\"","\"Then I am your man.\"","\"I was sure that I might rely on you.\"","\"But what is it you wish?\"","\"When Mrs. Turner has brought in the tray I will make it clear to you. Now,\" he said as he turned hungrily on the simple fare that our landlady had provided, \"I must discuss it while I eat, for I have not much time. It is nearly five now. In two hours we must be on the scene of action. Miss Irene, or Madame, rather, returns from her drive at seven. We must be at Briony Lodge to meet her.\"","\"And what then?\"","\"You must leave that to me. I have already arranged what is to occur. There is only one point on which I must insist. You must not interfere, come what may. You understand?\"","\"I am to be neutral?\"","\"To do nothing whatever. There will probably be some small unpleasantness. Do not join in it. It will end in my being conveyed into the house. Four or five minutes afterwards the sitting-room window will open. You are to station yourself close to that open window.\"","\"Yes.\"","\"You are to watch me, for I will be visible to you.\"","\"Yes.\"","\"And when I raise my hand—so—you will throw into the room what I give you to throw, and will, at the same time, raise the cry of fire. You quite follow me?\"","\"Entirely.\"","\"It is nothing very formidable,\" he said, taking a long cigar-shaped roll from his pocket. \"It is an ordinary plumber's smoke-rocket, fitted with a cap at either end to make it self-lighting. Your task is confined to that. When you raise your cry of fire, it will be taken up by quite a number of people. You may then walk to the end of the street, and I will rejoin you in ten minutes. I hope that I have made myself clear?\"","\"I am to remain neutral, to get near the window, to watch you, and at the signal to throw in this object, then to raise the cry of fire, and to wait you at the corner of the street.\"","\"Precisely.\"","\"Then you may entirely rely on me.\"","\"That is excellent. I think, perhaps, it is almost time that I prepare for the new role I have to play.\"","He disappeared into his bedroom and returned in a few minutes in the character of an amiable and simple-minded Nonconformist clergyman. His broad black hat, his baggy trousers, his white tie, his sympathetic smile, and general look of peering and benevolent curiosity were such as Mr. John Hare alone could have equalled. It was not merely that Holmes changed his costume. His expression, his manner, his very soul seemed to vary with every fresh part that he assumed. The stage lost a fine actor, even as science lost an acute reasoner, when he became a specialist in crime."]},{"id":11,"title":"The brawl at Briony Lodge","place":"briony","present":["holmes","watson","irene","crowd"],"mentioned":["photo","godfrey","rocket"],"part":"II","paras":["It was a quarter past six when we left Baker Street, and it still wanted ten minutes to the hour when we found ourselves in Serpentine Avenue. It was already dusk, and the lamps were just being lighted as we paced up and down in front of Briony Lodge, waiting for the coming of its occupant. The house was just such as I had pictured it from Sherlock Holmes' succinct description, but the locality appeared to be less private than I expected. On the contrary, for a small street in a quiet neighbourhood, it was remarkably animated. There was a group of shabbily dressed men smoking and laughing in a corner, a scissors-grinder with his wheel, two guardsmen who were flirting with a nurse-girl, and several well-dressed young men who were lounging up and down with cigars in their mouths.","\"You see,\" remarked Holmes, as we paced to and fro in front of the house, \"this marriage rather simplifies matters. The photograph becomes a double-edged weapon now. The chances are that she would be as averse to its being seen by Mr. Godfrey Norton, as our client is to its coming to the eyes of his princess. Now the question is, Where are we to find the photograph?\"","\"Where, indeed?\"","\"It is most unlikely that she carries it about with her. It is cabinet size. Too large for easy concealment about a woman's dress. She knows that the King is capable of having her waylaid and searched. Two attempts of the sort have already been made. We may take it, then, that she does not carry it about with her.\"","\"Where, then?\"","\"Her banker or her lawyer. There is that double possibility. But I am inclined to think neither. Women are naturally secretive, and they like to do their own secreting. Why should she hand it over to anyone else? She could trust her own guardianship, but she could not tell what indirect or political influence might be brought to bear upon a business man. Besides, remember that she had resolved to use it within a few days. It must be where she can lay her hands upon it. It must be in her own house.\"","\"But it has twice been burgled.\"","\"Pshaw! They did not know how to look.\"","\"But how will you look?\"","\"I will not look.\"","\"What then?\"","\"I will get her to show me.\"","\"But she will refuse.\"","\"She will not be able to. But I hear the rumble of wheels. It is her carriage. Now carry out my orders to the letter.\"","As he spoke the gleam of the side-lights of a carriage came round the curve of the avenue. It was a smart little landau which rattled up to the door of Briony Lodge. As it pulled up, one of the loafing men at the corner dashed forward to open the door in the hope of earning a copper, but was elbowed away by another loafer, who had rushed up with the same intention. A fierce quarrel broke out, which was increased by the two guardsmen, who took sides with one of the loungers, and by the scissors-grinder, who was equally hot upon the other side. A blow was struck, and in an instant the lady, who had stepped from her carriage, was the centre of a little knot of flushed and struggling men, who struck savagely at each other with their fists and sticks. Holmes dashed into the crowd to protect the lady; but just as he reached her he gave a cry and dropped to the ground, with the blood running freely down his face. At his fall the guardsmen took to their heels in one direction and the loungers in the other, while a number of better-dressed people, who had watched the scuffle without taking part in it, crowded in to help the lady and to attend to the injured man. Irene Adler, as I will still call her, had hurried up the steps; but she stood at the top with her superb figure outlined against the lights of the hall, looking back into the street.","\"Is the poor gentleman much hurt?\" she asked.","\"He is dead,\" cried several voices.","\"No, no, there's life in him!\" shouted another. \"But he'll be gone before you can get him to hospital.\"","\"He's a brave fellow,\" said a woman. \"They would have had the lady's purse and watch if it hadn't been for him. They were a gang, and a rough one, too. Ah, he's breathing now.\"","\"He can't lie in the street. May we bring him in, marm?\"","\"Surely. Bring him into the sitting-room. There is a comfortable sofa. This way, please!\"","Slowly and solemnly he was borne into Briony Lodge and laid out in the principal room, while I still observed the proceedings from my post by the window. The lamps had been lit, but the blinds had not been drawn, so that I could see Holmes as he lay upon the couch. I do not know whether he was seized with compunction at that moment for the part he was playing, but I know that I never felt more heartily ashamed of myself in my life than when I saw the beautiful creature against whom I was conspiring, or the grace and kindliness with which she waited upon the injured man. And yet it would be the blackest treachery to Holmes to draw back now from the part which he had intrusted to me. I hardened my heart, and took the smoke-rocket from under my ulster. After all, I thought, we are not injuring her. We are but preventing her from injuring another.","Holmes had sat up upon the couch, and I saw him motion like a man who is in need of air. A maid rushed across and threw open the window. At the same instant I saw him raise his hand and at the signal I tossed my rocket into the room with a cry of \"Fire!\" The word was no sooner out of my mouth than the whole crowd of spectators, well dressed and ill—gentlemen, ostlers, and servant-maids—joined in a general shriek of \"Fire!\" Thick clouds of smoke curled through the room and out at the open window. I caught a glimpse of rushing figures, and a moment later the voice of Holmes from within assuring them that it was a false alarm. Slipping through the shouting crowd I made my way to the corner of the street, and in ten minutes was rejoiced to find my friend's arm in mine, and to get away from the scene of uproar. He walked swiftly and in silence for some few minutes until we had turned down one of the quiet streets which lead towards the Edgeware Road."]},{"id":12,"title":"She showed me","place":"baker","present":["holmes","watson","youth"],"mentioned":["irene","photo","john","crowd"],"part":"II","paras":["\"You did it very nicely, Doctor,\" he remarked. \"Nothing could have been better. It is all right.\"","\"You have the photograph?\"","\"I know where it is.\"","\"And how did you find out?\"","\"She showed me, as I told you she would.\"","\"I am still in the dark.\"","\"I do not wish to make a mystery,\" said he, laughing. \"The matter was perfectly simple. You, of course, saw that everyone in the street was an accomplice. They were all engaged for the evening.\"","\"I guessed as much.\"","\"Then, when the row broke out, I had a little moist red paint in the palm of my hand. I rushed forward, fell down, clapped my hand to my face, and became a piteous spectacle. It is an old trick.\"","\"That also I could fathom.\"","\"Then they carried me in. She was bound to have me in. What else could she do? And into her sitting-room, which was the very room which I suspected. It lay between that and her bedroom, and I was determined to see which. They laid me on a couch, I motioned for air, they were compelled to open the window, and you had your chance.\"","\"How did that help you?\"","\"It was all-important. When a woman thinks that her house is on fire, her instinct is at once to rush to the thing which she values most. It is a perfectly overpowering impulse, and I have more than once taken advantage of it. In the case of the Darlington substitution scandal it was of use to me, and also in the Arnsworth Castle business. A married woman grabs at her baby; an unmarried one reaches for her jewel-box. Now it was clear to me that our lady of to-day had nothing in the house more precious to her than what we are in quest of. She would rush to secure it. The alarm of fire was admirably done. The smoke and shouting were enough to shake nerves of steel. She responded beautifully. The photograph is in a recess behind a sliding panel just above the right bell-pull. She was there in an instant, and I caught a glimpse of it as she half-drew it out. When I cried out that it was a false alarm, she replaced it, glanced at the rocket, rushed from the room, and I have not seen her since. I rose, and, making my excuses, escaped from the house. I hesitated whether to attempt to secure the photograph at once; but the coachman had come in, and as he was watching me narrowly it seemed safer to wait. A little over-precipitance may ruin all.\"","\"And now?\" I asked.","\"Our quest is practically finished. I shall call with the King to-morrow, and with you, if you care to come with us. We will be shown into the sitting-room to wait for the lady, but it is probable that when she comes she may find neither us nor the photograph. It might be a satisfaction to his Majesty to regain it with his own hands.\"","\"And when will you call?\"","\"At eight in the morning. She will not be up, so that we shall have a clear field. Besides, we must be prompt, for this marriage may mean a complete change in her life and habits. I must wire to the King without delay.\"","We had reached Baker Street and had stopped at the door. He was searching his pockets for the key when someone passing said:","\"Good-night, Mister Sherlock Holmes.\"","There were several people on the pavement at the time, but the greeting appeared to come from a slim youth in an ulster who had hurried by.","\"I've heard that voice before,\" said Holmes, staring down the dimly lit street. \"Now, I wonder who the deuce that could have been.\""]},{"id":13,"title":"The empty nest","place":"briony","present":["holmes","watson","king","servant"],"mentioned":["irene","godfrey","charing","letter","irenephoto"],"part":"III","paras":["I slept at Baker Street that night, and we were engaged upon our toast and coffee in the morning when the King of Bohemia rushed into the room.","\"You have really got it!\" he cried, grasping Sherlock Holmes by either shoulder and looking eagerly into his face.","\"Not yet.\"","\"But you have hopes?\"","\"I have hopes.\"","\"Then, come. I am all impatience to be gone.\"","\"We must have a cab.\"","\"No, my brougham is waiting.\"","\"Then that will simplify matters.\" We descended and started off once more for Briony Lodge.","\"Irene Adler is married,\" remarked Holmes.","\"Married! When?\"","\"Yesterday.\"","\"But to whom?\"","\"To an English lawyer named Norton.\"","\"But she could not love him.\"","\"I am in hopes that she does.\"","\"And why in hopes?\"","\"Because it would spare your Majesty all fear of future annoyance. If the lady loves her husband, she does not love your Majesty. If she does not love your Majesty, there is no reason why she should interfere with your Majesty's plan.\"","\"It is true. And yet—Well! I wish she had been of my own station! What a queen she would have made!\" He relapsed into a moody silence, which was not broken until we drew up in Serpentine Avenue.","The door of Briony Lodge was open, and an elderly woman stood upon the steps. She watched us with a sardonic eye as we stepped from the brougham.","\"Mr. Sherlock Holmes, I believe?\" said she.","\"I am Mr. Holmes,\" answered my companion, looking at her with a questioning and rather startled gaze.","\"Indeed! My mistress told me that you were likely to call. She left this morning with her husband by the 5:15 train from Charing Cross for the Continent.\"","\"What!\" Sherlock Holmes staggered back, white with chagrin and surprise. \"Do you mean that she has left England?\"","\"Never to return.\"","\"And the papers?\" asked the King hoarsely. \"All is lost.\"","\"We shall see.\" He pushed past the servant and rushed into the drawing-room, followed by the King and myself. The furniture was scattered about in every direction, with dismantled shelves and open drawers, as if the lady had hurriedly ransacked them before her flight. Holmes rushed at the bell-pull, tore back a small sliding shutter, and, plunging in his hand, pulled out a photograph and a letter. The photograph was of Irene Adler herself in evening dress, the letter was superscribed to \"Sherlock Holmes, Esq. To be left till called for.\" My friend tore it open and we all three read it together. It was dated at midnight of the preceding night and ran in this way:"]},{"id":14,"title":"Irene's letter","place":"briony","present":["holmes","watson","king"],"mentioned":["irene","john","godfrey","temple","photo","letter"],"part":"III","paras":["\"MY DEAR MR. SHERLOCK HOLMES,—You really did it very well. You took me in completely. Until after the alarm of fire, I had not a suspicion. But then, when I found how I had betrayed myself, I began to think. I had been warned against you months ago. I had been told that if the King employed an agent it would certainly be you. And your address had been given me. Yet, with all this, you made me reveal what you wanted to know. Even after I became suspicious, I found it hard to think evil of such a dear, kind old clergyman. But, you know, I have been trained as an actress myself. Male costume is nothing new to me. I often take advantage of the freedom which it gives. I sent John, the coachman, to watch you, ran up stairs, got into my walking-clothes, as I call them, and came down just as you departed.","\"Well, I followed you to your door, and so made sure that I was really an object of interest to the celebrated Mr. Sherlock Holmes. Then I, rather imprudently, wished you good-night, and started for the Temple to see my husband.","\"We both thought the best resource was flight, when pursued by so formidable an antagonist; so you will find the nest empty when you call to-morrow. As to the photograph, your client may rest in peace. I love and am loved by a better man than he. The King may do what he will without hindrance from one whom he has cruelly wronged. I keep it only to safeguard myself, and to preserve a weapon which will always secure me from any steps which he might take in the future. I leave a photograph which he might care to possess; and I remain, dear Mr. Sherlock Holmes,","\"Very truly yours, \"IRENE NORTON, née ADLER.\""]},{"id":15,"title":"The woman, again","place":"briony","present":["holmes","watson","king"],"mentioned":["irene","photo","irenephoto","ring"],"part":"III","paras":["\"What a woman—oh, what a woman!\" cried the King of Bohemia, when we had all three read this epistle. \"Did I not tell you how quick and resolute she was? Would she not have made an admirable queen? Is it not a pity that she was not on my level?\"","\"From what I have seen of the lady she seems indeed to be on a very different level to your Majesty,\" said Holmes coldly. \"I am sorry that I have not been able to bring your Majesty's business to a more successful conclusion.\"","\"On the contrary, my dear sir,\" cried the King; \"nothing could be more successful. I know that her word is inviolate. The photograph is now as safe as if it were in the fire.\"","\"I am glad to hear your Majesty say so.\"","\"I am immensely indebted to you. Pray tell me in what way I can reward you. This ring—\" He slipped an emerald snake ring from his finger and held it out upon the palm of his hand.","\"Your Majesty has something which I should value even more highly,\" said Holmes.","\"You have but to name it.\"","\"This photograph!\"","The King stared at him in amazement.","\"Irene's photograph!\" he cried. \"Certainly, if you wish it.\"","\"I thank your Majesty. Then there is no more to be done in the matter. I have the honour to wish you a very good-morning.\" He bowed, and, turning away without observing the hand which the King had stretched out to him, he set off in my company for his chambers.","And that was how a great scandal threatened to affect the kingdom of Bohemia, and how the best plans of Mr. Sherlock Holmes were beaten by a woman's wit. He used to make merry over the cleverness of women, but I have not heard him do it of late. And when he speaks of Irene Adler, or when he refers to her photograph, it is always under the honourable title of the woman."]}],"ignore":["John Hare"],"merges":[{"from":"youth","into":"irene","at":14,"quote":"Male costume is nothing new to me."}],"entities":[{"id":"holmes","type":"person","first":1,"names":[[1,"Sherlock Holmes",null]],"match":[["Sherlock Holmes",1],["Holmes",1]]},{"id":"watson","type":"person","first":1,"names":[[1,"The narrator",null],[2,"Dr. Watson","I think, Watson, that you have put on seven and a half pounds since I saw you."]],"match":[["Watson",2],["Dr. Watson",4],["Doctor",4]]},{"id":"irene","type":"person","first":1,"names":[[1,"Irene Adler",null],[14,"Irene Norton, née Adler","IRENE NORTON, née ADLER."]],"match":[["Irene Adler",1],["Irene",1],["Miss Adler",8],["Mademoiselle",7],["Madame",10],["IRENE NORTON, née ADLER",14]]},{"id":"king","type":"person","first":4,"names":[[4,"Count Von Kramm",null],[5,"The King of Bohemia","I am the King."]],"match":[["Count Von Kramm",4],["The Count",4],["the King",5],["The King",5],["King of Bohemia",5],["the King of Bohemia",5],["your Majesty",5],["Your Majesty",5],["his Majesty",5],["Wilhelm Gottsreich Sigismond von Ormstein",5]]},{"id":"godfrey","type":"person","first":8,"names":[[8,"Godfrey Norton",null]],"match":[["Godfrey Norton",8],["Norton",8]]},{"id":"turner","type":"person","first":8,"names":[[8,"The landlady",null],[10,"Mrs. Turner","When Mrs. Turner has brought in the tray"]],"match":[["landlady",8],["Mrs. Turner",10]]},{"id":"maryjane","type":"person","first":2,"names":[[2,"Mary Jane",null]],"match":[["Mary Jane",2]]},{"id":"wife","type":"person","first":2,"names":[[2,"Watson's wife",null]],"match":[["my wife",2]]},{"id":"clotilde","type":"person","first":6,"names":[[6,"Clotilde Lothman von Saxe-Meningen",null]],"match":[["Clotilde Lothman von Saxe-Meningen",6],["his princess",6]]},{"id":"scandking","type":"person","first":6,"names":[[6,"The King of Scandinavia",null]],"match":[["King of Scandinavia",6]]},{"id":"john","type":"person","first":9,"names":[[9,"John, the coachman",null]],"match":[["John",9],["coachman",9]]},{"id":"clergyman","type":"person","first":9,"names":[[9,"The clergyman at St. Monica",null]],"match":[["surpliced clergyman",9]]},{"id":"servant","type":"person","first":13,"names":[[13,"Irene's servant",null]],"match":[["an elderly woman",13],["the servant",13]]},{"id":"youth","type":"person","first":12,"names":[[12,"A slim youth in an ulster",null]],"match":[["slim youth in an ulster",12]]},{"id":"crowd","type":"group","first":11,"names":[[11,"The street crowd",null],[12,"Holmes's hired crowd","everyone in the street was an accomplice"]],"match":[["scissors-grinder",11],["guardsmen",11],["loungers",11]]},{"id":"ormstein","type":"group","first":4,"names":[[4,"House of Ormstein",null]],"match":[["House of Ormstein",4]]},{"id":"baker","type":"place","first":1,"names":[[1,"Baker Street",null]],"match":[["Baker Street",1]]},{"id":"briony","type":"place","first":7,"names":[[7,"Briony Lodge",null]],"match":[["Briony Lodge",7],["Serpentine Avenue",7],["St. John's Wood",7]]},{"id":"mews","type":"place","first":8,"names":[[8,"Serpentine Mews",null]],"match":[["Serpentine-mews",8]]},{"id":"stmonica","type":"place","first":9,"names":[[9,"Church of St. Monica",null]],"match":[["Church of St. Monica",9],["St. Monica",9]]},{"id":"langham","type":"place","first":7,"names":[[7,"The Langham",null]],"match":[["Langham",7]]},{"id":"temple","type":"place","first":8,"names":[[8,"The Inner Temple",null]],"match":[["Inner Temple",8],["the Temple",8]]},{"id":"warsaw","type":"place","first":6,"names":[[6,"Warsaw",null]],"match":[["Warsaw",6]]},{"id":"prague","type":"place","first":5,"names":[[5,"Prague",null]],"match":[["Prague",5]]},{"id":"bohemia","type":"place","first":3,"names":[[3,"Bohemia",null]],"match":[["Bohemia",3]]},{"id":"egria","type":"place","first":3,"names":[[3,"Egria",null]],"match":[["Egria",3]]},{"id":"charing","type":"place","first":13,"names":[[13,"Charing Cross",null]],"match":[["Charing Cross",13]]},{"id":"photo","type":"thing","first":6,"names":[[6,"The photograph",null]],"match":[["photograph",6,12]]},{"id":"note","type":"thing","first":3,"names":[[3,"The unsigned note",null]],"match":[["pink-tinted note-paper",3],["The note",3],["the note",3],["my note",4]]},{"id":"index","type":"thing","first":6,"names":[[6,"Holmes's index",null]],"match":[["my index",6]]},{"id":"rocket","type":"thing","first":10,"names":[[10,"The smoke-rocket",null]],"match":[["smoke-rocket",10],["rocket",10]]},{"id":"sovereign","type":"thing","first":9,"names":[[9,"Irene's sovereign",null]],"match":[]},{"id":"letter","type":"thing","first":13,"names":[[13,"Irene's letter",null]],"match":[["a letter",13],["this epistle",13]]},{"id":"irenephoto","type":"thing","first":13,"names":[[13,"Irene in evening dress",null]],"match":[["Irene's photograph",13],["This photograph",13],["her photograph",13]]},{"id":"ring","type":"thing","first":15,"names":[[15,"Emerald snake ring",null]],"match":[["emerald snake ring",15],["This ring",15]]}],"obs":[["holmes",1,"A cold, precise reasoner who scorns the softer passions.","the most perfect reasoning and observing machine that the world has seen"],["holmes",1,"Stays on in Baker Street, alternating between cocaine and ambition.","alternating from week to week between cocaine and ambition"],["watson",1,"Narrates; his marriage has drifted him away from Holmes.","My marriage had drifted us away from each other."],["irene",1,"The one woman Holmes sets above all others.","In his eyes she eclipses and predominates the whole of her sex."],["irene",1,"The narrator calls her \"the late Irene Adler\".","the late Irene Adler, of dubious and questionable memory"],["baker",1,"Holmes's lodgings, once shared with the narrator.","remained in our lodgings in Baker Street"],["watson",2,"Has gone back to civil practice as a doctor.","for I had now returned to civil practice"],["watson",2,"Has put on seven pounds since his marriage, by his own count.","you have put on seven and a half pounds since I saw you"],["holmes",2,"Reads Watson's wet walk and careless maid from the cuts on his shoe.","the leather is scored by six almost parallel cuts"],["holmes",2,"Knows there are seventeen steps up to his rooms.","I know that there are seventeen steps"],["baker",2,"Holmes's rooms were once partly Watson's.","the chamber which had formerly been in part my own"],["maryjane",2,"Watson's maid, \"incorrigible\".","As to Mary Jane, she is incorrigible"],["wife",2,"Has given Mary Jane notice.","my wife has given her notice"],["note",3,"Pink, undated and unsigned; announces a masked visitor at a quarter to eight.","a gentleman who desires to consult you upon a matter of the very deepest moment"],["note",3,"Written by a German on paper made in Bohemia.","And the man who wrote the note is a German."],["holmes",3,"Will not theorize without data.","It is a capital mistake to theorize before one has data."],["bohemia",3,"German-speaking country where the paper was made.","The paper was made in Bohemia"],["egria",3,"Bohemian town of glass-factories and paper-mills; the \"Eg\" in the watermark.","for its numerous glass-factories and paper-mills"],["king",4,"A masked giant in rich, barbaric dress, with a German accent.","a black vizard mask"],["king",4,"Introduces himself as the Count Von Kramm, a Bohemian nobleman.","You may address me as the Count Von Kramm, a Bohemian nobleman."],["king",4,"Admits the title he gave is not his own.","the title by which I have just called myself is not exactly my own"],["watson",4,"Holmes insists he stays for the consultation.","It is both, or none"],["ormstein",4,"Hereditary kings of Bohemia.","the great House of Ormstein, hereditary kings of Bohemia"],["king",5,"Tears off his mask: he is the King of Bohemia.","he tore the mask from his face and hurled it upon the ground"],["king",5,"Has come to London incognito from Prague.","I have come incognito from Prague"],["holmes",5,"Knew who the King was before he unmasked.","Your Majesty had not spoken before I was aware"],["king",6,"Met Irene Adler in Warsaw five years ago.","Some five years ago, during a lengthy visit to Warsaw"],["king",6,"Has tried five times to recover the photograph.","Five attempts have
