is shop for hours every day.","must be to get this not over-bright pawnbroker out of the way for a number of hours every day"],["spaulding",14,"The assistant was one of the most daring criminals in London.","found that I had to deal with one of the coolest and most daring criminals in London"],["tunnel",14,"Dug from Wilson's cellar towards the bank.","I could think of nothing save that he was running a tunnel to some other building."],["holmes",14,"Beat the pavement to learn which way the cellar ran.","I was ascertaining whether the cellar stretched out in front or behind."],["holmes",14,"Read hours of digging in the assistant's knees.","They spoke of those hours of burrowing."],["holmes",14,"Knew the League closing meant the tunnel was finished.","that they had completed their tunnel"],["holmes",14,"The case saved him from boredom.","It saved me from ennui"]],"rels":[["wilson","holmes","client of",1,"Now, Mr. Jabez Wilson here has been good enough to call upon me this morning",null],["watson","holmes","partner of",1,"has been my partner and helper in many of my most successful cases",null],["holmes","baker","lodges at",1,"I had called upon my friend, Mr. Sherlock Holmes",null],["ad","league","announces a vacancy in",2,"TO THE RED-HEADED LEAGUE:",null],["hopkins","league","left his fortune to",2,"On account of the bequest of the late Ezekiah Hopkins",null],["hopkins","lebanon","from",2,"Ezekiah Hopkins, of Lebanon, Pennsylvania",null],["ross","league","runs",2,"to Duncan Ross, at the offices of the League",null],["league","popescourt","offices at",2,"7 Pope's Court, Fleet Street",null],["wilson","pawnshop","runs",3,"I have a small pawnbroker's business",null],["pawnshop","square","on",3,"at Coburg Square, near the City",null],["spaulding","wilson","assistant to",3,"His name is Vincent Spaulding",null],["girl","wilson","works for",3,"a girl of fourteen",null],["spaulding","ad","shows Wilson",3,"showing me the advertisement",null],["ross","wilson","hires",4,"is Mr. Duncan Ross, and I am myself one of the pensioners",null],["wilson","league","member of",4,"congratulated me warmly on my success",6],["wilson","encyclopaedia","copies out",5,"He started me off upon the letter A",6],["notice","popescourt","nailed to the door at",6,"a little square of cardboard hammered on to the middle of the panel",null],["landlord","popescourt","landlord of",6,"I went to the landlord, who is an accountant living on the ground-floor",null],["ross","kingedward","gave as his new address",6,"17 King Edward Street, near St. Paul's",null],["sarasate","sthall","plays at",8,"Sarasate plays at the St. James's Hall",null],["bank","square","backs onto",9,"they really abutted on the other side upon the faded and stagnant square",null],["holmes","spaulding","has met before",9,"I have known something of him before.",null],["holmes","sthall","listens at",10,"so enwrapped in the music at St. James's Hall",null],["watson","kensington","lives in",11,"As I drove home to my house in Kensington",null],["jones","scotyard","detective at",11,"Mr. Jones, of Scotland Yard",null],["jones","clay","hunting",11,"I've been on his track for years",null],["merryweather","bank","director of",12,"This fellow Merryweather is a bank director",null],["gold","bank","stored in the cellar of",12,"it is still lying in our cellar",null],["clay","gold","tries to steal",13,"Have you the chisel and the bags?",null],["clay","archie","partner of",13,"Jump, Archie, jump",null],["tunnel","bank","opens into the cellar of",13,"left a square, gaping hole, through which streamed the light of a lantern",null],["holmes","clay","captures",13,"Sherlock Holmes had sprung out and seized the intruder by the collar.",null],["jones","clay","arrests",13,"walked quietly off in the custody of the detective",null],["clay","league","invented",14,"The method was no doubt suggested to Clay's ingenious mind",null],["tunnel","pawnshop","dug from the cellar of",14,"He was doing something in the cellar",null]],"questions":[{"q":"What is the Red-Headed League really for?","about":["league"],"raised":2,"rq":"What on earth does this mean?","answered":14,"a":"To keep Wilson out of his shop for hours every day.","aq":"must be to get this not over-bright pawnbroker out of the way for a number of hours every day"},{"q":"Why would a clever assistant work for half wages?","about":["spaulding"],"raised":3,"rq":"I know very well that he could better himself","answered":14,"a":"He needed to be in that house: he was digging from its cellar.","aq":"it was obvious to me that he had some strong motive for securing the situation"},{"q":"Who are Duncan Ross and William Morris?","about":["ross"],"raised":6,"rq":"no one in it had ever heard of either Mr. William Morris or Mr. Duncan Ross","answered":14,"a":"One man: Clay's red-haired partner, Archie.","aq":"one rogue has the temporary office, the other rogue incites the man to apply for it"},{"q":"Who is Vincent Spaulding really?","about":["spaulding"],"raised":7,"rq":"I thought as much","answered":14,"a":"John Clay.","aq":"found that I had to deal with one of the coolest and most daring criminals in London"},{"q":"Why did Holmes beat the pavement and look at the assistant's knees?","about":["holmes","spaulding"],"raised":9,"rq":"Why did you beat the pavement?","answered":14,"a":"To find which way the cellar ran, and to see knees worn from digging.","aq":"I was ascertaining whether the cellar stretched out in front or behind."},{"q":"What crime is Holmes expecting?","about":["holmes"],"raised":10,"rq":"A considerable crime is in contemplation.","answered":12,"a":"A raid on the French gold in the bank's cellar.","aq":"It is our French gold"}]},{"id":"empire-strikes-back","book":{"title":"The Empire Strikes Back","author":"Irvin Kershner","byline":"Film, dir. Irvin Kershner","year":1980,"kind":"film","cover":"V","source":"Scene notes by Claude, checked against Wookieepedia's and Wikipedia's plot summaries","sourceUrl":"https://starwars.fandom.com/wiki/Star_Wars:_Episode_V_The_Empire_Strikes_Back","about":"A film has no public text to quote, so Claude wrote scene notes from the film (not the script) and checked them against the plot summaries on Wookieepedia and Wikipedia. Every fact quotes the note for its scene, and the page checks each quote before showing it."},"defaultPos":1,"parts":[],"scenes":[{"id":1,"title":"A probe on Hoth","place":"hoth","present":[],"mentioned":["vader","empire","rebels","probe","echobase"],"part":"Hoth","paras":["Three years after the destruction of the Death Star, the Galactic Empire is hunting the Rebel Alliance across the galaxy. Darth Vader has sent probe droids out in every direction to find the hidden Rebel base. One probe droid lands on Hoth, a frozen planet where the Rebels have built Echo Base under the ice."]},{"id":2,"title":"The wampa","place":"hoth","present":["luke","wampa"],"mentioned":[],"part":"Hoth","paras":["Luke Skywalker is out on patrol on a tauntaun when he sees what he takes for a meteorite come down. Before he can reach it, a wampa knocks him from his mount and drags him off to its ice cave."]},{"id":3,"title":"The wampa's cave","place":"hoth","present":["luke","wampa"],"mentioned":["lightsaber"],"part":"Hoth","paras":["Luke wakes hanging upside down from the ceiling of the wampa's cave while the creature eats his tauntaun. His lightsaber lies in the snow out of reach. He uses the Force to pull it into his hand, cuts himself free, slices off the wampa's arm and stumbles out into a rising blizzard."]},{"id":4,"title":"Leaving, or not","place":"echobase","present":["han","rieekan","leia"],"mentioned":["jabba","luke"],"part":"Hoth","paras":["Back at Echo Base, Han Solo tells General Rieekan he is leaving to pay off the bounty Jabba the Hutt has on his head. Princess Leia is cold about it, and the two argue. Han says she wants him to stay, which she denies. Then word comes that Luke has not come back. Han takes a tauntaun and rides out alone to find him, even though the base doors will be shut for the night."]},{"id":5,"title":"A ghost in the blizzard","place":"hoth","present":["luke","han","obiwan"],"mentioned":["yoda","dagobah","lightsaber"],"part":"Hoth","paras":["Luke collapses in the snow. The ghost of Obi-Wan Kenobi appears to him and tells him to go to the Dagobah system, where he will learn from Yoda, the Jedi Master who taught Obi-Wan. Han finds Luke as his tauntaun dies of cold. He cuts it open with Luke's lightsaber and puts Luke inside to keep him warm, then sets up a shelter for the night."]},{"id":6,"title":"Rescued","place":"echobase","present":["zev","luke","han","leia","twoonebee"],"mentioned":[],"part":"Hoth","paras":["At dawn, the snowspeeder pilot Zev Senesca finds them both alive. Back at the base, the medical droid 2-1B heals Luke in a bacta tank. Han teases Leia about her feelings for him, and to spite him she kisses Luke."]},{"id":7,"title":"The probe is found","place":"hoth","present":["han","chewie","rieekan"],"mentioned":["probe","empire","rebels"],"part":"Hoth","paras":["Han and Chewbacca go out to check a strange signal and find the probe droid. When Han shoots at it, the droid destroys itself, but it has already signalled the Empire. General Rieekan orders the Rebels to begin evacuating Hoth."]},{"id":8,"title":"On the Executor","place":"executor","present":["vader","piett","ozzel"],"mentioned":["probe","rebels"],"part":"Hoth","paras":["On the Executor, Vader's flagship, Captain Piett brings Vader the probe's pictures. Admiral Ozzel says they show nothing important, but Vader recognises the Rebel base and orders the fleet to Hoth."]},{"id":9,"title":"Out of lightspeed","place":"executor","present":["vader","ozzel","piett","veers"],"mentioned":["shield","rebels"],"part":"Hoth","paras":["Ozzel brings the fleet out of hyperspace too close to the planet, which warns the Rebels in time to raise their energy shield. Vader chokes Ozzel to death over the viewscreen and promotes Piett to Admiral Piett in his place. With the shield blocking any attack from space, he sends General Veers to lead a ground assault on the shield generator."]},{"id":10,"title":"The first transport","place":"echobase","present":["leia"],"mentioned":["ioncannon"],"part":"The Battle of Hoth","paras":["Leia tells the pilots that each transport will leave with two fighters as escort. To clear a path through the blockade, the base fires its ion cannon at the nearest Star Destroyer, and the first transport gets away."]},{"id":11,"title":"Rogue Squadron","place":"hoth","present":["luke","dak","wedge","janson","rogue"],"mentioned":["atat","rebels"],"part":"The Battle of Hoth","paras":["Luke leads Rogue Squadron's snowspeeders against the AT-AT walkers. His gunner Dak Ralter is killed. Wedge Antilles and his gunner Wes Janson wrap a tow cable around a walker's legs until it falls, and Rebel troops destroy it."]},{"id":12,"title":"Under the walker","place":"hoth","present":["luke"],"mentioned":["atat","detonator","lightsaber"],"part":"The Battle of Hoth","paras":["Luke is shot down and scrambles clear just before a walker crushes his snowspeeder. He grapples up under another walker, cuts open its belly with his lightsaber, and throws in a thermal detonator that brings it down."]},{"id":13,"title":"The shield falls","place":"echobase","present":["veers","leia","han"],"mentioned":["shield","falcon","rebels"],"part":"The Battle of Hoth","paras":["Veers destroys the shield generator, and snowtroopers storm Echo Base. Leia orders the last of the Rebels to leave, and Han drags her to the Millennium Falcon when her own transport is cut off."]},{"id":14,"title":"Vader at Echo Base","place":"echobase","present":["vader"],"mentioned":["falcon"],"part":"The Battle of Hoth","paras":["Vader walks into Echo Base just as the Millennium Falcon blasts its way out of the hangar."]},{"id":15,"title":"Leaving Hoth","place":"hoth","present":["luke","artoo"],"mentioned":["xwing","dagobah"],"part":"The Battle of Hoth","paras":["Luke and R2-D2 take off in his X-wing. Instead of joining the fleet at the rendezvous, Luke sets a course for Dagobah. R2-D2 beeps his doubts the whole way."]},{"id":16,"title":"Into the asteroid field","place":"asteroid","present":["han","leia","chewie","threepio"],"mentioned":["falcon","hyperdrive"],"part":"The escape","paras":["Star Destroyers and TIE fighters chase the Falcon, and its hyperdrive is broken. Han flies straight into an asteroid field while C-3PO lists the odds against them, then hides the ship in a cave on a large asteroid to make repairs."]},{"id":17,"title":"A creature in the swamp","place":"dagobah","present":["luke","artoo","creature"],"mentioned":["xwing","yoda"],"part":"The escape","paras":["Luke crash-lands his X-wing in a swamp on Dagobah, a misty planet full of jungle. Something in the water swallows R2-D2 and spits him back out. While Luke makes camp, a small green creature turns up, goes through his supplies, and fights R2-D2 over a lamp. The creature says it knows Yoda and will take Luke to him."]},{"id":18,"title":"A kiss in the cave","place":"asteroid","present":["han","leia","threepio"],"mentioned":["hyperdrive"],"part":"The escape","paras":["In the asteroid cave, Han and Leia argue again while they work on the ship. He kisses her, and she kisses him back, until C-3PO bursts in with news about the hyperdrive."]},{"id":19,"title":"The Emperor","place":"executor","present":["vader","emperor"],"mentioned":["luke"],"part":"The escape","paras":["Vader orders his fleet to search the asteroid field, and an asteroid smashes into one of his Star Destroyers. The Emperor contacts Vader by hologram. He says the son of Skywalker is a new enemy who must not become a Jedi. Vader proposes turning Luke to the dark side instead, and vows that Luke will join them or die."]},{"id":20,"title":"The Jedi Master","place":"dagobah","present":["luke","creature","obiwan"],"mentioned":["yoda"],"part":"The escape","paras":["The creature leads Luke to its little house for supper. When Luke grows impatient, the creature talks to someone Luke cannot see, and Obi-Wan's voice answers. The creature is Yoda. Yoda doubts Luke can be trained. He says Luke is reckless, too old, and always looking to the future instead of where he is. Obi-Wan persuades him to try."]},{"id":21,"title":"The space slug","place":"asteroid","present":["han","leia","chewie","threepio"],"mentioned":["falcon","slug"],"part":"The escape","paras":["Mynocks are chewing on the Falcon's power cables. When Han fires into the cave, the ground moves, and they realise the cave is the mouth of a giant space slug. They fly out between its teeth just before it closes."]},{"id":22,"title":"Vader's hunters","place":"executor","present":["vader","boba","hunters","needa"],"mentioned":["falcon"],"part":"The escape","paras":["Vader hires bounty hunters, among them Boba Fett, Bossk, IG-88, Dengar, 4-LOM and Zuckuss, to find the Falcon, and warns Boba Fett he wants the passengers alive. Captain Needa's Star Destroyer chases the Falcon out of the asteroid field. The Falcon turns, flies straight at it, and clamps onto the back of the ship's command tower, where its sensors cannot see it."]},{"id":23,"title":"The cave","place":"dagobah","present":["luke","yoda"],"mentioned":["cave","vader"],"part":"The escape","paras":["Yoda trains Luke hard in the swamp, riding on his back as he runs, climbs and flips. He teaches that the dark side of the Force is quicker and easier but not stronger. Luke senses something cold in the cave under the dead tree. Yoda tells him to go in, and that he will not need his weapons. Luke takes them anyway. Inside, Luke meets Darth Vader and cuts off his head. The helmet breaks open, and the face inside is Luke's own."]},{"id":24,"title":"Gone with the garbage","place":"executor","present":["vader","needa","han","boba"],"mentioned":["falcon","lando","cloudcity"],"part":"The escape","paras":["Needa reports to Vader that the ship has vanished and apologises. Vader kills him. When the Imperial fleet dumps its garbage before jumping to hyperspace, the Falcon drifts away with it. Han decides to make for Bespin, where his old friend Lando Calrissian can fix the ship. Boba Fett has guessed the trick and follows."]},{"id":25,"title":"The X-wing in the swamp","place":"dagobah","present":["luke","yoda"],"mentioned":["xwing"],"part":"The escape","paras":["Luke's X-wing sinks deeper into the swamp. Luke tries to lift it with the Force and gives up, saying it is too big. Yoda lifts it out of the water himself, and Luke cannot believe it. Yoda says that is why he fails."]},{"id":26,"title":"Lando's city","place":"cloudcity","present":["lando","lobot","han","leia"],"mentioned":["falcon"],"part":"Cloud City","paras":["On Bespin, Lando Calrissian runs Cloud City, a mining colony floating in the clouds. Lando once lost the Falcon to Han in a card game. He welcomes them warmly, and his aide Lobot shows them around. Leia does not trust him."]},{"id":27,"title":"C-3PO in pieces","place":"cloudcity","present":["threepio","chewie","ugnaughts"],"mentioned":[],"part":"Cloud City","paras":["C-3PO wanders off, walks into a room full of stormtroopers, and is shot to pieces. Ugnaughts carry his parts to a scrap room. Chewbacca finds them there and starts putting him back together."]},{"id":28,"title":"A vision","place":"dagobah","present":["luke","yoda"],"mentioned":["han","leia"],"part":"Cloud City","paras":["While training, Luke has a vision of Han and Leia in pain in a city in the clouds. Yoda tells him it is the future, and that the future is always in motion. Luke wants to go to them at once."]},{"id":29,"title":"There is another","place":"dagobah","present":["luke","yoda","obiwan"],"mentioned":["vader"],"part":"Cloud City","paras":["Yoda and Obi-Wan tell Luke to stay and finish his training, and warn that he is not ready to face Vader. Luke leaves anyway, promising to come back. As he flies off, Obi-Wan says that boy was their last hope. Yoda answers that there is another."]},{"id":30,"title":"Dinner with Vader","place":"cloudcity","present":["han","leia","chewie","lando","vader","boba"],"mentioned":["jabba","empire"],"part":"Cloud City","paras":["Lando takes Han, Leia and Chewbacca to dinner, and Darth Vader is waiting at the table. Han fires at him, and Vader catches the shots in his hand. Lando says he had no choice. He made a deal with Vader to keep the Empire out of Cloud City. Boba Fett is there to claim Han for Jabba's bounty."]},{"id":31,"title":"The cell","place":"cloudcity","present":["han","leia","chewie","threepio","lando"],"mentioned":["luke","vader"],"part":"Cloud City","paras":["Vader has Han tortured, not to ask him anything but to draw Luke to Bespin. In their cell, Chewbacca puts C-3PO's head back on, facing backwards. Lando comes to tell them Vader has promised him Leia and Chewbacca, and that Vader really wants Luke. Han punches him."]},{"id":32,"title":"The freezing chamber","place":"cloudcity","present":["vader","han","leia","chewie","lando","boba"],"mentioned":["carbonite","emperor","jabba","luke"],"part":"Cloud City","paras":["Vader plans to freeze Luke in carbonite to take him to the Emperor, and orders it tested on Han first. In the carbon-freezing chamber, Leia tells Han she loves him, and he answers that he knows. Han is frozen solid and handed to Boba Fett, who will take him to Jabba the Hutt."]},{"id":33,"title":"A worse deal","place":"cloudcity","present":["vader","lando"],"mentioned":["leia","chewie"],"part":"Cloud City","paras":["Vader then orders Leia and Chewbacca taken to his ship. Lando protests that this was not the deal, and realises Vader keeps changing it."]},{"id":34,"title":"Luke arrives","place":"cloudcity","present":["luke","leia","boba","vader"],"mentioned":["carbonite"],"part":"Cloud City","paras":["Luke lands on Cloud City and follows the sound of voices. Leia shouts a warning that it is a trap. Boba Fett fires at Luke, and Luke makes his way down to the carbon-freezing chamber, where Vader is waiting."]},{"id":35,"title":"Lando's turn","place":"cloudcity","present":["lobot","lando","leia","chewie","threepio","artoo","boba"],"mentioned":["han","falcon"],"part":"Cloud City","paras":["Lobot and Lando's guards free Leia, Chewbacca and C-3PO. Chewbacca nearly strangles Lando before letting him explain that there is still a chance to save Han. They run for the landing platform, but Boba Fett's ship takes off with Han aboard. Lando orders the city evacuated, R2-D2 rejoins them, and the group escape on the Falcon."]},{"id":36,"title":"The duel","place":"cloudcity","present":["luke","vader"],"mentioned":["carbonite"],"part":"Cloud City","paras":["Luke duels Vader in the carbon-freezing chamber. When Vader tries to freeze him, Luke jumps clear of the freezing pit. Vader hurls machinery at him with the Force until a window bursts, and Luke is sucked out onto a gantry over a long shaft."]},{"id":37,"title":"The truth","place":"cloudcity","present":["luke","vader"],"mentioned":["lightsaber","emperor"],"part":"Cloud City","paras":["Vader cuts off Luke's right hand, and his lightsaber falls away down the shaft. Vader then tells Luke that he is his father. He asks Luke to join him, overthrow the Emperor and rule the galaxy together. Luke refuses and lets himself fall down the shaft."]},{"id":38,"title":"Under the city","place":"cloudcity","present":["luke","leia","lando"],"mentioned":["obiwan","falcon"],"part":"Cloud City","paras":["Luke is sucked through a vent and blown out under the city, where he clings to a weather vane. He calls out through the Force to Ben, and then to Leia. Leia hears him and makes Lando turn the Falcon back, and Lando pulls Luke aboard."]},{"id":39,"title":"Lightspeed","place":null,"present":["luke","vader","artoo"],"mentioned":["obiwan","falcon","hyperdrive","cloudcity"],"part":"Cloud City","paras":["The Falcon climbs out of Bespin's clouds, but the hyperdrive fails again as Vader's Star Destroyer closes in. Luke hears Vader calling to him and calls him Father. He asks why Ben never told him. R2-D2 fixes the hyperdrive, and the Falcon jumps to lightspeed."]},{"id":40,"title":"The Rebel fleet","place":null,"present":["luke","leia","lando","chewie","twoonebee"],"mentioned":["han","falcon","hand","rebels"],"part":"Cloud City","paras":["With the Rebel fleet, 2-1B fits Luke with a mechanical hand. Lando and Chewbacca set off in the Falcon to find Han, and Luke and Leia watch them go with the droids."]}],"ignore":["Death Star","Star Destroyers","Star Destroyer","TIE fighters"],"merges":[{"from":"creature","into":"yoda","at":20,"quote":"The creature is Yoda."}],"entities":[{"id":"luke","type":"person","first":2,"names":[[2,"Luke Skywalker",null]],"match":[["Luke Skywalker",2],["Luke",2],["son of Skywalker",19],["that boy",29]],"aka":[]},{"id":"han","type":"person","first":4,"names":[[4,"Han Solo",null]],"match":[["Han Solo",4],["Han",4]],"aka":[]},{"id":"leia","type":"person","first":4,"names":[[4,"Princess Leia",null]],"match":[["Princess Leia",4],["Leia",4]],"aka":[]},{"id":"rieekan","type":"person","first":4,"names":[[4,"General Rieekan",null]],"match":[["General Rieekan",4],["Rieekan",4]],"aka":[]},{"id":"chewie","type":"person","first":7,"names":[[7,"Chewbacca",null]],"match":[["Chewbacca",7]],"aka":[]},{"id":"threepio","type":"person","first":16,"names":[[16,"C-3PO",null]],"match":[["C-3PO",16]],"aka":[]},{"id":"artoo","type":"person","first":15,"names":[[15,"R2-D2",null]],"match":[["R2-D2",15]],"aka":[]},{"id":"vader","type":"person","first":1,"names":[[1,"Darth Vader",null]],"match":[["Darth Vader",1],["Vader",1]],"aka":[]},{"id":"emperor","type":"person","first":19,"names":[[19,"The Emperor",null]],"match":[["The Emperor",19],["the Emperor",19]],"aka":[]},{"id":"obiwan","type":"person","first":5,"names":[[5,"Obi-Wan Kenobi",null]],"match":[["Obi-Wan Kenobi",5],["Obi-Wan",5],["Ben",38]],"aka":[]},{"id":"yoda","type":"person","first":5,"names":[[5,"Yoda",null] function smart(s) { // same length, so indexes still line up

}

let G = null;
function initGraph() {
  const svg = d3.select('#graph');
  const root = svg.append('g');
  const gl = root.append('g'), gt = root.append('g'), gn = root.append('g');
  const zoom = d3.zoom().scaleExtent([0.25, 4]).on('zoom', ev => root.attr('transform', ev.transform));
  svg.call(zoom).on('dblclick.zoom', null);
  const sim = d3.forceSimulation()
    .force('link', d3.forceLink().id(d => d.id).distance(78).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-260))
    .force('x', d3.forceX(0).strength(0.06)).force('y', d3.forceY(0).strength(0.08))
    .force('collide', d3.forceCollide().radius(d => d.r + 16));
  G = { svg, root, gl, gt, gn, sim, zoom, nodes: new Map(), fitted: false };
  sim.on('tick', tick);
  new ResizeObserver(sizeGraph).observe($('#pane-graph'));
  sizeGraph();
}
function sizeGraph() {
  if (!G) return;
  const r = $('#pane-graph').getBoundingClientRect();
  if (!r.width) return;
  G.svg.attr('viewBox', [-r.width / 2, -r.height / 2, r.width, r.height]);
}
function tick() {
  G.gl.selectAll('line').attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  G.gt.selectAll('text').attr('x', d => (d.source.x + d.target.x) / 2).attr('y', d => (d.source.y + d.target.y) / 2);
  G.gn.selectAll('g.nd').attr('transform', d => `translate(${d.x},${d.y})`);
}
function fitGraph(animate) {
  if (!G) return;
  const ns = [...G.sim.nodes()];
  if (!ns.length) return;
  const r = $('#pane-graph').getBoundingClientRect();
  if (!r.width || !r.height) return;
  const x0 = d3.min(ns, d => d.x - d.r - 60), x1 = d3.max(ns, d => d.x + d.r + 60);
  const y0 = d3.min(ns, d => d.y - d.r - 20), y1 = d3.max(ns, d => d.y + d.r + 30);
  const k = Math.min(1.6, Math.min(r.width / (x1 - x0), (r.height - 110) / (y1 - y0)));
  const t = d3.zoomIdentity.translate(-k * (x0 + x1) / 2, -k * (y0 + y1) / 2 + 6).scale(k);
  (animate && !reduced ? G.svg.transition().duration(500) : G.svg).call(G.zoom.transform, t);
}
function renderGraphControls() {
  const p = S.pos;
  $('#g-controls').innerHTML = TYPES.map(([t, label]) => {
    const n = D.entities.filter(e => e.type === t && visible(e, p)).length;
    return `<button class="chip" type="button" data-filter="${t}" aria-pressed="${S.filters[t]}"><span class="dot ${t}"></span>${label} ${n}</button>`;
  }).join('');
}
function renderGraph() {
  renderGraphControls();
  if (!window.d3) { const m = $('#g-msg'); m.hidden = false; m.textContent = "The graph library didn't load. Check your connection and reload the page."; return; }
  if (!G) initGraph();
  const p = S.pos;
  const ents = D.entities.filter(e => visible(e, p) && S.filters[e.type]);
  const ids = new Set(ents.map(e => e.id));
  const rels = relsAt(p).filter(r => ids.has(r.a) && ids.has(r.b) && r.a !== r.b);
  const nodes = ents.map(e => {
    let n = G.nodes.get(e.id);
    if (!n) {
      const nb = rels.find(r => (r.a === e.id && G.nodes.has(r.b)) || (r.b === e.id && G.nodes.has(r.a)));
      const m = nb ? G.nodes.get(nb.a === e.id ? nb.b : nb.a) : null;
      n = { id: e.id, x: (m ? m.x : 0) + (Math.random() - .5) * 60, y: (m ? m.y : 0) + (Math.random() - .5) * 60 };
      G.nodes.set(e.id, n);
    }
    n.e = e; n.r = 7 + Math.sqrt(weight(e.id, p)) * 2.6; n.name = nameAt(e, p); n.fresh = isNew(e, p); n.img = imgOf(e.id);
    return n;
  });
  const links = rels.map(r => ({ id: `${r.a}|${r.b}|${r.label}`, source: r.a, target: r.b, r }));

  const near = new Set();
  if (S.sel) { near.add(S.sel); rels.forEach(r => { if (r.a === S.sel) near.add(r.b); if (r.b === S.sel) near.add(r.a); }); }
  G.svg.classed('has-sel', !!S.sel && ids.has(S.sel));

  G.gl.selectAll('line').data(links, d => d.id).join('line')
    .attr('class', d => 'lk' + (d.r.ended ? ' ended' : '') + (d.r.s === p && !d.r.ended ? ' new' : '') + (S.sel && (d.r.a === S.sel || d.r.b === S.sel) ? ' near' : ''));
  G.gt.selectAll('text').data(links, d => d.id).join('text')
    .attr('class', d => 'lk-t' + (S.sel && (d.r.a === S.sel || d.r.b === S.sel) ? ' near' : '')).attr('text-anchor', 'middle').attr('dy', -3)
    .text(d => d.r.label);

  const ng = G.gn.selectAll('g.nd').data(nodes, d => d.id).join(enter => {
    const g = enter.append('g').attr('class', 'nd');
    g.append('circle').attr('class', 'ring');
    g.append('circle').attr('class', 'b');
    g.append('text').attr('text-anchor', 'middle');
    g.on('click', (ev, d) => { ev.stopPropagation(); openSheet(d.id); });
    g.call(d3.drag()
      .on('start', (ev, d) => { if (!ev.active) G.sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on('end', (ev, d) => { if (!ev.active) G.sim.alphaTarget(0); d.fx = null; d.fy = null; }));
    return g;
  });
  ng.attr('class', d => `nd ${d.e.type}${S.sel === d.id ? ' sel' : ''}${near.has(d.id) ? ' near' : ''}`)
    .attr('aria-label', d => d.name);
  ng.select('circle.b').attr('r', d => d.r);
  ng.select('circle.ring').attr('r', d => d.r + 4).attr('opacity', d => d.fresh ? 1 : 0).classed('pulse', d => d.fresh);
  ng.select('text').attr('y', d => d.r + 14).text(d => d.name);
  ng.each(function (d) {
    const g = d3.select(this);
    g.selectAll('.pic, .pic-ring, clipPath').remove();
    if (d.img) {
      const cid = 'clip-' + d.id;
      g.insert('clipPath', 'text').attr('id', cid).append('circle').attr('r', d.r);
      g.insert('image', 'text').attr('class', 'pic').attr('href', d.img).attr('x', -d.r).attr('y', -d.r).attr('width', d.r * 2).attr('height', d.r * 2)
        .attr('preserveAspectRatio', 'xMidYMid slice').attr('clip-path', `url(#${cid})`);
      g.insert('circle', 'text').attr('class', 'pic-ring').attr('r', d.r);
    }
  });

  G.sim.nodes(nodes);
  G.sim.force('link').links(links);
  if (reduced) { G.sim.alpha(1); for (let i = 0; i < 300; i++) G.sim.tick(); tick(); G.sim.stop(); }
  else G.sim.alpha(0.7).restart();
  if (!G.fitted) { G.fitted = true; setTimeout(() => fitGraph(false), reduced ? 0 : 900); }
}

/* ---------- Timeline ---------- */
function renderTimeline() {
  const p = S.pos, CW = 38, RH = 28, HH = 44;
  const order = (a, b) => a.first - b.first || weight(b.id, p) - weight(a.id, p);
  const people = D.entities.filter(e => (e.type === 'person' || e.type === 'group') && visible(e, p)).sort(order);
  const places = D.entities.filter(e => e.type === 'place' && visible(e, p) && D.scenes.some(s => s.id <= p && s.place === e.id)).sort(order);
  const cols = D.scenes.filter(s => s.id <= p);
  const W = cols.length * CW + 16, H = HH + (people.length + 1 + places.length) * RH + 8;
  const cx = id => 8 + (id - 1) * CW + CW / 2;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Who appears in each scene">`;
  svg += `<rect class="tl-cur" x="${cx(p) - CW / 2}" y="0" width="${CW}" height="${H}"/>`;
  D.parts.filter(pt => pt.start <= p).forEach(pt => { svg += `<text class="tl-part" x="${cx(pt.start) - CW / 2 + 4}" y="14">${namedParts() ? esc(pt.n.toUpperCase().slice(0, 28)) : 'PART ' + pt.n}</text>`; if (pt.start > 1) svg += `<line class="tl-grid" x1="${cx(pt.start) - CW / 2}" x2="${cx(pt.start) - CW / 2}" y1="4" y2="${H}"/>`; });
  cols.forEach(s => { svg += `<text class="tl-h${s.id === p ? ' cur' : ''}" data-scene="${s.id}" x="${cx(s.id)}" y="36" text-anchor="middle">${s.id}</text>`; });
  const rowY = i => HH + i * RH + RH / 2;
  people.forEach((e, i) => {
    const y = rowY(i), col = `var(--l${(i % 8) + 1})`;
    svg += `<line class="tl-grid" x1="0" x2="${W}" y1="${y}" y2="${y}" stroke-dasharray="1 4"/>`;
    const pres = cols.filter(s => present(s, p).has(e.id)).map(s => s.id);
    for (let k = 0; k < pres.length - 1; k++) svg += `<line x1="${cx(pres[k])}" x2="${cx(pres[k + 1])}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="3" stroke-linecap="round" opacity="${pres[k + 1] - pres[k] === 1 ? .9 : .35}"/>`;
    cols.forEach(s => {
      if (present(s, p).has(e.id)) svg += `<circle cx="${cx(s.id)}" cy="${y}" r="6" fill="${col}"/>`;
      else if (mentioned(s, p).has(e.id)) svg += `<circle cx="${cx(s.id)}" cy="${y}" r="4" fill="var(--leaf)" stroke="${col}" stroke-width="1.5"/>`;
    });
  });
  const py0 = people.length + 1;
  places.forEach((e, i) => {
    const y = rowY(py0 + i);
    svg += `<line class="tl-grid" x1="0" x2="${W}" y1="${y}" y2="${y}" stroke-dasharray="1 4"/>`;
    cols.forEach(s => {
      if (s.place === e.id) svg += `<rect x="${cx(s.id) - 7}" y="${y - 7}" width="14" height="14" rx="3" fill="var(--c-place)"/>`;
      else if (mentioned(s, p).has(e.id)) svg += `<rect x="${cx(s.id) - 4}" y="${y - 4}" width="8" height="8" rx="2" fill="var(--leaf)" stroke="var(--c-place)" stroke-width="1.5"/>`;
    });

  const names = people.map((e, i) => nameRow(e, i, `var(--l${(i % 8) + 1})`)).join('') + `<div class="tl-sec">Places</div>` + places.map(e => nameRow(e, 0, 'var(--c-place)')).join('');
  $('#timeline').innerHTML = `<p class="tl-note">Filled dots: on stage in that scene. Hollow dots: mentioned. Tap a scene number to read it again.</p>
    <div class="tl"><div class="tl-names">${names}</div><div class="tl-scroll" id="tl-scroll">${svg}</div></div>`;
  const sc = $('#tl-scroll'); sc.scrollLeft = sc.scrollWidth;
}

    }).join('') + `</div></section>`;
  }

    D.entities.forEach(e => e.names.forEach(n => { if (n[0] === sid && n[0] !== e.first) items.push(['Named', `${esc(e.names.filter(x => x[0] < sid).slice(-1)[0][1])} is ${entBtn(e.id)}`]); }));
    D.entities.forEach(e => e.aka.forEach(a => { if (a[0] === sid) items.push(['Alias', `${entBtn(resolve(e.id, p))} also goes by ${esc(a[1])}`]); }));
    D.merges.filter(m => m.at === sid).forEach(m => items.push(['Revealed', `${esc(nameAt(E[m.from], sid - 1))} was ${entBtn(m.into)}`]));
    D.obs.filter(o => o[1] === sid).forEach(o => items.push(['Fact', `${entBtn(resolve(o[0], p))}: ${esc(o[2] || smart('"' + o[3] + '"'))}`]));
    D.rels.filter(r => r[3] === sid).forEach(r => items.push(['Link', `${entBtn(resolve(r[0], p))} ${esc(r[2])} ${entBtn(resolve(r[1], p))}`]));
    D.rels.filter(r => r[5] === sid).forEach(r => items.push(['Ended', `${entBtn(resolve(r[0], p))} ${esc(r[2])} ${entBtn(resolve(r[1], p))}`]));

  }

      <div><div class="acts"><button class="btn" type="button" data-act="img">${img ? 'Replace picture' : 'Add a picture'}</button>${img ? '<button class="btn" type="button" data-act="unimg">Remove</button>' : ''}</div>

  h += `</div>`;
  const sh = $('#sheet'); sh.innerHTML = h; sh.hidden = false; $('#scrim').hidden = false;
}

const canon = s => String(s == null ? '' : s)

const idb = (() => {
  let opening = null;
  const open = () => opening || (opening = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('bookgraph', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('titles', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);

  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('titles', mode), req = fn(t.objectStore('titles'));
      t.oncomplete = () => res(req && 'result' in req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);

  };
  return {
    all: () => run('readonly', st => st.getAll()),
    put: b => run('readwrite', st => st.put(JSON.parse(JSON.stringify(b)))),
    del: id => run('readwrite', st => st.delete(id)),

const WP = 'https://en.wikipedia.org/w/api.php', WD = 'https://www.wikidata.org/w/api.php';
async function mwApi(base, params, signal) {
  const u = new URL(base);
  for (const [k, v] of Object.entries({ format: 'json', formatversion: '2', origin: '*', ...params })) u.searchParams.set(k, v);
  let r;
  try { r = await fetch(u, { signal }); }
  catch (e) { if (e.name === 'AbortError') throw e; throw new Error('NETWORK'); }
  if (!r.ok) throw new Error(`Wikipedia answered with error ${r.status}.`);
  const j = await r.json();
  if (j.error) throw new Error(j.error.info || j.error.code);
  return j;
}
async function wpSearch(q, signal) {
  const j = await mwApi(WP, { action: 'query', list: 'search', srsearch: q, srlimit: '8', srprop: 'snippet', srnamespace: '0' }, signal);
  return (j.query?.search || []).map(s => ({ title: s.title, snippet: canon(htmlText(s.snippet)) }));
}
const linksOf = el => [...el.querySelectorAll('a[href]')].map(a => {
  const m = (a.getAttribute('href') || '').match(/^(?:\.\/|\/wiki\/)([^#?]+)/);
  if (!m) return null;
  const title = decodeURIComponent(m[1]).replace(/_/g, ' ');
  if (title.includes(':')) return null;
  return { text: canon(a.textContent), title };
}).filter(Boolean);
function cleanDoc(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('sup, .mw-editsection, style, script, table, figure, .thumb, .hatnote, .shortdescription, .mw-empty-elt, .reference, .noprint, .gallery, .mw-references-wrap, .navbox').forEach(n => n.remove());
  return doc;
}
// Paragraphs of a section, with sub-headings as part names and the links in each paragraph.
function parseSectionHTML(html) {
  const doc = cleanDoc(html);
  const out = []; let part = null;
  const walk = el => {
    for (const n of el.children) {
      const tag = n.tagName.toLowerCase();
      if (n.classList.contains('mw-heading')) { const h = n.querySelector('h3, h4, h5'); if (h) part = canon(h.textContent); continue; }
      if (/^h[3-5]$/.test(tag)) { part = canon(n.textContent); continue; }
      if (tag === 'h2') continue;
      if (tag === 'p') { const text = canon(n.textContent); if (text.length > 30) out.push({ part, text, links: linksOf(n) }); continue; }
      if (tag === 'ul' || tag === 'ol') {
        n.querySelectorAll(':scope > li').forEach(li => { const text = canon(li.textContent); if (text.length > 60) out.push({ part, text, links: linksOf(li) }); });
        continue;
      }
      if (tag === 'div' || tag === 'section' || tag === 'blockquote') walk(n);
    }
  };
  walk(doc.querySelector('.mw-parser-output') || doc.body);
  return out;
}
const NOT_A_NAME = /^(additionally|also|other|others|uncredited|cast|voices?|in addition|main|supporting|recurring|guest|minor|the following|various|including|see)\b/i;
const validName = n => n.length >= 2 && n.length <= 48 && /^[A-Z0-9"'À-Ý]/.test(n) && n.split(' ').length <= 6 && !NOT_A_NAME.test(n) && !/[.!?]$/.test(n);
// Character names from a "Cast" list ("Mark Hamill as Luke Skywalker") or a "Characters" list ("Elizabeth Bennet – the second daughter").
function parseCast(html, isCast) {
  const doc = cleanDoc(html), names = [];
  doc.querySelectorAll('li, dt').forEach(li => {
    const c = li.cloneNode(true);
    c.querySelectorAll('ul, ol, dl').forEach(x => x.remove());
    const t = canon(c.textContent);
    if (!t) return;
    const m = isCast && t.match(/\bas\s+(?:the\s+)?(.+?)(?=[,;:(\[]|\s[–—-]\s|$)/);
    const cand = m ? m[1] : t.split(/\s[–—-]\s|:\s|,\s|\s\(/)[0];
    cand.split(/\s*\/\s*|\s+and\s+/).forEach(n => {
      n = canon(n.replace(/^(?:a|an|the)\s+/i, '').replace(/["']/g, ''));
      if (validName(n)) names.push(n);

  });
  return [...new Set(names)];
}
async function qidsForTitles(titles, signal) {
  const map = {};
  for (let i = 0; i < titles.length; i += 50) {
    const batch = titles.slice(i, i + 50);
    const j = await mwApi(WP, { action: 'query', prop: 'pageprops', ppprop: 'wikibase_item', redirects: '1', titles: batch.join('|') }, signal);
    const follow = {};
    (j.query?.normalized || []).forEach(x => { follow[x.from] = x.to; });
    (j.query?.redirects || []).forEach(x => { follow[x.from] = x.to; });
    const byTitle = {};
    (j.query?.pages || []).forEach(pg => { if (pg.pageprops?.wikibase_item) byTitle[pg.title] = pg.pageprops.wikibase_item; });
    batch.forEach(t => { let k = t, hops = 0; while (follow[k] && hops++ < 3) k = follow[k]; if (byTitle[k]) map[t] = byTitle[k]; });
  }

}
async function wdEntities(ids, props, signal) {

    const j = await mwApi(WD, { action: 'wbgetentities', ids: ids.slice(i, i + 50).join('|'), props, languages: 'en' }, signal);
    Object.assign(out, j.entities || {});

}
const claimIds = (ent, p) => ((ent && ent.claims && ent.claims[p]) || []).map(c => c.mainsnak?.datavalue?.value?.id).filter(Boolean);
const wdLabel = ent => (ent && ent.labels && ent.labels.en && ent.labels.en.value) || null;
async function wikidataFor(page, paras, signal) {
  const res = { chars: [], places: [], kind: null, year: '', linkInfo: {}, family: [] };
  const linkTitles = [...new Set(paras.flatMap(p => p.links.map(l => l.title)))].slice(0, 150);
  const q = await qidsForTitles([page, ...linkTitles], signal);
  const workQ = q[page];
  if (!workQ) return res;
  const work = (await wdEntities([workQ], 'claims', signal))[workQ] || {};

  const roleIds = ((work.claims || {}).P161 || []).flatMap(c => ((c.qualifiers || {}).P453 || []).map(x => x.datavalue?.value?.id)).filter(Boolean);
  const date = ((work.claims || {}).P577 || (work.claims || {}).P571 || [])[0]?.mainsnak?.datavalue?.value?.time;
  if (date) res.year = String(parseInt(date.slice(1, 5), 10));

    if (/spacecraft|starship|ship\b|vehicle|weapon|artifact|object|device/.test(ls)) return 'thing';
    if (/planet|city|town|village|country|location|place|island|building|castle|region|moon|station|world|realm|kingdom|street|settlement|mountain|river|forest|continent|land|star system/.test(ls)) return 'place';
    if (/character|human|person|deity|alien|droid|robot|creature|animal/.test(ls)) return 'person';
    if (/organi[sz]ation|group|faction|order|family|army|military|company|team|empire|government|band|gang|tribe|clan|dynasty/.test(ls)) return 'group';
    return 'thing';

  })));
  return res;
}

const HONORIFIC = /^(mr|mrs|ms|miss|dr|sir|dame|lady|lord|king|queen|prince|princess|captain|capt|admiral|general|colonel|major|lieutenant|sergeant|count|countess|duke|duchess|baron|baroness|father|mother|uncle|aunt|professor|inspector|detective|master|saint|st|darth|emperor|empress|young|old|little|big)\.?$/i;

    const ss = units.flatMap(u => sentences(u.text).map(s => ({ part: u.part, text: s, links: u.links })));
    if (ss.length >= 8) {
      units = [];

    if (info && info.label) { c.aliases.add(info.label); labelTo.set(info.label.toLowerCase(), c); }

function titleFromText(title, author, body) {
  const lines = String(body).replace(/\r\n?/g, '\n');
  const HEAD = /^\s*(?:(chapter|book|part|act|scene|letter)\s+([0-9]+|[ivxlcdm]+|[a-z-]+)\b[^\n]{0,60}|([IVXLC]+)\.?)\s*$/i;
  const blocks = lines.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const chapters = []; let cur = null;
  blocks.forEach(b => {
    const firstLine = b.split('\n')[0];
    if (HEAD.test(firstLine) && firstLine.length < 80) {
      cur = { title: canon(firstLine).replace(/\.$/, ''), paras: [] };
      chapters.push(cur);
      const rest = b.split('\n').slice(1).join(' ');
      if (rest.trim()) cur.paras.push(canon(rest));
    } else {
      if (!cur) { cur = { title: null, paras: [] }; chapters.push(cur); }
      cur.paras.push(canon(b));
    }
  });
  let units = chapters.filter(c => c.paras.length);
  // No headings (or one huge chunk): cut into sections of about 1,800 words on paragraph breaks
  if (units.length < 2 || units.some(u => words(u.paras.join(' ')) > 12000)) {
    const all = units.flatMap(u => u.paras), out = [];
    let acc = [], n = 0;
    all.forEach(p => { acc.push(p); n += words(p); if (n >= 1800) { out.push(acc); acc = []; n = 0; } });

    units = out.map((ps, i) => ({ title: `Section ${i + 1}`, paras: ps }));
  }
  if (!units.length) throw new Error('There is no text to add.');
  title = canon(title) || 'Untitled text';
  return {
    id: 'tx-' + slugify(title), user: true, origin: 'text', added: Date.now(),
    book: {
      title, author: canon(author) || 'Your text', byline: canon(author) || 'Your text', year: '', kind: 'text', readLabel: 'Read',
      cover: title.replace(/^(The|A|An) /, '').charAt(0).toUpperCase(),
      source: 'Text you added, kept in this browser',
      about: 'Your own text, kept in this browser. Analyze with AI to build the graph. It only reads up to where you are, one section at a time, and every item it adds must quote that section.',
    },
    defaultPos: 1, parts: [],
    scenes: units.map((u, i) => ({ id: i + 1, title: u.title || `Section ${i + 1}`, part: null, place: null, present: [], mentioned: [], paras: u.paras })),

  if (c === 'rate_limited') return "You've hit a usage limit. Try again later.";
  if (c === 'invalid_json') return "Claude's answer couldn't be read. Try that scene again.";
  if (c === 'http_401') return 'The API key was refused. Check it in AI settings.';
  if (c === 'network') return "Couldn't reach the API from this page.";
  if (c === 'no_provider') return 'Set up AI first, in AI settings.';
  return (e && e.message) || 'Something went wrong. Try again.';
}
// Re-derive the open title's lookups after its data changed (keeps the reading position).
function loadBookData() {
  E = Object.fromEntries(D.entities.map(e => [e.id, e]));
  sceneText = D.scenes.map(s => s.paras.join('\n'));
  allQuotes = [
    ...D.obs.map(o => [o[1], o[3]]), ...D.rels.map(r => [r[3], r[4]]),
    ...D.questions.flatMap(q => q.answered ? [[q.raised, q.rq], [q.answered, q.aq]] : [[q.raised, q.rq]]),
    ...D.entities.flatMap(e => [...e.names.filter(n => n[2]).map(n => [n[0], n[2]]), ...e.aka.map(a => [a[0], a[2]])]),
    ...D.merges.map(m => [m.at, m.quote]),
  ];
  verified = allQuotes.filter(([s, q]) => quoteOK(s, q)).length;
  D.checked = true;
}
function aiCardHTML() {
  if (!D.user) return '';
  const done = D.ai.done.length, upTo = S.pos;
  const todo = D.scenes.filter(s => s.id <= upTo && !D.ai.done.includes(s.id)).length;
  const p = aiProvider();
  let h = `<section class="ai-card"><h2 class="sec-h">AI analysis <span class="n">${done} of ${N} scenes</span></h2>
    <p>${esc(aiProviderText())} It reads one scene at a time, only up to where you are, and keeps an item only if its quote is in that scene.</p>`;
  if (aiRun) h += `<div class="ai-row"><span class="ai-spin" aria-hidden="true"></span><span id="ai-msg">Analyzing scene ${aiRun.sid}…</span><button class="btn" type="button" data-act="ai-stop">Stop</button></div>`;
  else {
    h += `<div class="ai-row">${p
      ? (todo ? `<button class="btn primary" type="button" data-act="ai-run">${todo === 1 ? `Analyze scene ${D.scenes.find(s => s.id <= upTo && !D.ai.done.includes(s.id)).id}` : `Analyze ${todo} scenes, up to scene ${upTo}`}</button>` : `<span>Analyzed up to scene ${upTo}. Move forward to analyze more.</span>`)
      : `<button class="btn primary" type="button" data-act="ai-setup">Set up AI</button>`}
      <button class="btn" type="button" data-act="ai-setup">AI settings</button></div><div class="ai-msg" id="ai-msg" role="status"></div>`;
  }
  return h + `</section>`;
}
function renderAIStatus() { const el = $('#ai-msg'); if (el && aiRun) el.textContent = `Analyzing scene ${aiRun.sid}…` + (aiRun.last ? ` ${aiRun.last}` : ''); }

/* ---------- Library views ---------- */
let wpCtl = null;
function openLibrary(mode = true) {
  const had = S.sel; S.sel = null; S.lib = mode;
  if (had) renderGraph();
  const sh = $('#sheet');
  const head = (title, sub, back) => `<div class="sheet-h gutter"><div>${back ? `<button class="linkbtn" type="button" data-act="lib">‹ Library</button>` : `<span class="type">${esc(sub)}</span>`}<h2 id="sheet-title">${esc(title)}</h2></div>
      <button class="x" type="button" data-act="close" aria-label="Close">×</button></div>`;
  let h = '';
  if (mode === 'wp') {
    h = head('Add from Wikipedia', '', true) + `<div class="sheet-b gutter">
      <p class="shelf-note">Finds a book, film or show on Wikipedia and builds its graph from the plot summary, without AI. You can analyze it with AI afterwards.</p>
      <form class="addform" id="wp-form"><input class="search" id="wp-q" type="search" placeholder="Search Wikipedia" autocomplete="off" aria-label="Search Wikipedia"><button class="btn primary" type="submit">Search</button></form>
      <div class="results" id="wp-results"></div><div class="ai-msg" id="wp-status" role="status"></div></div>`;
  } else if (mode === 'text') {
    h = head('Add your own text', '', true) + `<div class="sheet-b gutter">
      <p class="shelf-note">Paste a story or choose a .txt file. Chapter headings become steps; otherwise it's cut into sections of about 1,800 words. The text stays in this browser. Use AI analysis to build its graph.</p>
      <div class="addform col"><input class="search" id="tx-title" placeholder="Title" aria-label="Title"><input class="search" id="tx-author" placeholder="Author (optional)" aria-label="Author">
      <textarea class="search area" id="tx-body" rows="8" placeholder="Paste the text here" aria-label="Text"></textarea>
      <div class="ai-row"><label class="btn file">Choose a .txt file<input type="file" id="tx-file" accept=".txt,text/plain" hidden></label><button class="btn primary" type="button" data-act="tx-add">Add to library</button></div>
      <div class="ai-msg" id="tx-status" role="status"></div></div></div>`;
  } else if (mode === 'ai') {
    const opt = (v, label, note, disabled) => `<label class="opt${disabled ? ' off' : ''}"><input type="radio" name="ai-p" value="${v}"${AI.provider === v ? ' checked' : ''}${disabled ? ' disabled' : ''}><span><b>${label}</b><small>${note}</small></span></label>`;
    const models = MODELS.map(([v, l]) => `<option value="${v}"${AI.model === v ? ' selected' : ''}>${esc(l)}</option>`).join('');
    h = head('AI settings', '', true) + `<div class="sheet-b gutter"><div class="addform col">
      ${opt('auto', 'Automatic', 'Uses Claude on this page when it can, otherwise your API key, otherwise your server.')}
      ${opt('claude', 'Claude on this page', sampleFn ? 'Uses your own Claude plan. Claude asks once before the first analysis.' : 'Only available when Story Atlas is opened on claude.ai.', !sampleFn)}
      ${opt('key', 'Your Anthropic API key', 'Billed to your API account, separate from a Claude plan.')}
      <input class="search" id="ai-key" type="password" placeholder="sk-ant-…" value="${esc(AI.key)}" autocomplete="off" aria-label="Anthropic API key">
      ${opt('server', 'Your own server', 'Any address that accepts Anthropic Messages API requests, such as a Cloudflare Worker holding your key.')}
      <input class="search" id="ai-url" type="url" placeholder="https://…" value="${esc(AI.url)}" aria-label="Server address">
      <label class="lbl" for="ai-model">Model for the API key or server</label><select class="search" id="ai-model">${models}</select>
      <div class="ai-row"><button class="btn primary" type="button" data-act="ai-save">Save</button><button class="btn" type="button" data-act="ai-clear">Forget key</button></div>
      <p class="shelf-note">Your key and server address are stored in this browser only, and sent only to Anthropic or your server.</p>
      <div class="ai-msg" id="ai-set-status" role="status"></div></div></div>`;
  } else {
    const covers = ['var(--accent)', 'var(--l2)', 'var(--l4)', 'var(--l5)', 'var(--l3)', 'var(--l7)'];
    h = head('Library', `${LIB.books.length} titles`) + `<div class="sheet-b gutter">
      <div class="ai-row"><button class="btn" type="button" data-act="add-wp">Add from Wikipedia</button><button class="btn" type="button" data-act="add-text">Add your own text</button><button class="btn" type="button" data-act="ai-setup">AI settings</button></div>
      <div class="shelf">`;
    LIB.books.forEach((b, i) => {
      const sp = savedPos(b), n = b.scenes.length, cur = b.id === S.book;
      const num = b.book.cover || (b.book.source.match(/Adventure ([IVX]+)$/) || [])[1] || b.book.title.charAt(0);
      const at = cur ? S.pos : sp;
      const tag = b.origin === 'wikipedia' ? ' · from Wikipedia' : b.origin === 'text' ? ' · your text' : '';
      const aiTag = b.ai && b.ai.done.length ? ` · AI ${b.ai.done.length}/${n}` : '';
      h += `<div class="vol-wrap"><button class="vol" type="button" data-book="${esc(b.id)}" aria-current="${cur}">
        <span class="cover" style="background:${covers[i % covers.length]}" aria-hidden="true">${esc(num)}</span>
        <span style="min-width:0"><span class="vol-t">${esc(b.book.title)}</span>
        <div class="vol-m">${esc(byline(b.book))} · ${n} ${n === 1 ? 'step' : 'steps'} · ${b.entities.length} names${tag}${aiTag}</div>
        <div class="vol-p">${at ? `<span class="prog"><i style="width:${(at / n) * 100}%"></i></span><span>${cur ? '<span class="pill">Reading</span> ' : ''}${at} of ${n}</span>` : `<span class="prog"><i style="width:0"></i></span><span>Not started</span>`}</div></span>
      </button>${b.user ? `<button class="linkbtn vol-x" type="button" data-remove="${esc(b.id)}">Remove</button>` : ''}</div>`;
    });
    h += `</div><p class="shelf-note">Titles you add are kept in this browser only. Each title keeps its own position and pictures.</p></div>`;
  }
  sh.innerHTML = h; sh.hidden = false; $('#scrim').hidden = false;
  if (mode === 'wp') $('#wp-q').focus();
  else if (mode === true) { const b = sh.querySelector('.vol[aria-current="true"]'); if (b) b.focus(); }
}
async function doWpSearch(q) {
  const box = $('#wp-results'), st = $('#wp-status');
  if (!q.trim()) return;
  if (wpCtl) wpCtl.abort();
  wpCtl = new AbortController();
  st.className = 'ai-msg'; st.textContent = 'Searching…'; box.innerHTML = '';
  try {
    const rs = await wpSearch(q, wpCtl.signal);
    st.textContent = rs.length ? '' : 'Nothing found. Try the full title.';
    box.innerHTML = rs.map(r => `<button class="res" type="button" data-wp="${esc(r.title)}"><b>${esc(r.title)}</b><small>${esc(r.snippet)}</small></button>`).join('');
  } catch (e) {
    if (e.name === 'AbortError') return;
    st.className = 'ai-msg bad';
    st.textContent = e.message === 'NETWORK' ? "This copy of Story Atlas can't reach Wikipedia. Open the GitHub version to add titles from Wikipedia." : e.message;
  }
}
async function doWpAdd(title) {
  const st = $('#wp-status');
  if (wpCtl) wpCtl.abort();
  wpCtl = new AbortController();
  $('#wp-results').innerHTML = '';
  st.className = 'ai-msg';
  try {
    const b = await scanWikipedia(title, msg => { st.textContent = `${msg}…`; }, wpCtl.signal);
    if (!b.entities.length) throw new Error(`No names were found in the plot of "${b.book.title}".`);
    closeSheet();
    const saved = await addTitle(b);
    if (!saved) console.warn('This title will not be kept after you leave the page.');
  } catch (e) {
    if (e.name === 'AbortError') return;
    st.className = 'ai-msg bad';
    st.textContent = e.message === 'NETWORK' ? "This copy of Story Atlas can't reach Wikipedia. Open the GitHub version to add titles from Wikipedia." : e.message;
  }
}
async function doTextAdd() {
  const st = $('#tx-status');
  try {
    const b = titleFromText($('#tx-title').value, $('#tx-author').value, $('#tx-body').value);
    closeSheet();
    await addTitle(b);
    showTab('log');
  } catch (e) { st.className = 'ai-msg bad'; st.textContent = e.message; }
}
function saveAISettings() {
  const pick = document.querySelector('input[name="ai-p"]:checked');
  AI.provider = pick ? pick.value : 'auto';
  AI.key = ($('#ai-key').value || '').trim();
  AI.url = ($('#ai-url').value || '').trim();
  AI.model = $('#ai-model').value;
  const ok = store.set('ai', AI);
  const st = $('#ai-set-status');
  st.className = 'ai-msg' + (aiProvider() ? '' : ' bad');
  st.textContent = !ok ? "Saved for now, but this browser won't keep it after you leave." : aiProvider() ? `Saved. ${aiProviderText()}` : 'Saved, but nothing is set up yet: add a key or server address.';
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act], [data-wp], [data-remove]');
  if (!t) return;
  if (t.dataset.wp) return doWpAdd(t.dataset.wp);
  if (t.dataset.remove) return removeTitle(t.dataset.remove);
  const a = t.dataset.act;
  if (a === 'lib') return openLibrary();
  if (a === 'add-wp') return openLibrary('wp');
  if (a === 'add-text') return openLibrary('text');
  if (a === 'ai-setup') return openLibrary('ai');
  if (a === 'ai-save') return saveAISettings();
  if (a === 'ai-clear') { AI.key = ''; store.set('ai', AI); return openLibrary('ai'); }
  if (a === 'tx-add') return doTextAdd();
  if (a === 'ai-run') return runAI();
  if (a === 'ai-stop') { if (aiRun) aiRun.ctl.abort(); return; }
});
document.addEventListener('submit', ev => {
  if (ev.target.id === 'wp-form') { ev.preventDefault(); doWpSearch($('#wp-q').value); }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'tx-file' && ev.target.files[0]) {
    const f = ev.target.files[0], fr = new FileReader();
    fr.onload = () => { $('#tx-body').value = fr.result; if (!$('#tx-title').value) $('#tx-title').value = f.name.replace(/\.txt$/i, ''); };
    fr.readAsText(f);
  }
});


/* ---------- Start ---------- */
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id !== S.book && LIB.books.some(b => b.id === id)) switchBook(id);
});
function start() {
  const fromHash = location.hash.slice(1);
  loadBook(LIB.books.some(b => b.id === fromHash) ? fromHash : store.get('book', LIB.books[0].id));
  renderReader();
  showTab(['read', 'graph', 'timeline', 'index', 'log'].includes(S.tab) ? S.tab : 'graph');
}
Promise.race([idb.all(), new Promise(res => setTimeout(() => res([]), 1500))])
  .then(ts => (ts || []).forEach(t => { if (t && t.id && !LIB.books.some(b => b.id === t.id)) { t.checked = false; LIB.books.push(t); } }))
  .catch(() => {})
  .then(start);
</script>
