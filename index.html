const N = D.scenes.length;
const E = Object.fromEntries(D.entities.map(e => [e.id, e]));
const TYPES = [['person', 'People'], ['place', 'Places'], ['thing', 'Things'], ['group', 'Groups']];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const wide = () => matchMedia('(min-width: 960px)').matches;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const store = {
  get(k, d) { try { const v = localStorage.getItem('bookgraph:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { if (v == null) localStorage.removeItem('bookgraph:' + k); else localStorage.setItem('bookgraph:' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const clampPos = p => Math.max(1, Math.min(N, Math.round(+p) || 1));
const S = {
  pos: clampPos(store.get('pos', 6)),
  tab: store.get('tab', 'graph'),
  view: null,          // scene shown in the reader when looking back
  quote: null,         // quote to highlight in the reader
  sel: null,           // entity open in the sheet
  filters: { person: true, place: true, thing: true, group: true },
  q: '',
};

/* ---------- Knowledge as of a position ---------- */
const resolve = (id, p) => { const m = D.merges.find(m => m.from === id && p >= m.at); return m ? m.into : id; };
const visible = (e, p) => e.first <= p && resolve(e.id, p) === e.id;
const nameAt = (e, p) => { let n = e.names[0][1]; for (const x of e.names) if (x[0] <= p) n = x[1]; return n; };
const obsAt = p => D.obs.filter(o => o[1] <= p).map(o => ({ e: resolve(o[0], p), orig: o[0], s: o[1], t: o[2], q: o[3] }));
const relsAt = p => D.rels.filter(r => r[3] <= p).map(r => ({ a: resolve(r[0], p), b: resolve(r[1], p), label: r[2], s: r[3], q: r[4], end: r[5], ended: !!(r[5] && r[5] <= p) }));
const present = (s, p) => new Set(s.present.map(id => resolve(id, p)));
const mentioned = (s, p) => new Set(s.mentioned.map(id => resolve(id, p)));
function weight(id, p) {
  let w = 0;
  for (const o of obsAt(p)) if (o.e === id) w++;
  for (const r of relsAt(p)) if (r.a === id || r.b === id) w++;
  for (const s of D.scenes) if (s.id <= p && present(s, p).has(id)) w++;
  return w;
}
const isNew = (e, p) => e.first === p || e.names.some(n => n[0] === p && n[0] !== e.first) || D.merges.some(m => m.into === e.id && m.at === p);
const partOf = id => D.scenes[id - 1].part;
const scene = id => D.scenes[id - 1];

// Quote check: each quote must appear in its own scene's text.
const sceneText = D.scenes.map(s => s.paras.join('\n'));
const quoteOK = (sid, q) => sceneText[sid - 1].includes(q);
const allQuotes = [
  ...D.obs.map(o => [o[1], o[3]]), ...D.rels.map(r => [r[3], r[4]]),
  ...D.questions.flatMap(q => [[q.raised, q.rq], [q.answered, q.aq]]),
  ...D.entities.flatMap(e => e.names.filter(n => n[2]).map(n => [n[0], n[2]])), ...D.merges.map(m => [m.at, m.quote]),
];
const verified = allQuotes.filter(([s, q]) => quoteOK(s, q)).length;
// Anything whose quote fails is dropped, as the real pipeline would.
D.obs = D.obs.filter(o => quoteOK(o[1], o[3]));
D.rels = D.rels.filter(r => quoteOK(r[3], r[4]));

/* ---------- Typography helpers ---------- */
function smart(s) { // same length, so indexes still line up
  let o = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i], pr = i ? s[i - 1] : ' ';
    if (c === '"') o += /[\s(\[—‘“]/.test(pr) ? '“' : '”';
    else if (c === "'") o += /[\s(\[—“]/.test(pr) ? '‘' : '’';
    else o += c;
  }
  return o;
}
function aliasIndex(sceneId) {
  const map = new Map();
  for (const e of D.entities) for (const [t, from, to] of e.match) {
    if (from > S.pos || (to && sceneId > to)) continue;
    if (!map.has(t)) map.set(t, resolve(e.id, S.pos));
  }
  for (const t of D.ignore) map.set(t, null);
  const alts = [...map.keys()].sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return { map, re: new RegExp('(^|[^A-Za-zé])(' + alts.join('|') + ')(?![A-Za-z])', 'g') };
}
function paraHTML(raw, ai, quote) {
  const sm = smart(raw), spans = [];
  ai.re.lastIndex = 0; let m;
  while ((m = ai.re.exec(raw))) {
    const st = m.index + m[1].length;
    spans.push([st, st + m[2].length, ai.map.get(m[2])]);
  }
  const qi = quote ? raw.indexOf(quote) : -1, qe = qi + (quote ? quote.length : 0);
  const cuts = new Set([0, raw.length]);
  spans.forEach(s => { cuts.add(s[0]); cuts.add(s[1]); });
  if (qi >= 0) { cuts.add(qi); cuts.add(qe); }
  const pts = [...cuts].sort((a, b) => a - b);
  let h = '';
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const sp = spans.find(s => s[0] <= a && b <= s[1]);
    let seg = esc(sm.slice(a, b));
    if (sp && sp[2]) seg = `<span class="nm t-${E[sp[2]].type}" role="button" tabindex="0" data-id="${sp[2]}">${seg}</span>`;
    if (qi >= 0 && a >= qi && b <= qe) seg = `<mark class="q">${seg}</mark>`;
    h += seg;
  }
  return h;
}
const entBtn = id => `<button class="ent" type="button" data-id="${id}">${esc(nameAt(E[id], S.pos))}</button>`;

/* ---------- Dock ---------- */
function renderDock() {
  const s = scene(S.pos);
  $('#where-k').textContent = `Part ${s.part} · Scene ${S.pos} of ${N}`;
  $('#where-t').textContent = s.title;
  $('#pos').value = S.pos;
  $('#prev').disabled = S.pos <= 1; $('#next').disabled = S.pos >= N;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
}
function renderTicks() {
  $('#ticks').innerHTML = D.parts.map(pt => `<span style="left:${((pt.start - 1) / (N - 1)) * 100}%">${pt.n}</span>`).join('');
}

/* ---------- Reader ---------- */
function renderReader() {
  const sid = S.view || S.pos, s = scene(sid), ai = aliasIndex(sid);
  const place = s.place ? `At ${esc(nameAt(E[s.place], S.pos))}` : 'Narration';
  let h = '';
  if (S.view && S.view !== S.pos) h += `<div class="viewing"><span>Looking back at scene ${sid}. You're at scene ${S.pos}.</span><button class="linkbtn" type="button" data-act="back">Return to scene ${S.pos}</button></div>`;
  h += `<div class="eyebrow">Part ${s.part} · Scene ${sid}</div><h1 class="scene-title">${esc(s.title)}</h1><div class="scene-place">${place}</div>`;
  if (!S.view || S.view === S.pos) {
    const newE = D.entities.filter(e => visible(e, sid) && isNew(e, sid));
    const nf = obsAt(sid).filter(o => o.s === sid).length, nr = relsAt(sid).filter(r => r.s === sid).length;
    h += `<div class="added"><b>Added to the graph:</b> ${newE.length ? newE.map(e => entBtn(e.id)).join(', ') : 'no new names'} · ${nf} facts · ${nr} links</div>`;
  }
  h += `<div class="prose">${s.paras.map(p => `<p>${paraHTML(p, ai, S.quote && S.quote.s === sid ? S.quote.q : null)}</p>`).join('')}</div>`;
  if (!S.view || S.view === S.pos) {
    h += S.pos < N
      ? `<button class="next" type="button" data-act="next"><small>Read on · Scene ${S.pos + 1}</small>${esc(scene(S.pos + 1).title)}</button>`
      : `<div class="end">The end of the story.</div>`;
  }
  $('#reader').innerHTML = h;
  const mk = $('#reader mark.q');
  if (mk) requestAnimationFrame(() => mk.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' }));
}

/* ---------- Graph ---------- */
let G = null;
function initGraph() {
  const svg = d3.select('#graph');
  const root = svg.append('g');
  const gl = root.append('g'), gt = root.append('g'), gn = root.append('g');
  const zoom = d3.zoom().scaleExtent([0.25, 4]).on('zoom', ev => root.attr('transform', ev.transform));
  svg.call(zoom).on('dblclick.zoom', null);
  const sim = d3.forceSimulation()
    .force('link', d3.forceLink().id(d => d.id).distance(78).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-260))
    .force('x', d3.forceX(0).strength(0.06)).force('y', d3.forceY(0).strength(0.08))
    .force('collide', d3.forceCollide().radius(d => d.r + 16));
  G = { svg, root, gl, gt, gn, sim, zoom, nodes: new Map(), fitted: false };
  sim.on('tick', tick);
  new ResizeObserver(sizeGraph).observe($('#pane-graph'));
  sizeGraph();
}
function sizeGraph() {
  if (!G) return;
  const r = $('#pane-graph').getBoundingClientRect();
  if (!r.width) return;
  G.svg.attr('viewBox', [-r.width / 2, -r.height / 2, r.width, r.height]);
}
function tick() {
  G.gl.selectAll('line').attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  G.gt.selectAll('text').attr('x', d => (d.source.x + d.target.x) / 2).attr('y', d => (d.source.y + d.target.y) / 2);
  G.gn.selectAll('g.nd').attr('transform', d => `translate(${d.x},${d.y})`);
}
function fitGraph(animate) {
  if (!G) return;
  const ns = [...G.sim.nodes()];
  if (!ns.length) return;
  const r = $('#pane-graph').getBoundingClientRect();
  if (!r.width || !r.height) return;
  const x0 = d3.min(ns, d => d.x - d.r - 60), x1 = d3.max(ns, d => d.x + d.r + 60);
  const y0 = d3.min(ns, d => d.y - d.r - 20), y1 = d3.max(ns, d => d.y + d.r + 30);
  const k = Math.min(1.6, Math.min(r.width / (x1 - x0), (r.height - 110) / (y1 - y0)));
  const t = d3.zoomIdentity.translate(-k * (x0 + x1) / 2, -k * (y0 + y1) / 2 + 6).scale(k);
  (animate && !reduced ? G.svg.transition().duration(500) : G.svg).call(G.zoom.transform, t);
}
function renderGraphControls() {
  const p = S.pos;
  $('#g-controls').innerHTML = TYPES.map(([t, label]) => {
    const n = D.entities.filter(e => e.type === t && visible(e, p)).length;
    return `<button class="chip" type="button" data-filter="${t}" aria-pressed="${S.filters[t]}"><span class="dot ${t}"></span>${label} ${n}</button>`;
  }).join('');
}
function renderGraph() {
  renderGraphControls();
  if (!window.d3) { const m = $('#g-msg'); m.hidden = false; m.textContent = "The graph library didn't load. Check your connection and reload the page."; return; }
  if (!G) initGraph();
  const p = S.pos;
  const ents = D.entities.filter(e => visible(e, p) && S.filters[e.type]);
  const ids = new Set(ents.map(e => e.id));
  const rels = relsAt(p).filter(r => ids.has(r.a) && ids.has(r.b) && r.a !== r.b);
  const nodes = ents.map(e => {
    let n = G.nodes.get(e.id);
    if (!n) {
      const nb = rels.find(r => (r.a === e.id && G.nodes.has(r.b)) || (r.b === e.id && G.nodes.has(r.a)));
      const m = nb ? G.nodes.get(nb.a === e.id ? nb.b : nb.a) : null;
      n = { id: e.id, x: (m ? m.x : 0) + (Math.random() - .5) * 60, y: (m ? m.y : 0) + (Math.random() - .5) * 60 };
      G.nodes.set(e.id, n);
    }
    n.e = e; n.r = 7 + Math.sqrt(weight(e.id, p)) * 2.6; n.name = nameAt(e, p); n.fresh = isNew(e, p); n.img = imgOf(e.id);
    return n;
  });
  const links = rels.map(r => ({ id: `${r.a}|${r.b}|${r.label}`, source: r.a, target: r.b, r }));

  const near = new Set();
  if (S.sel) { near.add(S.sel); rels.forEach(r => { if (r.a === S.sel) near.add(r.b); if (r.b === S.sel) near.add(r.a); }); }
  G.svg.classed('has-sel', !!S.sel && ids.has(S.sel));

  G.gl.selectAll('line').data(links, d => d.id).join('line')
    .attr('class', d => 'lk' + (d.r.ended ? ' ended' : '') + (d.r.s === p && !d.r.ended ? ' new' : '') + (S.sel && (d.r.a === S.sel || d.r.b === S.sel) ? ' near' : ''));
  G.gt.selectAll('text').data(links, d => d.id).join('text')
    .attr('class', d => 'lk-t' + (S.sel && (d.r.a === S.sel || d.r.b === S.sel) ? ' near' : '')).attr('text-anchor', 'middle').attr('dy', -3)
    .text(d => d.r.label);

  const ng = G.gn.selectAll('g.nd').data(nodes, d => d.id).join(enter => {
    const g = enter.append('g').attr('class', 'nd');
    g.append('circle').attr('class', 'ring');
    g.append('circle').attr('class', 'b');
    g.append('text').attr('text-anchor', 'middle');
    g.on('click', (ev, d) => { ev.stopPropagation(); openSheet(d.id); });
    g.call(d3.drag()
      .on('start', (ev, d) => { if (!ev.active) G.sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on('end', (ev, d) => { if (!ev.active) G.sim.alphaTarget(0); d.fx = null; d.fy = null; }));
    return g;
  });
  ng.attr('class', d => `nd ${d.e.type}${S.sel === d.id ? ' sel' : ''}${near.has(d.id) ? ' near' : ''}`)
    .attr('aria-label', d => d.name);
  ng.select('circle.b').attr('r', d => d.r);
  ng.select('circle.ring').attr('r', d => d.r + 4).attr('opacity', d => d.fresh ? 1 : 0).classed('pulse', d => d.fresh);
  ng.select('text').attr('y', d => d.r + 14).text(d => d.name);
  ng.each(function (d) {
    const g = d3.select(this);
    g.selectAll('.pic, .pic-ring, clipPath').remove();
    if (d.img) {
      const cid = 'clip-' + d.id;
      g.insert('clipPath', 'text').attr('id', cid).append('circle').attr('r', d.r);
      g.insert('image', 'text').attr('class', 'pic').attr('href', d.img).attr('x', -d.r).attr('y', -d.r).attr('width', d.r * 2).attr('height', d.r * 2)
        .attr('preserveAspectRatio', 'xMidYMid slice').attr('clip-path', `url(#${cid})`);
      g.insert('circle', 'text').attr('class', 'pic-ring').attr('r', d.r);
    }
  });

  G.sim.nodes(nodes);
  G.sim.force('link').links(links);
  if (reduced) { G.sim.alpha(1); for (let i = 0; i < 300; i++) G.sim.tick(); tick(); G.sim.stop(); }
  else G.sim.alpha(0.7).restart();
  if (!G.fitted) { G.fitted = true; setTimeout(() => fitGraph(false), reduced ? 0 : 900); }
}

/* ---------- Timeline ---------- */
function renderTimeline() {
  const p = S.pos, CW = 38, RH = 28, HH = 44;
  const order = (a, b) => a.first - b.first || weight(b.id, p) - weight(a.id, p);
  const people = D.entities.filter(e => (e.type === 'person' || e.type === 'group') && visible(e, p)).sort(order);
  const places = D.entities.filter(e => e.type === 'place' && visible(e, p) && D.scenes.some(s => s.id <= p && s.place === e.id)).sort(order);
  const cols = D.scenes.filter(s => s.id <= p);
  const W = cols.length * CW + 16, H = HH + (people.length + 1 + places.length) * RH + 8;
  const cx = id => 8 + (id - 1) * CW + CW / 2;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Who appears in each scene">`;
  svg += `<rect class="tl-cur" x="${cx(p) - CW / 2}" y="0" width="${CW}" height="${H}"/>`;
  D.parts.filter(pt => pt.start <= p).forEach(pt => { svg += `<text class="tl-part" x="${cx(pt.start) - CW / 2 + 4}" y="14">PART ${pt.n}</text>`; if (pt.start > 1) svg += `<line class="tl-grid" x1="${cx(pt.start) - CW / 2}" x2="${cx(pt.start) - CW / 2}" y1="4" y2="${H}"/>`; });
  cols.forEach(s => { svg += `<text class="tl-h${s.id === p ? ' cur' : ''}" data-scene="${s.id}" x="${cx(s.id)}" y="36" text-anchor="middle">${s.id}</text>`; });
  const rowY = i => HH + i * RH + RH / 2;
  people.forEach((e, i) => {
    const y = rowY(i), col = `var(--l${(i % 8) + 1})`;
    svg += `<line class="tl-grid" x1="0" x2="${W}" y1="${y}" y2="${y}" stroke-dasharray="1 4"/>`;
    const pres = cols.filter(s => present(s, p).has(e.id)).map(s => s.id);
    for (let k = 0; k < pres.length - 1; k++) svg += `<line x1="${cx(pres[k])}" x2="${cx(pres[k + 1])}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="3" stroke-linecap="round" opacity="${pres[k + 1] - pres[k] === 1 ? .9 : .35}"/>`;
    cols.forEach(s => {
      if (present(s, p).has(e.id)) svg += `<circle cx="${cx(s.id)}" cy="${y}" r="6" fill="${col}"/>`;
      else if (mentioned(s, p).has(e.id)) svg += `<circle cx="${cx(s.id)}" cy="${y}" r="4" fill="var(--leaf)" stroke="${col}" stroke-width="1.5"/>`;
    });
  });
  const py0 = people.length + 1;
  places.forEach((e, i) => {
    const y = rowY(py0 + i);
    svg += `<line class="tl-grid" x1="0" x2="${W}" y1="${y}" y2="${y}" stroke-dasharray="1 4"/>`;
    cols.forEach(s => {
      if (s.place === e.id) svg += `<rect x="${cx(s.id) - 7}" y="${y - 7}" width="14" height="14" rx="3" fill="var(--c-place)"/>`;
      else if (mentioned(s, p).has(e.id)) svg += `<rect x="${cx(s.id) - 4}" y="${y - 4}" width="8" height="8" rx="2" fill="var(--leaf)" stroke="var(--c-place)" stroke-width="1.5"/>`;
    });
  });
  svg += `</svg>`;
  const nameRow = (e, i, col) => `<button class="tl-name" type="button" data-id="${e.id}"><span class="dot" style="background:${col}"></span>${esc(nameAt(e, p))}</button>`;
  const names = people.map((e, i) => nameRow(e, i, `var(--l${(i % 8) + 1})`)).join('') + `<div class="tl-sec">Places</div>` + places.map(e => nameRow(e, 0, 'var(--c-place)')).join('');
  $('#timeline').innerHTML = `<p class="tl-note">Filled dots: on stage in that scene. Hollow dots: mentioned. Tap a scene number to read it again.</p>
    <div class="tl"><div class="tl-names">${names}</div><div class="tl-scroll" id="tl-scroll">${svg}</div></div>`;
  const sc = $('#tl-scroll'); sc.scrollLeft = sc.scrollWidth;
}

/* ---------- Index ---------- */
function renderIndex() {
  const p = S.pos, q = S.q.trim().toLowerCase();
  const ob = obsAt(p), rl = relsAt(p);
  let h = `<input class="search" id="search" type="search" placeholder="Search names" value="${esc(S.q)}" aria-label="Search names">`;
  for (const [t, label] of TYPES) {
    const list = D.entities.filter(e => e.type === t && visible(e, p))
      .filter(e => !q || e.names.some(n => n[0] <= p && n[1].toLowerCase().includes(q)))
      .sort((a, b) => weight(b.id, p) - weight(a.id, p));
    if (!list.length) continue;
    h += `<section><h2 class="sec-h">${label} <span class="n">${list.length}</span></h2><div class="rows">` + list.map(e => {
      const f = ob.filter(o => o.e === e.id).length, l = rl.filter(r => r.a === e.id || r.b === e.id).length;
      const older = e.names.filter(n => n[0] <= p).map(n => n[1]).filter(n => n !== nameAt(e, p));
      const sub = older.length ? 'Earlier: ' + older.join(', ') : (ob.filter(o => o.e === e.id).slice(-1)[0] || {}).t || '';
      return `<button class="row" type="button" data-id="${e.id}"><span class="dot ${t}"></span><span style="min-width:0"><div class="row-n">${esc(nameAt(e, p))} ${isNew(e, p) ? '<span class="pill">New</span>' : ''}</div><div class="row-s">${esc(sub)}</div></span><span class="row-c">${f} facts<br>${l} links</span></button>`;
    }).join('') + `</div></section>`;
  }
  $('#index').innerHTML = h;
}

/* ---------- Log ---------- */
function renderLog() {
  const p = S.pos;
  let h = `<div class="about">
    <p><b>Prototype.</b> Claude read this story ahead of time and bundled what it found into this page, so nothing is sent anywhere while you read. Every fact carries a quote, and the page checks each one against the text of its own scene before showing it.</p>
    <div class="check">${verified} of ${allQuotes.length} quotes found word for word in their scene</div>
    <p style="color:var(--ink-2)">Text: ${esc(D.book.source)}. Pictures you add stay in this browser only.</p></div>`;
  const qs = D.questions.filter(q => q.raised <= p).sort((a, b) => (a.answered <= p) - (b.answered <= p) || b.raised - a.raised);
  if (qs.length) {
    const open = qs.filter(q => q.answered > p).length;
    h += `<section><h2 class="sec-h">Questions <span class="n">${open} open</span></h2><div class="qs">` + qs.map(q => {
      const done = q.answered <= p;
      return `<div class="qcard${done ? ' done' : ''}"><div class="qq">${esc(q.q)}</div>${done ? `<div class="qa">${esc(q.a)}</div>` : ''}
        <div class="qm">Raised in scene ${q.raised}${done ? ` · answered in scene ${q.answered}` : ''} · <button class="linkbtn" type="button" data-show="${done ? q.answered : q.raised}" data-q="${esc(done ? q.aq : q.rq)}">Show in text</button></div></div>`;
    }).join('') + `</div></section>`;
  }
  h += `<section><h2 class="sec-h">What each scene added</h2><div class="logs">`;
  for (let sid = p; sid >= 1; sid--) {
    const s = scene(sid), items = [];
    D.entities.filter(e => e.first === sid).forEach(e => items.push(['New', `${entBtn(e.id)} <span style="color:var(--ink-2)">· ${e.type}</span>`]));
    D.entities.forEach(e => e.names.forEach(n => { if (n[0] === sid && n[0] !== e.first) items.push(['Named', `${esc(e.names.filter(x => x[0] < sid).slice(-1)[0][1])} is ${entBtn(e.id)}`]); }));
    D.merges.filter(m => m.at === sid).forEach(m => items.push(['Revealed', `${esc(nameAt(E[m.from], sid - 1))} was ${entBtn(m.into)}`]));
    D.obs.filter(o => o[1] === sid).forEach(o => items.push(['Fact', `${entBtn(resolve(o[0], p))}: ${esc(o[2])}`]));
    D.rels.filter(r => r[3] === sid).forEach(r => items.push(['Link', `${entBtn(resolve(r[0], p))} ${esc(r[2])} ${entBtn(resolve(r[1], p))}`]));
    D.rels.filter(r => r[5] === sid).forEach(r => items.push(['Ended', `${entBtn(resolve(r[0], p))} ${esc(r[2])} ${entBtn(resolve(r[1], p))}`]));
    D.questions.filter(q => q.raised === sid).forEach(q => items.push(['Question', esc(q.q)]));
    D.questions.filter(q => q.answered === sid && q.answered <= p).forEach(q => items.push(['Answered', `${esc(q.q)} ${esc(q.a)}`]));
    h += `<article class="log"><h3><span class="eyebrow">Part ${s.part} · Scene ${sid}</span>${esc(s.title)}</h3><ul>${items.map(([k, v]) => `<li><span class="k">${k}</span><span>${v}</span></li>`).join('')}</ul></article>`;
  }
  h += `</div></section>`;
  $('#log').innerHTML = h;
}

/* ---------- Entity sheet ---------- */
function openSheet(id) { S.sel = id; renderSheet(); renderGraph(); }
function closeSheet() { S.sel = null; $('#sheet').hidden = true; $('#scrim').hidden = true; renderGraph(); }
function renderSheet() {
  const id = S.sel; if (!id) return;
  const p = S.pos, e = E[id];
  const tlabel = { person: 'Person', place: 'Place', thing: 'Thing', group: 'Group' }[e.type];
  const older = e.names.filter(n => n[0] <= p).map(n => n[1]).filter(n => n !== nameAt(e, p));
  const merged = D.merges.filter(m => m.into === id && m.at <= p);
  const aka = [...older, ...merged.map(m => nameAt(E[m.from], m.at - 1))];
  const ob = obsAt(p).filter(o => o.e === id).sort((a, b) => b.s - a.s);
  const rl = relsAt(p).filter(r => r.a === id || r.b === id).sort((a, b) => a.ended - b.ended || b.s - a.s);
  const scs = D.scenes.filter(s => s.id <= p && (present(s, p).has(id) || mentioned(s, p).has(id) || s.place === id));
  const qs = D.questions.filter(q => q.raised <= p && q.about.map(a => resolve(a, p)).includes(id));
  const img = imgOf(id);
  let h = `<div class="sheet-h gutter"><div><span class="type"><span class="dot ${e.type}"></span>${tlabel} · first seen in scene ${e.first}</span>
      <h2 id="sheet-title">${esc(nameAt(e, p))}</h2>${aka.length ? `<div class="sub">Also known as ${aka.map(esc).join(', ')}</div>` : ''}</div>
      <button class="x" type="button" data-act="close" aria-label="Close">×</button></div><div class="sheet-b gutter">`;
  h += `<div class="pic">${img ? `<img src="${img}" alt="Picture added for ${esc(nameAt(e, p))}">` : `<div class="ph" aria-hidden="true">${esc(nameAt(e, p).replace(/^The /, '').charAt(0))}</div>`}
      <div><div class="acts"><button class="btn" type="button" data-act="img">${img ? 'Replace picture' : 'Add a picture'}</button>${img ? '<button class="btn" type="button" data-act="unimg">Remove</button>' : ''}</div>
      <small>Shows on the graph. Saved in this browser only.</small></div></div>`;
  if (ob.length) h += `<section><h3 class="sec-h">Known so far <span class="n">${ob.length}</span></h3><div class="facts">` + ob.map(o => `
      <div class="fact${o.orig !== id ? ' alias' : ''}"><div class="t">${esc(o.t)}</div><blockquote>${esc(smart('"' + o.q + '"'))}</blockquote>
      <div class="m">Scene ${o.s} <button class="linkbtn" type="button" data-show="${o.s}" data-q="${esc(o.q)}">Show in text</button></div></div>`).join('') + `</div></section>`;
  if (rl.length) h += `<section><h3 class="sec-h">Links <span class="n">${rl.length}</span></h3><div class="links">` + rl.map(r => {
      const txt = r.a === id ? `<span class="r">${esc(r.label)}</span> ${entBtn(r.b)}` : `${entBtn(r.a)} <span class="r">${esc(r.label)}</span>`;
      return `<div class="lnk${r.ended ? ' ended' : ''}">${txt}${r.ended ? ` <span class="r">(until scene ${r.end})</span>` : ''}</div>`;
    }).join('') + `</div></section>`;
  if (qs.length) h += `<section><h3 class="sec-h">Questions</h3><div class="qs">` + qs.map(q => {
      const done = q.answered <= p;
      return `<div class="qcard${done ? ' done' : ''}"><div class="qq">${esc(q.q)}</div>${done ? `<div class="qa">${esc(q.a)}</div>` : '<div class="qm">Still open</div>'}</div>`;
    }).join('') + `</div></section>`;
  h += `<section><h3 class="sec-h">Scenes</h3><div class="scn">${scs.map(s => `<button type="button" class="${present(s, p).has(id) || s.place === id ? 'p' : ''}" data-show="${s.id}" title="${esc(s.title)}">${s.id}</button>`).join('')}</div></section>`;
  h += `</div>`;
  const sh = $('#sheet'); sh.innerHTML = h; sh.hidden = false; $('#scrim').hidden = false;
}

/* ---------- Navigation ---------- */
function showTab(tab) {
  if (wide() && tab === 'read') tab = 'graph';
  S.tab = tab; store.set('tab', tab);
  ['graph', 'timeline', 'index', 'log'].forEach(t => { $('#pane-' + t).hidden = t !== tab; });
  $('#pane-read').hidden = !(wide() || tab === 'read');
  renderDock();
  if (tab === 'graph') { renderGraph(); requestAnimationFrame(sizeGraph); }
  if (tab === 'timeline') renderTimeline();
  if (tab === 'index') renderIndex();
  if (tab === 'log') renderLog();
}
function setPos(p, opts = {}) {
  p = clampPos(p);
  if (p === S.pos && !opts.force) return;
  S.pos = p; S.view = null; S.quote = null; store.set('pos', p);
  renderAll();
  if (!opts.keepScroll) $('#pane-read').scrollTop = 0;
}
function showInText(sid, q) {
  S.view = sid === S.pos ? null : sid; S.quote = q ? { s: sid, q } : null;
  if (S.sel && !wide()) closeSheet();
  if (!wide()) showTab('read');
  renderReader();
  if (!q) $('#pane-read').scrollTop = 0;
}
function renderAll() {
  renderDock(); renderReader();
  if (S.tab === 'graph') renderGraph();
  if (S.tab === 'timeline') renderTimeline();
  if (S.tab === 'index') renderIndex();
  if (S.tab === 'log') renderLog();
  if (S.sel) { if (visible(E[S.sel], S.pos)) renderSheet(); else closeSheet(); }
}

/* ---------- Pictures ---------- */
function addPicture(file, id) {
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 320 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const ok = store.set('img:' + id, c.toDataURL('image/jpeg', 0.82));
      if (!ok) alertInSheet("This browser won't save pictures here. Try a smaller image, or a normal (not private) window.");
      renderSheet(); renderGraph(); if (S.tab === 'index') renderIndex();
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function alertInSheet(msg) { const b = $('#sheet .sheet-b'); if (b) b.insertAdjacentHTML('afterbegin', `<div class="viewing">${esc(msg)}</div>`); }

/* ---------- Events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-id], [data-act], [data-show], [data-filter], [data-scene], .tab');
  if (!t) return;
  if (t.classList.contains('tab')) return showTab(t.dataset.tab);
  if (t.dataset.filter) { S.filters[t.dataset.filter] = !S.filters[t.dataset.filter]; return renderGraph(); }
  if (t.dataset.show) return showInText(+t.dataset.show, t.dataset.q || null);
  if (t.dataset.scene) return showInText(+t.dataset.scene, null);
  if (t.dataset.id) return openSheet(t.dataset.id);
  const a = t.dataset.act;
  if (a === 'next') return setPos(S.pos + 1);
  if (a === 'back') { S.view = null; S.quote = null; renderReader(); $('#pane-read').scrollTop = 0; return; }
  if (a === 'close') return closeSheet();
  if (a === 'img') { const i = $('#img-input'); i.dataset.for = S.sel; i.value = ''; i.click(); return; }
  if (a === 'unimg') { store.set('img:' + S.sel, null); renderSheet(); renderGraph(); return; }
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('nm')) { ev.preventDefault(); openSheet(ev.target.dataset.id); }
  if (ev.key === 'Escape' && S.sel) closeSheet();
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'search') { S.q = ev.target.value; const pos = ev.target.selectionStart; renderIndex(); const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos); }
});
$('#scrim').addEventListener('click', closeSheet);
$('#prev').addEventListener('click', () => setPos(S.pos - 1));
$('#next').addEventListener('click', () => setPos(S.pos + 1));
$('#pos').addEventListener('input', ev => setPos(ev.target.value));
$('#fit').addEventListener('click', () => fitGraph(true));
$('#img-input').addEventListener('change', ev => { const f = ev.target.files[0]; if (f) addPicture(f, ev.target.dataset.for); });
matchMedia('(min-width: 960px)').addEventListener('change', () => showTab(S.tab));

/* ---------- Start ---------- */
$('#book').innerHTML = `${esc(D.book.title)}<small>${esc(D.book.author)}, ${D.book.year}</small>`;
$('#pos').max = N;
renderTicks();
renderReader();
showTab(['read', 'graph', 'timeline', 'index', 'log'].includes(S.tab) ? S.tab : 'graph');
</script>

</body>
</html>
